name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: run tests (merge, generate, validator, manifests)
        run: npm test
      - name: build the example (smoke)
        run: npm run demo

  # The Gherkin BDD end-to-end harness (#19): drives all three faces — SPA (real browser),
  # CLI, MCP — against the actual app. NOT a required merge check yet (scripts/merge-pr.mjs
  # REQUIRED still lists only `test`); a new browser suite proves stable before it can gate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: install Playwright browser + OS deps
        run: npx playwright install --with-deps chromium
      - name: run the E2E suite (build + bddgen + playwright test)
        run: npm run test:e2e
      - name: upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
