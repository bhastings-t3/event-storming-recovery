name: publish

# Fires when release-please's Release PR is merged and it cuts the GitHub
# Release (see .github/workflows/release-please.yml). Publishes to npm via
# OIDC Trusted Publishing — no NPM_TOKEN secret involved.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm CLI 11.5.1+; the npm bundled with
      # setup-node isn't guaranteed to be new enough, so pin explicitly.
      - name: ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: install dependencies
        run: npm ci

      # `prepack` (npm run build) fires automatically during `npm publish`
      # and rebuilds dist/web so the tarball ships the prebuilt SPA.
      - name: publish to npm
        run: npm publish --provenance
