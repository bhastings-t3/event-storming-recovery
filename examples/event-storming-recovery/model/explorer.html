<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Storming Recovery — self-model</title>
<style>
  /* shadcn-style neutral-dark token system (vanilla CSS, no framework) */
  :root {
    --bg: #0a0a0d; --panel: #131317; --card: #17171c; --input: #1a1a21;
    --fg: #f4f4f5; --muted: #9a9aa6; --dim: #d1d1d8;
    --line: #26262d; --accent: #1e1e26; --accent-2: #26262f; --ring: #6b6b7a;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  /* sidebar */
  #sidebar { width: 300px; min-width: 300px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #sidebar header { padding: 16px 18px 13px; border-bottom: 1px solid var(--line); }
  #sidebar h1 { font-size: 14px; font-weight: 650; margin: 0 0 3px; letter-spacing: -.01em; }
  #sidebar .sub { font-size: 11px; color: var(--muted); line-height: 1.4; }
  #search {
    margin: 12px; padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--radius);
    font: inherit; font-size: 13px; width: calc(100% - 24px); background: var(--input); color: var(--fg); outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--ring); box-shadow: 0 0 0 3px rgba(120,120,140,.16); }
  /* group-by switch: pivot the flow list by tier / actor / aggregate */
  #groupby { display: flex; align-items: center; gap: 5px; margin: 0 12px 6px; flex-wrap: wrap; }
  #groupby .gb-cap { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-right: 1px; }
  .gb { font: inherit; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--input); color: var(--muted); cursor: pointer; transition: background .1s, color .1s, border-color .1s; }
  .gb:hover { color: var(--dim); background: var(--accent); }
  .gb.active { background: var(--accent-2); color: #fff; border-color: var(--ring); }
  #flowlist { overflow-y: auto; flex: 1; padding: 4px 8px 16px; }
  .flow-group { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 15px 8px 6px; font-weight: 600; display: flex; align-items: center; }
  .flow-group .fg-dot { width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; flex-shrink: 0; }
  .flow-item { position: relative; padding: 9px 10px 9px 17px; border-radius: var(--radius); cursor: pointer; display: flex; gap: 8px; align-items: center; transition: background .1s; }
  .flow-item::before { content: ''; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--kind, #3f3f46); }
  .flow-item:hover { background: var(--accent); }
  .flow-item.active { background: var(--accent-2); }
  .flow-item.dim { opacity: .5; }
  .flow-item.dim:hover { opacity: .75; }
  .flow-item .nm { flex: 1; min-width: 0; font-size: 12.5px; color: var(--dim); line-height: 1.32; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .flow-item.active .nm { color: #fff; font-weight: 600; }
  .fi-tags { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .status-dot { width: 7px; height: 7px; border-radius: 99px; }
  .status-dot.dead { background: #e5645e; }
  .status-dot.superseded { background: #d2a63a; }
  .hs-count { font-size: 10px; font-weight: 700; color: #e18d88; background: rgba(229,100,94,.14); border-radius: 99px; padding: 1px 6px; min-width: 17px; text-align: center; }
  .badge { font-size: 9px; padding: 2px 7px; border-radius: 99px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; text-transform: uppercase; }
  .badge.dead { background: #3a1414; color: #fca5a5; }
  .badge.superseded { background: #382b10; color: #fcd34d; }
  .badge.read { background: rgba(95,208,138,.15); color: #74dc9b; }
  .badge.write { background: rgba(91,157,240,.15); color: #93c5fd; }
  .badge.policy { background: rgba(187,143,234,.16); color: #d0aef5; }
  .badge.hs { background: rgba(239,78,78,.18); color: #fca5a5; }
  /* main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #flowheader { padding: 18px 24px 15px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #flowheader h2 { margin: 0 0 6px; font-size: 18px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  #flowheader .summary { color: var(--muted); font-size: 12.5px; max-width: 900px; line-height: 1.55; }
  #flowheader .trigger { font-size: 12px; margin-top: 9px; color: var(--dim); }
  #flowheader .trigger b { color: var(--muted); font-weight: 600; }
  /* the board: a subtle dot-grid backdrop for the sticky lane */
  #lane-wrap {
    flex: 1; min-height: 250px; overflow: hidden; padding: 0; position: relative; cursor: grab;
    background-image: radial-gradient(circle, #1b1b22 1px, transparent 1.4px);
    background-size: 22px 22px; background-position: -1px -1px;
  }
  #lane-wrap.grabbing { cursor: grabbing; }
  #lane { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  .zoomctl { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 20; }
  .zoomctl button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 16px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); user-select: none; }
  .zoomctl button:hover { background: var(--line); }
  svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .sticky {
    position: absolute; width: 176px; min-height: 92px; border-radius: var(--radius); padding: 11px 13px; cursor: pointer;
    border: 1px solid rgba(0,0,0,.28); box-shadow: var(--shadow); transition: transform .1s, box-shadow .1s; z-index: 1;
  }
  .sticky:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.55); z-index: 3; }
  .sticky.selected { outline: 2px solid var(--fg); outline-offset: 2px; z-index: 3; }
  .sticky .ntype { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-bottom: 5px; overflow-wrap: anywhere; }
  .sticky .nlabel { font-size: 12.5px; font-weight: 650; line-height: 1.32; overflow-wrap: anywhere; }
  .sticky .flags { position: absolute; bottom: 7px; right: 10px; font-size: 9px; opacity: .72; font-weight: 600; }
  /* corner dot marking a node that appears more than once (same color = same node) */
  .dupdot { position: absolute; top: 7px; right: 8px; width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.5); cursor: pointer; transition: transform .1s; z-index: 4; }
  .dupdot:hover { transform: scale(1.4); }
  .inv .dupdot { top: 5px; right: 6px; width: 8px; height: 8px; }
  /* hover-focus: dim everything except the hovered node's neighborhood + its duplicates */
  .sticky, .inv, .edge-verb { transition: opacity .13s; }
  svg.edges path { transition: opacity .13s; }
  .focusing .sticky.lo, .focusing .inv.lo { opacity: .12; }
  .focusing .edge-verb.lo { opacity: .06; }
  .focusing svg.edges path.lo { opacity: .08; }
  .inv { position: absolute; width: 150px; border-radius: 7px; padding: 7px 10px; font-size: 10.5px; cursor: pointer; line-height: 1.35; transition: transform .1s; overflow-wrap: anywhere; z-index: 1; }
  .inv:hover { transform: translateY(-2px); z-index: 3; }
  .edge-verb { position: absolute; font-size: 9px; color: var(--muted); background: var(--bg); padding: 0 4px; border-radius: 3px; pointer-events: none; letter-spacing: .02em; white-space: nowrap; z-index: 2; transform: translate(-50%, -50%); }
  /* findings band: distinct panel surface below the dark board, scrolls if tall */
  #findings { background: var(--panel); border-top: 1px solid var(--line); flex-shrink: 0; max-height: 30vh; overflow-y: auto; }
  #hotspots { padding: 14px 24px 18px; }
  #hotspots h3, #instances h3 { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; margin: 0 0 11px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  #hotspots h3 { color: #e5645e; }
  #hotspots h3 .n, #instances h3 .n { font-size: 10px; background: var(--accent-2); color: var(--dim); border-radius: 99px; padding: 1px 7px; font-weight: 700; letter-spacing: 0; }
  .hs-cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .hs-card {
    background: rgba(229,100,94,.07); border: 1px solid rgba(229,100,94,.28); border-radius: var(--radius);
    padding: 11px 14px; width: 320px; cursor: pointer; transition: background .12s, border-color .12s, transform .1s;
  }
  .hs-card:hover { background: rgba(229,100,94,.13); border-color: rgba(229,100,94,.5); transform: translateY(-2px); }
  .hs-card b { display: block; font-size: 12px; margin-bottom: 4px; color: #eda3a0; line-height: 1.35; overflow-wrap: anywhere; }
  .hs-card span { font-size: 11px; color: #b98e8c; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; overflow-wrap: anywhere; }
  #instances { padding: 4px 24px 22px; font-size: 12px; }
  #instances h3 { color: var(--muted); }
  #instances table { border-collapse: collapse; width: 100%; }
  #instances tr { border-bottom: 1px solid rgba(255,255,255,.04); }
  #instances td { padding: 5px 16px 5px 0; vertical-align: top; }
  #instances .i-label { color: var(--dim); font-weight: 500; }
  #instances .i-route { color: var(--muted); font: 11px/1.5 ui-monospace, Consolas, monospace; }
  #instances .i-file { color: #7d7d88; font: 11px/1.5 ui-monospace, Consolas, monospace; }
  /* detail panel */
  #detail { width: 0; min-width: 0; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; transition: width .16s, min-width .16s; }
  #detail.open { width: 440px; min-width: 440px; }
  #detail .inner { padding: 20px 22px 32px; }
  #detail h3 { margin: 4px 0 3px; font-size: 16px; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
  #detail .dtype { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; display: inline-block; margin-bottom: 10px; }
  #detail .desc { font-size: 13px; margin-bottom: 14px; color: var(--dim); line-height: 1.6; }
  #detail .chips { margin-bottom: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 10px; background: var(--accent); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; color: var(--muted); font-weight: 600; }
  #detail h4 { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; font-weight: 700; }
  .usage { border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 13px; margin-bottom: 10px; background: var(--card); }
  .usage .uflow { font-size: 10px; font-weight: 700; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .usage .uexp { font-size: 12px; margin-bottom: 9px; white-space: pre-wrap; color: var(--dim); line-height: 1.55; }
  .anchor { display: block; font: 11px/1.65 ui-monospace, "Cascadia Code", Consolas, monospace; color: #7db2f5; text-decoration: none; word-break: break-all; margin-bottom: 2px; }
  .anchor:hover { text-decoration: underline; color: #a5cbf9; }
  .anchor .note { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; }
  /* "appears in" flow rows: each flow is a card whose colored count-dots preview its composition */
  .flowrow { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; background: var(--card); cursor: pointer; transition: background .12s, border-color .12s; }
  .flowrow:hover { background: var(--accent); border-color: var(--ring); }
  .flowrow .fr-name { font-size: 12.5px; font-weight: 600; color: var(--dim); line-height: 1.3; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .flowrow:hover .fr-name { color: #fff; }
  .flowrow .fr-dots { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .cdot { display: inline-flex; align-items: center; justify-content: center; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 99px; font-size: 10.5px; font-weight: 800; border: 1px solid rgba(255,255,255,.14); }
  /* aggregate <-> invariant cross-reference rows: a small colored sticky-chip + label, navigates on click */
  .relrow { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 11px; margin-bottom: 7px; background: var(--card); cursor: pointer; transition: background .12s, border-color .12s; }
  .relrow:hover { background: var(--accent); border-color: var(--ring); }
  .relrow .rdot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.35); }
  .relrow .rlabel { font-size: 12.5px; color: var(--dim); line-height: 1.35; overflow-wrap: anywhere; }
  .relrow:hover .rlabel { color: #fff; }
  #closedetail { float: right; border: 0; background: none; font-size: 15px; cursor: pointer; color: var(--muted); padding: 3px 6px; border-radius: 6px; line-height: 1; }
  #closedetail:hover { background: var(--accent); color: var(--fg); }
  #legend { padding: 12px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; }
  #legend .lg { font-size: 9px; padding: 3px 8px; border-radius: 6px; font-weight: 700; letter-spacing: .02em; }
  /* scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2c2c34; border-radius: 6px; border: 2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a45; }
  /* top tab bar: Flows board vs. Gallery of every sticky */
  #tabbar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .tab { font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 15px; border-radius: 7px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; transition: background .1s, color .1s; }
  .tab:hover { background: var(--accent); color: var(--dim); }
  .tab.active { background: var(--accent-2); color: #fff; border-color: var(--line); }
  #shell { flex: 1; min-height: 0; display: flex; }
  /* gallery: a wall of every sticky in the model, filtered by type chips + search */
  #gallery { flex: 1; min-width: 0; display: none; flex-direction: column; }
  #gallery.show { display: flex; }
  .gallery-head { padding: 16px 24px 13px; border-bottom: 1px solid var(--line); background: var(--panel); flex-shrink: 0; }
  .gallery-head h2 { margin: 0 0 11px; font-size: 18px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .gallery-head h2 .count { font-size: 11px; font-weight: 700; background: var(--accent-2); color: var(--dim); border-radius: 99px; padding: 2px 9px; letter-spacing: 0; }
  .gallery-search { padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; font-size: 13px; width: 100%; max-width: 420px; background: var(--input); color: var(--fg); outline: none; transition: border-color .12s, box-shadow .12s; }
  .gallery-search::placeholder { color: var(--muted); }
  .gallery-search:focus { border-color: var(--ring); box-shadow: 0 0 0 3px rgba(120,120,140,.16); }
  .type-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .tchip { font-size: 10px; font-weight: 700; letter-spacing: .03em; padding: 4px 11px; border-radius: 99px; cursor: pointer; border: 1px solid transparent; user-select: none; text-transform: uppercase; opacity: .38; transition: opacity .1s, box-shadow .1s; }
  .tchip:hover { opacity: .75; }
  .tchip.on { opacity: 1; }
  .tchip-all { background: var(--accent-2); color: var(--dim); border-color: var(--line); }
  .gallery-grid { flex: 1; overflow-y: auto; padding: 18px 24px 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; align-content: start; }
  .gcard { border-radius: var(--radius); padding: 12px 14px; cursor: pointer; border: 1px solid rgba(0,0,0,.28); box-shadow: var(--shadow); position: relative; min-height: 104px; display: flex; flex-direction: column; transition: transform .1s, box-shadow .1s; }
  .gcard:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.55); }
  .gcard.selected { outline: 2px solid var(--fg); outline-offset: 2px; }
  .gcard .gtype { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-bottom: 5px; }
  .gcard .glabel { font-size: 13px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
  .gcard .gdesc { font-size: 11px; line-height: 1.45; margin-top: 6px; opacity: .82; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .gcard .gmeta { margin-top: auto; padding-top: 9px; font-size: 10px; font-weight: 600; opacity: .72; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .gcard .gdead { background: rgba(0,0,0,.2); border-radius: 99px; padding: 1px 8px; text-transform: uppercase; letter-spacing: .04em; }
  .gempty { grid-column: 1 / -1; color: var(--muted); font-size: 13px; padding: 22px 2px; }
  /* overview: the whole model at once — every flow rendered inside its own bounded-context box */
  #overview { flex: 1; min-width: 0; display: none; flex-direction: column; }
  #overview.show { display: flex; }
  /* Glossary: the ubiquitous language as a readable, alphabetical dictionary */
  #glossary { flex: 1; min-width: 0; display: none; flex-direction: column; }
  #glossary.show { display: flex; }
  .gl-head { padding: 16px 24px 13px; border-bottom: 1px solid var(--line); background: var(--panel); flex-shrink: 0; }
  .gl-head h2 { margin: 0 0 11px; font-size: 18px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .gl-head h2 .count { font-size: 11px; font-weight: 700; background: var(--accent-2); color: var(--dim); border-radius: 99px; padding: 2px 9px; letter-spacing: 0; }
  .gl-search { width: 100%; max-width: 520px; padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; font-size: 13px; background: var(--input); color: var(--fg); outline: none; margin-bottom: 11px; }
  .gl-search::placeholder { color: var(--muted); }
  .gl-search:focus { border-color: var(--ring); box-shadow: 0 0 0 3px rgba(120,120,140,.16); }
  .gl-body { flex: 1; display: flex; min-height: 0; }
  .gl-list { flex: 1; overflow-y: auto; padding: 4px 20px 44px 24px; }
  .gl-rail { flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 8px 9px; border-left: 1px solid var(--line); background: var(--panel); }
  .gl-rail span { font-size: 10px; font-weight: 700; color: var(--muted); cursor: pointer; padding: 1px 5px; border-radius: 4px; text-align: center; }
  .gl-rail span:hover { background: var(--accent-2); color: #fff; }
  .gl-letter { font-size: 20px; font-weight: 750; color: var(--fg); padding: 20px 0 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; letter-spacing: -.02em; position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .gl-entry { padding: 12px 8px 14px 12px; border-bottom: 1px solid var(--accent); border-left: 2px solid transparent; transition: background .08s; }
  .gl-entry:hover { background: var(--accent); }
  .gl-entry.flagged { border-left-color: rgba(229,100,94,.55); background: rgba(229,100,94,.04); }
  .gl-entry.flagged:hover { background: rgba(229,100,94,.09); }
  .gl-term { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .gl-badge { font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; flex-shrink: 0; }
  .gl-name { font-size: 15px; font-weight: 650; color: var(--fg); overflow-wrap: anywhere; }
  .gl-flag { font-size: 9px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: rgba(229,100,94,.16); color: #eda3a0; border: 1px solid rgba(229,100,94,.4); }
  .gl-aka { font-size: 11px; font-style: italic; color: var(--muted); }
  .gl-flows { font-size: 10.5px; font-weight: 600; color: var(--muted); }
  .gl-def { font-size: 12.5px; line-height: 1.5; color: var(--dim); margin-top: 6px; overflow-wrap: anywhere; }
  .gl-oq { font-size: 12px; line-height: 1.5; color: #b98e8c; margin-top: 7px; padding: 7px 11px; background: rgba(229,100,94,.07); border: 1px solid rgba(229,100,94,.25); border-radius: var(--radius); overflow-wrap: anywhere; }
  .gl-oq b { color: #eda3a0; }
  .gl-used { margin-top: 9px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .gl-nchip { font-size: 10px; font-weight: 600; color: var(--dim); background: var(--accent-2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; cursor: pointer; }
  .gl-nchip:hover { color: #fff; }
  .gl-fchip { font-size: 10px; font-weight: 600; color: var(--muted); background: var(--accent-2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; cursor: pointer; }

ch the recovery/merge pipeline regenerates and would wipe) and keys every note by the item's stable type:id so comments survive a model rebuild. It receives AddComment/RemoveComment and emits CommentAdded; its write to disk is best-effort.","flowCount":4,"flows":["add-comment","copy-for-claude","launch-explorer","mcp-get-current-selection"]},{"id":"ext-browser","type":"externalSystem","label":"Web browser","description":"The browser running the React explorer SPA. It fetched the whole model once from GET /api/model at boot and holds it in memory; clicking the 'Data model' tab flips the SPA into the DataModel view, which renders the physical layer as a pannable containment graph. The rendering never re-hits the server.","flowCount":4,"flows":["build-example","generate-views","launch-explorer","open-data-model-tab"]},{"id":"agg-context-bundle","type":"aggregate","label":"Context Bundle","description":"The insertion-ordered set of typed refs { type: 'node' | 'flow' | 'hotspot', id } the human has gathered in the explorer (right-click, 'Add to context bundle'). Purely in-memory session state; the read half consumed by the selected-nodes MCP resource. Shares one createState() closure with the current selection (agg-selection); modeled as a distinct aggregate here because the resource reads only the bundle.","flowCount":3,"flows":["build-context-bundle","copy-for-claude","mcp-read-tools"]},{"id":"cmd-merge-traces","type":"command","label":"MergeTraces","description":"Fold every per-flow trace document into one canonical, validated model. Invoked in-process by ResolveModel's --traces tier (merge-on-the-fly) instead of via the es-merge CLI; resolveModel throws if the merge reports any validation error, so the session never serves an invalid merged model.","flowCount":3,"flows":["build-example","merge-traces","resolve-model"]},{"id":"ds-repo-fs","type":"datastore","label":"repo checkout (repoRoot)","description":"The recovered project's source directory (services.repoRoot). ns store.get(...)"}]}]},{"id":"agg-comment-store","type":"aggregate","label":"Comment Store","inferred":true,"description":"The human-comments boundary: an in-memory Map of 'type:id' -> [{ id, text, at }] created per server run, mirrored to a comments.json sidecar next to the model. It deliberately lives OUTSIDE flows.json (which the recovery/merge pipeline regenerates and would wipe) and keys every note by the item's stable type:id so comments survive a model rebuild. It receives AddComment/RemoveComment and emits CommentAdded; its write to disk is best-effort.","tactical":{"explanation":"The pure CommentStore class (domain/comment-store/comment-store.ts) holds the in-memory byKey Map; load(doc) reproduces it from a prior sidecar doc. add(type,id,text) appends a record under key(type,id) = `${type}:${id}`, throws EmptyCommentError on blank text, and calls onChange(); remove() filters by comment id and re-calls onChange(). The fs comment-repository adapter (adapters/fs/comment-repository.ts) wires onChange to persist(), which serializes { version: 1, comments } (only non-empty lists) via fs.writeFileSync, and on load seeds the store from an existing sidecar (a corrupt file is swallowed and the store starts empty rather than crashing); on any write error it logs once (warned flag) and keeps the comment in memory for the session. The store is wired in adapters/cli/es-view.ts's runView: commentsPath = path.dirname(resolved.sourcePath)/comments.json (i.e. next to flows.json), passed into buildServices as services.comments and shared by the HTTP API and the MCP handler.","anchors":[{"path":"src/domain/comment-store/comment-store.ts","line":29,"symbol":"CommentStore","note":"in-memory byKey Map; the aggregate's state"},{"path":"src/adapters/fs/comment-repository.ts","line":9,"symbol":"createCommentStore","note":"warned flag; seeds byKey from existing sidecar; wires onChange -> persist"},{"path":"src/domain/comment-store/comment-store.ts","line":64,"symbol":"add","note":"build record, append under type:id key, calls onChange()"},{"path":"src/domain/comment-store/comment-store.ts","line":27,"symbol":"key","note":"key = `${type}:${id}` — the stable survival key"},{"path":"src/adapters/cli/es-view.ts","line":62,"symbol":"runView","note":"commentsPath = dirname(sourcePath)/comments.json; createCommentStore"}]},"fields":[{"name":"key","conceptual":true,"dataType":"string","derivation":"The map key under which an item's comments are stored, composed as `${type}:${id}` from the item's kind (node/flow/hotspot) and its STABLE model id. Because the id is stable across model regeneration and the store is a sidecar (not inside the regenerated flows.json), comments re-attach to the same item after a rebuild. This is a design property of the store, not a runtime-checked guard.","sources":[{"ref":"fld-comment-key","role":"derived-from","transform":"transformation","note":"`${type}:${id}`"}],"expression":"`${type}:${id}`","confidence":"high","provenance":["inferred"],"evidence":[{"path":"src/domain/comment-store/comment-store.ts","line":27,"symbol":"key"}]},{"name":"text","conceptual":true,"dataType":"string","derivation":"The human note body, trimmed of surrounding whitespace at record time.","sources":[{"ref":"fld-comment-text","role":"derived-from","transform":"transformation","note":"String(text).trim()"}],"confidence":"high","provenance":["inferred"],"evidence":[{"path":"src/domain/comment-store/comment-store.ts","line":67,"symbol":"add"}]},{"name":"id","conceptual":true,"dataType":"string","derivation":"Per-comment identifier, the first 8 chars of a randomUUID(). Used to target a specific comment for deletion within an item's list.","sources":[{"ref":"fld-comment-id","role":"derived-from","transform":"transformation","note":"randomUUID().slice(0,8)"}],"confidence":"high","provenance":["inferred"],"evidence":[{"path":"src/domain/comment-store/comment-store.ts","line":67,"symbol":"add"}]},{"name":"at","conceptual":true,"dataType":"timestamp","derivation":"ISO-8601 creation timestamp (new Date().toISOString()); the dialog and grounded markdown render only the yyyy-mm-dd prefix.","sources":[{"ref":"fld-comment-at","role":"derived-from","transform":"identity","note":"new Date().toISOString()"}],"confidence":"high","provenance":["inferred"],"evidence":[{"path":"src/domain/comment-store/comment-store.ts","line":67,"symbol":"add"}]}],"usages":[{"flow":"add-comment","explanation":"The pure CommentStore class (domain/comment-store/comment-store.ts) holds the in-memory byKey Map; load(doc) reproduces it from a prior sidecar doc. add(type,id,text) appends a record under key(type,id) = `${type}:${id}`, throws EmptyCommentError on blank text, and calls onChange(); remove() filters by comment id and re-calls onChange(). The fs comment-repository adapter (adapters/fs/comment-repository.ts) wires onChange to persist(), which serializes { version: 1, comments } (only non-empty lists) via fs.writeFileSync, and on load seeds the store from an existing sidecar (a corrupt file is swallowed and the store starts empty rather than crashing); on any write error it logs once (warned flag) and keeps the comment in memory for the session. The store is wired in adapters/cli/es-view.ts's runView: commentsPath = path.dirname(resolved.sourcePath)/comments.json (i.e. next to flows.json), passed into buildServices as services.comments and shared by the HTTP API and the MCP handler.","anchors":[{"path":"src/domain/comment-store/comment-store.ts","line":29,"symbol":"CommentStore","note":"in-memory byKey Map; the aggregate's state"},{"path":"src/adapters/fs/comment-repository.ts","line":9,"symbol":"createCommentStore","note":"warned flag; seeds byKey from existing sidecar; wires onChange -> persist"},{"path":"src/domain/comment-store/comment-store.ts","line":64,"symbol":"add","note":"build record, append under type:id key, calls onChange()"},{"path":"src/domain/comment-store/comment-store.ts","line":27,"symbol":"key","note":"key = `${type}:${id}` — the stable survival key"},{"path":"src/adapters/cli/es-view.ts","line":62,"symbol":"runView","note":"commentsPath = dirname(sourcePath)/comments.json; createCommentStore"}]},{"flow":"copy-for-claude","explanation":"buildNodeContext / buildFlowContext / buildHotspotContext read services.comments.get(type, id); renderComments emits the markdown block. If no comment store is wired the block is simply omitted. The comment store's keyed-map + text-nonempty invariant now live in domain/comment-store/comment-store.ts; persistence to the comments.json sidecar is the fs comment-repository adapter's job.","anchors":[{"path":"src/application/read-models/context.ts","line":153,"symbol":"renderComments","note":"renders the human-notes markdown block appended to each item"},{"path":"src/application/read-models/context.ts","line":148,"symbol":"buildNodeContext","note":"services.comments.get('node', id) folded into the context"}]},{"flow":"launch-explorer","explanation":"runView() (src/adapters/cli/es-view.ts) builds commentsPath = path.dirname(resolved.sourcePath)/comments.json and calls createCommentStore(commentsPath) (src/adapters/fs/comment-repository.ts), which, if the file exists, JSON.parses it and loads it into the domain CommentStore (src/domain/comment-store/comment-store.ts); a corrupt sidecar is swallowed (start empty rather than crash). The store is passed into buildServices so /api/comments and the MCP context render human notes.","anchors":[{"path":"src/adapters/cli/es-view.ts","line":62,"symbol":"runView","note":"commentsPath = dirname(sourcePath)/comments.json; createCommentStore(commentsPath)"},{"path":"src/adapters/fs/comment-repository.ts","line":9,"symbol":"createCommentStore","note":"hydrate the domain CommentStore from the sidecar if present; tolerate corrupt file"}]},{"flow":"mcp-get-current-selection","explanation":"CommentStore keys notes by 'type:id'. buildNodeContext calls services.comments.get('node', n.id) and folds the result into the projection, so the markdown the MCP client receives carries the human's notes alongside the recovered concept. Read-only here; writes come from POST /api/comments. The in-memory Map + validation live in the domain CommentStore class; loading/persisting the comments.json sidecar is a separate fs adapter (createCommentStore) that wires the store's onChange to persist.","anchors":[{"path":"src/domain/comment-store/comment-store.ts","line":50,"symbol":"get","note":"get(type,id) returns the human notes for the node"},{"path":"src/adapters/fs/comment-repository.ts","line":9,"symbol":"createCommentStore","note":"in-memory CommentStore wired to load/persist the comments.json sidecar"}]}]},{"id":"inv-comment-target-exists","type":"invariant","label":"A comment must target an existing model item","inferred":true,"description":"ERROR-level guard: AddComment is rejected unless its { type, id } resolves to a real model item — a flow id, a hotspot id, or a node id. A missing id or an unknown item returns HTTP 404 and no comment is recorded. This keeps the sidecar's type:id keys pointing at items the model actually contains.","tactical":{"explanation":"In the addComment command (application/commands/add-comment.ts), the body's type defaults to 'node' by the route; if !id or !itemExists(services, type, id) the command returns a not-found status, which the server route maps to HTTP 404 before store.add is reached. itemExists (application/read-models/items.ts) checks services.model.flows for a flow, services.indexes.hotspotById for a hotspot, else services.indexes.nodeById for a node. Enforced in the command handler rather than inside the CommentStore class, but it is the comment-store boundary's guard.","anchors":[{"path":"src/application/commands/add-comment.ts","line":18,"symbol":"addComment","note":"not-found status when !itemExists, mapped to HTTP 404 by the route"},{"path":"src/application/read-models/items.ts","line":5,"symbol":"itemExists","note":"flow/hotspot/node existence check"}]},"usages":[{"flow":"add-comment","explanation":"In the addComment command (application/commands/add-comment.ts), the body's type defaults to 'node' by the route; if !id or !itemExists(services, type, id) the command returns a not-found status, which the server route maps to HTTP 404 before store.add is reached. itemExists (application/read-models/items.ts) checks services.model.flows for a flow, services.indexes.hotspotById for a hotspot, else services.indexes.nodeById for a node. Enforced in the command handler rather than inside the CommentStore class, but it is the comment-store boundary's guard.","anchors":[{"path":"src/application/commands/add-comment.ts","line":18,"symbol":"addComment","note":"not-found status when !itemExists, mapped to HTTP 404 by the route"},{"path":"src/application/read-models/items.ts","line":5,"symbol":"itemExists","note":"flow/hotspot/node existence check"}]}]},{"id":"inv-comment-text-nonempty","type":"invariant","label":"A comment's text must be non-empty","inferred":true,"description":"ERROR-level guard: AddComment with blank/whitespace-only text is rejected with HTTP 400 'empty comment' and nothing is stored. The SPA also disables the submit button and returns early on empty text, and the store trims again at record time, but the server 400 is the authoritative rejection.","tactical":{"explanation":"The addComment command (application/commands/add-comment.ts) computes trimmed = (text || '').trim(); if !trimmed it returns an invalid status with error 'empty comment', which the server route maps to HTTP 400, before store.add is reached. The CommentStore class itself also enforces this invariant defense-in-depth: add() throws EmptyCommentError when the trimmed text is blank (domain/comment-store/comment-store.ts) — the shared home for the text-nonempty rule regardless of caller. Defense in depth: CommentDialog.submit returns early when text.trim() is falsy and the 'Add comment' button is disabled on !text.trim().","anchors":[{"path":" onatomic-persist).","tactical":{"explanation":"Realized inside CommentStore.add: byKey.set(k, [...(byKey.get(k)||[]), comment]) records the note in memory, then onChange() (wired by the fs comment-repository adapter to persist()) attempts the sidecar write. The handler returns store.get(type,id) (the fresh list) with HTTP 200; store.jsx setItemComments folds it into the SPA `comments` state so the dialog re-renders. The in-memory update always succeeds and is what the API confirms; durability is best-effort.","anchors":[{"path":"src/domain/comment-store/comment-store.ts","line":69,"symbol":"add","note":"byKey.set appends the record in memory (the fact)"},{"path":"src/domain/comment-store/comment-store.ts","line":70,"symbol":"add","note":"onChange() best-effort write-through, wired to persist() by the fs adapter"},{"path":"src/adapters/http/server.ts","line":169,"symbol":"createServer","note":"200 with result.comments (store.get(type,id))"}]},"usages":[{"flow":"add-comment","explanation":"Realized inside CommentStore.add: byKey.set(k, [...(byKey.get(k)||[]), comment]) records the note in memory, then onChange() (wired by the fs comment-repository adapter to persist()) attempts the sidecar write. The handler returns store.get(type,id) (the fresh list) with HTTP 200; store.jsx setItemComments folds it into the SPA `comments` state so the dialog re-renders. The in-memory update always succeeds and is what the API confirms; durability is best-effort.","anchors":[{"path":"src/domain/comment-store/comment-store.ts","line":69,"symbol":"add","note":"byKey.set appends the record in memory (the fact)"},{"path":"src/domain/comment-store/comment-store.ts","line":70,"symbol":"add","note":"onChange() best-effort write-through, wired to persist() by the fs adapter"},{"path":"src/adapters/http/server.ts","line":169,"symbol":"createServer","note":"200 with result.comments (store.get(type,id))"}]}]},{"id":"rm-item-comments","type":"readModel","label":"Item comments (dialog + grounded context)","inferred":true,"description":"The list of human notes for an item, read back in two places: the SPA CommentDialog (each note's text and yyyy-mm-dd date, with a delete ✕) and the grounded markdown a connected Claude session receives via MCP — every node/flow/hotspot context block appends a 'Comments (human notes)' section. This is how a browser-side note becomes visible to Claude.","tactical":{"explanation":"SPA: on load store.jsx getComments() hydrates the `comments` map ({ 'type:id': [...] }); commentsFor(type,id) feeds CommentDialog's list, and each AddComment/RemoveComment response refreshes just that key via setItemComments. Server GET /api/comments calls the listComments query (application/queries/list-comments.ts), which returns store.all() or store.get(type,id). MCP/grounded context: application/read-models/context.ts attaches services.comments.get('node'|'flow'|'hotspot', id) onto each context object and renderComments() emits the '**Comments (human notes):**' bullet list into the markdown rendered for the model.","anchors":[{"path":"src/web/store.jsx","line":80,"symbol":"commentsFor","note":"comments['type:id'] || []"},{"path":"src/web/components/CommentDialog.jsx","line":49,"symbol":"CommentDialog","note":"renders the comment list + dates"},{"path":"src/application/queries/list-comments.ts","line":5,"symbol":"listComments","note":"GET /api/comments -> store.all() or store.get(type,id)"},{"path":"src/application/read-models/context.ts","line":153,"symbol":"renderComments","note":"'Comments (human notes)' markdown block"},{"path":"src/application/read-models/context.ts","line":148,"symbol":"buildNodeContext","note":"comments attached to node/flow/hotspot context"}]},"usages":[{"flow":"add-comment","explanation":"SPA: on load store.jsx getComments() hydrates the `comments` map ({ 'type:id': [...] }); commentsFor(type,id) feeds CommentDialog's list, and each AddComment/RemoveComment response refreshes just that key via setItemComments. Server GET /api/comments calls the listComments query (application/queries/list-comments.ts), which returns store.all() or store.get(type,id). MCP/grounded context: application/read-models/context.ts attaches services.comments.get('node'|'flow'|'hotspot', id) onto each context object and renderComments() emits the '**Comments (human notes):**' bullet list into the markdown rendered for the model.","anchors":[{"path":"src/web/store.jsx","line":80,"symbol":"commentsFor","note":"comments['type:id'] || []"},{"path":"src/web/components/CommentDialog.jsx","line":49,"symbol":"CommentDialog","note":"renders the comment list + dates"},{"path":"src/application/queries/list-comments.ts","line":5,"symbol":"listComments","note":"GET /api/comments -> store.all() or store.get(type,id)"},{"path":"src/application/read-models/context.ts","line":153,"symbol":"renderComments","note":"'Comments (human notes)' markdown block"},{"path":"src/application/read-models/context.ts","line":148,"symbol":"buildNodeContext","note":"comments attached to node/flow/hotspot context"}]}]},{"id":"ext-claude-mcp","type":"externalSystem","label":"Connected Claude (MCP client)","inferred":false,"description":"A connected Claude session acting as an MCP client over the /mcp boundary in the same process. It is the downstream consumer this whole flow exists to serve: after the operator clicks, Claude pulls the selection via the get_current_selection MCP tool to answer about 'the node the user is looking at'. Pull-based -- it reads only when it needs to. The grounded read path (rm-current-selection + buildNodeContext) is traced separately as the claude-mcp-read flow; here it is referenced only as the reader that justifies mirroring the click.","tactical":{"explanation":"SESSION TRANSPORT (plumbing, kept in tactical per the two-plane rule): createMcpHandler holds a `transports` Map keyed by Mcp-Session-Id. An `initialize` POST with no session id spins up a StreamableHTTPServerTransport (randomUUID sessionIdGenerator, enableJsonResponse) and connects a FRESH McpServer (buildMcpServer) that closes over the shared `services` + session (selection, bundle); onsessioninitialized registers the transport. Later POST/GET/DELETE reuse it by session id; transport.onclose deletes the session. Request bodies are capped at 4MB (readJsonBody destroys the socket past 4_000_000 bytes). Unknown node/flow ids come back as a plain text result (not an MCP protocol error) so the client can recover without a retry loop. RESOLVED: the pre-refactor mcp.mjs header comment called the transport 'stateless', contradicting the stateful per-session implementation and mcp.md. The refactored mcp-server.ts header comment drops that claim entirely, and its createMcpHandler JSDoc plainly states 'Stateful over streamable HTTP' — the old contradiction is gone.","anchors":[{"path":"src/adapters/mcp/mcp-server.ts","line":117,"symbol":"createMcpHandler","note":"transports Map keyed by Mcp-Session-Id"},{"path":"src/adapters/mcp/mcp-server.ts","line":128,"symbol":"mcpHandler","note":"initialize => new StreamableHTTPServerTransport + fresh McpServer over shared services/selection/bundle"},{"path":"src/adapters/mcp/mcp-server.ts","line":1,"symbol":"header comment","note":"no longer claims 'stateless'; createMcpHandler JSDoc (mcp-server.ts:111) now says 'Stateful over streamable HTTP' — the old contradiction with mcp.md is resolved"}]},"usages":[{"flow":"add-comment","explanation":"createMcpHandler(services, selection, bundle) (adapters/cli/es-view.ts) is built from the SAME services bundle passed to createServer, so it shares services.comments with the HTTP API; the context renderers (application/read-models/context.ts) fold each item's comments into the grounded markdown the MCP tools return.","anchors":[{"path":"src/application/read-models/context.ts","line":148,"symbol":"buildNodeContext","note":"services.comments.get('node', id) into context"},{"path":"src/adapters/cli/es-view.ts","line":65,"symbol":"runView","note":"createMcpHandler(services, selection, bundle) shares the comment store via services"}]},{"flow":"build-context-bundle","explanation":"mcp-server.ts registers the resource 'selected-nodes' at event-storming://selected-nodes; its read handler returns renderBundleMarkdown(services, bundle.list()) over the SAME shared ContextBundle instance the /api/context routes mutate, so a browser add is visible to Claude on its next resource read.","anchors":[{"path":"src/adapters/mcp/mcp-server.ts","line":83,"symbol":"buildMcpServer","note":"event-storming://selected-nodes reads bundle.list()"}]},{"flow":"copy-for-claude","explanation":"Off-process; the operator pastes the copied markdown into any Claude chat. Referenced here only as the destination of the export -- not re-derived.","anchors":[]},{"flow":"mcp-get-current-selection","explanation":"Reaches the tool through POST /mcp, handled by createMcpHandler: an `initialize` POST spins up a per-session StreamableHTTP transport, and each session's tools close over the ONE shared services + session (selection, bundle), so the client always reads the live selection. The tool result is markdown the session pastes into its own context.","anchors":[{"path":"src/adapters/mcp/mcp-server.ts","line":116,"symbol":"createMcpHandler","note":"streamable-HTTP transport per MCP session; all sessions share services+selection+bundle"},{"path":"src/adapters/mcp/mcp-server.ts","line":26,"symbol":"buildMcpServer","note":"McpServer 'event-storming-recovery' the client connects to"}]},{"flow":"mcp-read-tools","explanation":"SESSION TRANSPORT (plumbing, kept in tactical per the two-plane rule): createMcpHandler holds a `transports` Map keyed by Mcp-Session-Id. An `initialize` POST with no session id spins up a StreamableHTTPServerTransport (randomUUID sessionIdGenerator, enableJsonResponse) and connects a FRESH McpServer (buildMcpServer) that closes over the shared `services` + session (selection, bundle); onsessioninitialized registers the transport. Later POST/GET/DELETE reuse it by session id; transport.onclose deletes the session. Request bodies are capped at 4MB (readJsonBody destroys the socket past 4_000_000 bytes). Unknown node/flow ids come back as a plain text result (not an MCP protocol error) so the client can recover without a retry loop. RESOLVED: the pre-refactor mcp.mjs header comment called the transport 'stateless', contradicting the stateful per-session implementation and mcp.md. The refactored mcp-server.ts header comment drops that claim entirely, and its createMcpHandler JSDoc plainly states 'Stateful over streamable HTTP' — the old contradiction is gone.","anchors":[{"path":"src/adapters/mcp/mcp-server.ts","line":117,"symbol":"createMcpHandler","note":"transports Map keyed by Mcp-Session-Id"},{"path":"src/adapters/mcp/mcp-server.ts","line":128,"symbol":"mcpHandler","note":"initialize => new StreamableHTTPServerTransport + fresh McpServer over shared services/selection/bundle"},{"path":"src/adapters/mcp/mcp-server.ts","line":1,"symbol":"header comment","note":"no longer claims 'stateless'; createMcpHandler JSDoc (mcp-server.ts:111) now says 'Stateful over streamable HTTP' — the old contradiction with mcp.md is resolved"}]},{"flow":"open-data-model-tab","explanation":"POST /mcp is served in-process by createMcpHandler; buildMcpServer registers list_data_model whose handler calls the listDataModel query, which itself returns renderDataModelMarkdown(services). The tool closes over the same shared `services` (model + indexes) the SPA API serves, so operator and Claude read one source of truth. list_data_model does NOT touch the filesystem (unlike the source-grounded tools) — it is a pure in-memory projection.","anchors":[{"path":"src/adapters/mcp/mcp-server.ts","line":74,"symbol":"list_data_model","note":"registerTool 'list_data_model'"},{"path":"src/application/queries/list-data-model.ts","line":6,"symbol":"listDataModel","note":"handler's query => renderDataModelMarkdown(services)"}]},{"flow":"select-n mitted ones (see hot-demo-example-drift). Unchanged by the TS refactor.","anchors":[{"path":".github/workflows/ci.yml","line":19,"symbol":"build the example (smoke)","note":"CI step: run: npm run demo"}]},"usages":[{"flow":"build-example","explanation":"The ci job runs `npm test` then `npm run demo`. The demo step is purely a smoke build: it regenerates the example in place and CI only asserts the process exits 0 -- it never diffs the regenerated artifacts against the committed ones (see hot-demo-example-drift). Unchanged by the TS refactor.","anchors":[{"path":".github/workflows/ci.yml","line":19,"symbol":"build the example (smoke)","note":"CI step: run: npm run demo"}]}]},{"id":"cmd-build-example","type":"command","label":"BuildExample","inferred":true,"description":"Rebuild the bundled self-model example end to end: an operator-run (or CI-run) automation that sequentially invokes es-merge and then es-generate over the committed example's traces, regenerating examples/event-storming-recovery/model/{flows.json,flows.dot,explorer.html}. Pure composition -- it owns no domain state; it sequences and wires the two already-traced CLIs.","tactical":{"explanation":"scripts/build-example.mjs (the `npm run demo` script). Computes root = repo root, ex = examples/event-storming-recovery, model = ex/model/flows.json. A `run` helper does execFileSync('node', args, { stdio:'inherit', cwd: root }) -- child stdout/stderr stream through, and a NONZERO child exit THROWS, aborting the chain. Now that the Node side is TypeScript, the script FIRST compiles the CLIs with `tsc -p tsconfig.node.json` (a step that didn't exist pre-refactor) before invoking the compiled `dist/node/adapters/cli/cli.js`. It then calls the unified CLI's `merge` subcommand with (ex/traces, model) to write flows.json, THEN calls the `generate` subcommand with (model, ex/model, --repo-root root, --title 'Event Storming Recovery — self-model'). The ordering is load-bearing: generate reads the very flows.json the merge just wrote. Because merge writes flows.json even on validation error but exits 1, a broken trace set overwrites the committed flows.json and then throws before generate runs (see hot-demo-example-drift). Same script backs the CI smoke build (.github/workflows/ci.yml).","anchors":[{"path":"scripts/build-example.mjs","line":11,"symbol":"run","note":"execFileSync('node', args, {stdio:'inherit', cwd:root}) -- throws on nonzero exit"},{"path":"scripts/build-example.mjs","line":14,"symbol":"build-example","note":"NEW: compile the TS CLIs (tsc -p tsconfig.node.json) before invoking dist/node/adapters/cli/cli.js"},{"path":"scripts/build-example.mjs","line":16,"symbol":"build-example","note":"run cli.js merge (ex/traces -> model/flows.json)"},{"path":"scripts/build-example.mjs","line":17,"symbol":"build-example","note":"run cli.js generate (model -> ex/model/{flows.dot,explorer.html})"},{"path":"package.json","line":43,"symbol":"scripts.demo","note":"\"demo\": \"node scripts/build-example.mjs\""}]},"usages":[{"flow":"build-example","explanation":"scripts/build-example.mjs (the `npm run demo` script). Computes root = repo root, ex = examples/event-storming-recovery, model = ex/model/flows.json. A `run` helper does execFileSync('node', args, { stdio:'inherit', cwd: root }) -- child stdout/stderr stream through, and a NONZERO child exit THROWS, aborting the chain. Now that the Node side is TypeScript, the script FIRST compiles the CLIs with `tsc -p tsconfig.node.json` (a step that didn't exist pre-refactor) before invoking the compiled `dist/node/adapters/cli/cli.js`. It then calls the unified CLI's `merge` subcommand with (ex/traces, model) to write flows.json, THEN calls the `generate` subcommand with (model, ex/model, --repo-root root, --title 'Event Storming Recovery — self-model'). The ordering is load-bearing: generate reads the very flows.json the merge just wrote. Because merge writes flows.json even on validation error but exits 1, a broken trace set overwrites the committed flows.json and then throws before generate runs (see hot-demo-example-drift). Same script backs the CI smoke build (.github/workflows/ci.yml).","anchors":[{"path":"scripts/build-example.mjs","line":11,"symbol":"run","note":"execFileSync('node', args, {stdio:'inherit', cwd:root}) -- throws on nonzero exit"},{"path":"scripts/build-example.mjs","line":14,"symbol":"build-example","note":"NEW: compile the TS CLIs (tsc -p tsconfig.node.json) before invoking dist/node/adapters/cli/cli.js"},{"path":"scripts/build-example.mjs","line":16,"symbol":"build-example","note":"run cli.js merge (ex/traces -> model/flows.json)"},{"path":"scripts/build-example.mjs","line":17,"symbol":"build-example","note":"run cli.js generate (model -> ex/model/{flows.dot,explorer.html})"},{"path":"package.json","line":43,"symbol":"scripts.demo","note":"\"demo\": \"node scripts/build-example.mjs\""}]}]},{"id":"cmd-merge-traces","type":"command","label":"MergeTraces","inferred":true,"description":"Fold every per-flow trace document into one canonical, validated model. Invoked in-process by ResolveModel's --traces tier (merge-on-the-fly) instead of via the es-merge CLI; resolveModel throws if the merge reports any validation error, so the session never serves an invalid merged model.","tactical":{"explanation":"A deterministic ETL transform kept in a single plane per the two-plane rule (parse/seed/union/validate stages are NOT promoted to aggregates/policies/events). The refactor made the command boundary explicit: mergeTraces (src/application/commands/merge-traces.ts) is now the application-layer command handler — it reads the trace dir through the ModelRepository port (readTraceDocs), delegates to the pure domain mergeTraceDocs (src/domain/model/merge.ts) for the seed/union/validate/build pipeline, and returns { model, errors, warnings, files }. mergeTraceDocs itself: (1) SEEDS/UNIONS nodes into a Map keyed by global id: first-seen type/label wins; longest description wins; ownedBy / synchronous / inferred-false / physical attrs (parent, storeKind, fieldKind, dataType, host, engine, nullable) fill forward; fields[] union by name (a later data-pass trace is authoritative on a field); provenance set-unioned; each source's tactical block appended as a per-flow `usages` entry. (2) flows deduped by id, hotspots/terms deduped keeping first. (3) VALIDATE against every invariant (crossValidate, src/domain/model/invariants.ts), accumulating errors[] and warnings[]. (4) Build the model with derived meta. The CLI (src/adapters/cli/es-merge.ts, runMerge) owns IO: writes flows.json via writeModelFile and maps errors to exit 1; resolveModel (src/application/commands/resolve-model.ts) throws on errors so the server never serves an invalid model.","anchors":[{"path":"src/application/commands/merge-traces.ts","line":16,"symbol":"mergeTraces","note":"application command: read trace dir via the ModelRepository port, delegate to mergeTraceDocs"},{"path":"src/domain/model/merge.ts","line":21,"symbol":"mergeTraceDocs","note":"pure domain: seed/union nodes, accumulate flows, validate, build model"},{"path":"src/adapters/cli/es-merge.ts","line":17,"symbol":"runMerge","note":"CLI front end: argv, writeModelFile, exit codes"},{"path":"src/application/commands/resolve-model.ts","line":26,"symbol":"resolveModel","note":"in-memory --traces path; throws on any validation error"}]},"usages":[{"flow":"build-example","explanation":"Invoked by build-example.mjs as a child `node dist/node/adapters/cli/cli.js merge \u003cex/traces> \u003cmodel/flows.json>` process. It reads the bundled example's traces directory and writes the merged flows.json, exiting 1 on any validation error (which would abort the demo's execFileSync chain). The unified CLI's `merge` subcommand (cli.ts) dispatches to runMerge (src/adapters/cli/es-merge.ts). See the merge-traces flow for the full internals.","anchors":[{"path":"scripts/build-example.mjs","line":16,"symbol":"build-example","note":"demo invokes the unified CLI's merge subcommand as the first stage"},{"path":"src/adapters/cli/cli.ts","line":58,"symbol":"program","note":"merge subcommand action dispatches to runMerge"}]},{"flow":"merge-traces","explanation":"A deterministic ETL transform kept in a single plane per the two-plane rule (parse/seed/union/validate stages are NOT promoted to aggregates/policies/events). The refactor made the command boundary explicit: mergeTraces (src/application/commands/merge-traces.ts) is now the application-layer command handler — it reads the trace dir through the ModelRepository port (readTraceDocs), delegates to the pure domain mergeTraceDocs (src/domain/model/merge.ts) for the seed/union/validate/build pipeline, and returns { model, errors, warnings, files }. mergeTraceDocs itself: (1) SEEDS/UNIONS nodes into a Map keyed by global id: first-seen type/label wins; longest description wins; ownedBy / synchronous / inferred-false / physical attrs (parent, storeKind, fieldKind, dataType, host, engine, nullable) fill forward; fields[] union by name (a later data-pass trace is authoritative on a field); provenance set-unioned; each source's tactical block appended as a per-flow `usages` entry. (2) flows deduped by id, hotspots/terms deduped keeping first. (3) VALIDATE against every invariant (crossValidate, src/domain/model/invariants.ts), accumulating errors[] and warnings[]. (4) Build the model with derived meta. The CLI (src/adapters/cli/es-merge.ts, runMerge) owns IO: writes flows.json via writeModelFile and maps errors to exit 1; resolveModel (src/application/commands/resolve-model.ts) throws on errors so the server never serves an invalid model.","anchors":[{"path":"src/application/commands/merge-traces.ts","line":16,"symbol":"mergeTraces","note":"application command: read trace dir via the ModelRepository port, delegate to mergeTraceDocs"},{"path":"src/domain/model/merge.ts","line":21,"symbol":"mergeTraceDocs","note":"pure domain: seed/union nodes, accumulate flows, validate, build model"},{"path":"src/adapters/cli/es-merge.ts","line":17,"symbol":"runMerge","note":"CLI front end: argv, writeModelFile, exit codes"},{"path":"src/application/commands/resolve-model.ts","line":26,"symbol":"resolveModel","note":"in-memory --traces path; throws on any validation error"}]},{"flow":"resolve-model","explanation":"resolveModel's tier-2 branch calls mergeTraces(sourcePath, repo) (src/application/commands/merge-traces.ts), which reads every *.json via repo.readTraceDocs and delegates to mergeTraceDocs; resolveModel spreads merged.warnings into the resolution warnings, and throws (attaching merged as err.validation) when merged.errors.length > 0. See the merge-traces flow for the full ETL/validation detail.","anchors":[{"path":"src/application/commands/merge-traces.ts","line":16,"symbol":"mergeTraces","note":"read dir via repo.readTraceDocs, parse errors + delegate to mergeTraceDocs"},{"path":"src/application/commands/resolve-model.ts","line":34,"symbol":"resolveModel","note":"in-memory --traces call; throws on any validation error"}]}]},{"id":"cmd-generate-views","type":"command","label":"GenerateViews","inferred":true,"description":"Render the canonical flows.json into the two shipped views: a Graphviz flows.dot digraph (one cluster per flow, event-storming palette) and a single self-contained explorer.html with the whole model inlined. A deterministic, stateless projection: it reads the model and writes two files, mutating nothing.","tactical":{"explanation":"Split across two layers by the refactor: src/adapters/cli/es-generate.ts (runGenerate) is the IO/CLI action, and src/application/commands/generate-views.ts (generateViews, renderDot, renderHtml) is the pure render — no fs, no argv, data in/strings out. runGenerate JSON.parses the flows file into `model` with NO try/catch and NO validation (line 26 of es-generate.ts) -- it fully trusts es-merge's output contract. repoRoot/title resolve from --repo-root/--title, falling back to model.meta.repoRoot ers the `/api/model` branch by returning the already-resolved in-memory model plus provenance meta ({ source, sourcePath, repoRoot, warnings }) as JSON — there is NO disk read at request time; the model was resolved once at server boot (resolveModel in application/commands/resolve-model.ts). On success App stores { status:'ready', model, meta } and renders \u003cExplorerProvider model meta>, which in store.jsx builds the stable node/hotspot indexes (buildIndexes) and the present-type list (galleryTypes) once via useMemo, seeds interactive state (mode='flows', currentFlowId=first flow), and exposes it all through React context to the tabs. On failure fetchModel rejects and App shows the 'Couldn't load the model' boot card. This is a pure read: nothing is written and no aggregate emits an event.","anchors":[{"path":"src/web/App.jsx","line":46,"symbol":"App","note":"useEffect calls fetchModel() on mount; sets ready/error boot state"},{"path":"src/web/api.js","line":4,"symbol":"fetchModel","note":"GET /api/model; throws on non-ok; returns { model, meta }"},{"path":"src/adapters/http/server.ts","line":115,"symbol":"createServer","note":"the /api/model branch returns resolved.model + meta from memory"},{"path":"src/web/store.jsx","line":15,"symbol":"ExplorerProvider","note":"buildIndexes + galleryTypes + seed interactive state, provided via context"}]},"usages":[{"flow":"load-model","explanation":"main.jsx mounts \u003cApp/> (createRoot). App's useEffect calls fetchModel() (api.js), which does `fetch('/api/model')` and throws if the response is not ok. server.ts (createServer) answers the `/api/model` branch by returning the already-resolved in-memory model plus provenance meta ({ source, sourcePath, repoRoot, warnings }) as JSON — there is NO disk read at request time; the model was resolved once at server boot (resolveModel in application/commands/resolve-model.ts). On success App stores { status:'ready', model, meta } and renders \u003cExplorerProvider model meta>, whi rs, and a 'shared across flows' toggle that keeps only the connective vocabulary (nodes in more than one flow).","tactical":{"explanation":"Glossary.jsx filters model.nodes by the active type set and query tokens (haystack is the node's own label+description ONLY — deliberately excluding flow names, unlike the gallery — because glossary search is about the term, not its usage), optionally narrows to nodes appearing in >1 flow (sharedOnly), sorts case-insensitively by label, and interleaves A–Z letter headers. Each entry lists its flows as clickable chips (nodeFlows) that select the flow; a right rail links to present letters.","anchors":[{"path":"src/web/components/Glossary.jsx","line":10,"symbol":"Glossary","note":"glossary projection: alphabetical dictionary"},{"path":"src/web/components/Glossary.jsx","line":29,"symbol":"Glossary","note":"filter by type + query; sharedOnly narrows to nodeFlows>1; sort by label"},{"path":"src/web/model.js","line":24,"symbol":"Glossary","note":"haystack is label+description only (no flow names)"}]},"fields":[{"name":"usedInFlows","conceptual":true,"dataType":"array","derivation":"The flows each term appears in, computed via nodeFlows(model, node.id) and rendered as clickable chips; dead flows are dimmed. Derived projection, not stored.","sources":[],"confidence":"high","provenance":["inferred-from-dto"],"evidence":[{"path":"src/web/components/Glossary.jsx","line":82,"symbol":"Glossary","note":"nodeFlows(model, n.id) rendered as gl-fchip chips"}]}],"usages":[{"flow":"load-model","explanation":"Glossary.jsx filters model.nodes by the active type set and query tokens (haystack is the node's own label+description ONLY — deliberately excluding flow names, unlike the gallery — because glossary search is about the term, not its usage), optionally narrows to nodes appearing in >1 flow (sharedOnly), sorts case-insensitively by label, and interleaves A–Z letter headers. Each entry lists its flows as clickable chips (nodeFlows) that select the led out by the register write quotes the URL and appends --scope — the displayed command is not byte-identical to the executed one.","anchors":[{"path":"src/adapters/http/server.ts","line":198,"symbol":"createServer","note":"GET /api/mcp/info returns { name, url, command } without running it"},{"path":"src/adapters/http/server.ts","line":200,"symbol":"createServer","note":"info command: unquoted URL, no --scope (drifts from the executed string)"},{"path":"src/web/components/ConnectClaude.jsx","line":53,"symbol":"ConnectClaude","note":"renders info.command under the button"},{"path":"src/adapters/cli/es-view.ts","line":81,"symbol":"runView","note":"startup banner prints the same claude mcp add line"}]}]},{"id":"cmd-register-mcp","type":"command","label":"RegisterMcp","inferred":true,"description":"Register this running es-view app as an MCP server in the user's Claude configuration at the chosen scope, by having the server run `claude mcp add` on the host on the operator's behalf. This is the single most surprising write in the app: a browser click spawns a host-side process that runs the user's CLI.","tactical":{"explanation":"UI -> server -> command -> gateway chain. ConnectClaude.add() (ConnectClaude.jsx:20) calls registerMcp(scope) (web/api.js:37) which POSTs /api/mcp/register with { scope }. The route (adapters/http/server.ts:202) resolves the live MCP url from runtime.baseUrl (returns 503 and calls nothing if the socket is not bound yet — see inv-mcp-url-ready), and calls the application command registerMcp({ name: MCP_NAME, url, scope: body.scope }, claudeCliGateway) (application/commands/register-mcp.ts:7). That command whitelists the scope to {local,project,user} (application/commands/register-mcp.ts:8) and delegates to the ClaudeCliGateway. The gateway's claudeMcpAdd (adapters/process/claude-cli.ts:14) builds one command STRING by template concatenation (claude-cli.ts:16) and runs it via exec — a shell string, not an argument array and not execFile. Injecti ate inside the es-view process: its state lives entirely in the external Claude CLI's config (a project-local list, a shared .mcp.json, or the user-global settings, per --scope). Idempotency, overwrite behaviour, and exactly where the entry lands are all delegated to the Claude CLI.","tactical":{"explanation":"Realized purely by the `claude mcp add` shell-out; there is no in-memory or on-disk representation on the es-view side (hence ownedBy ext-claude-cli). The registered alias is MCP_NAME = 'event-storming' (adapters/http/server.ts:39). The registration URL points at \u003cbaseUrl>/mcp using the actual bound port. The only precondition es-view enforces before delegating is that its own MCP URL is known (inv-mcp-url-ready); everything else about the write is the CLI's responsibility.","anchors":[{"path":"src/adapters/process/claude-cli.ts","line":14,"symbol":"claudeMcpAdd","note":"the only writer; effect lands in the external CLI config"},{"path":"src/adapters/http/server.ts","line":39,"symbol":"MCP_NAME","note":"registered alias 'event-storming'"}]},"usages":[{"flow":"register-mcp","explanation":"Realized purely by the `claude mcp add` shell-out; there is no in-memory or on-disk representation on the es-view side (hence ownedBy ext-claude-cli). The registered alias is MCP_NAME = 'event-storming' (adapters/http/server.ts:39). The registration URL points at \u003cbaseUrl>/mcp using the actual bound port. The only precondition es-view enforces before delegating is that its own MCP URL is known (inv-mcp-url-ready); everything else about the write is the CLI's responsibility.","anchors":[{"path":"src/adapters/process/claude-cli.ts","line":14,"symbol":"claudeMcpAdd","note":"the only writer; effect lands in the external CLI config"},{"path":"src/adapters/http/server.ts","line":39,"symbol":"MCP_NAME","note":"registered alias 'event-storming'"}]}]},{"id":"inv-mcp-url-ready","type":"invariant","label":"Registration is refused until the server's own MCP URL is known","inferred":true,"description":"ERROR-level precondition that can reject the action: RegisterMcp cannot proceed until the es-view HTTP socket has bound and runtime.baseUrl is set. A POST /api/mcp/register that arrives before then returns 503 and NO shell-out occurs, so the app never registers a URL it cannot yet serve. (The scope whitelist is NOT modeled as an invariant: a non-whitelisted scope does not reject the command, it is silently dropped and registration proceeds without --scope — that graceful-degrade guard is folded into cmd-register-mcp and the input-safety reasoning there.)","tactical":{"explanation":"The route computes url = mcpUrl() = runtime.baseUrl ? runtime.baseUrl + '/mcp' : null. If url is null it returns sendJson(res, 503, { ok:false, stderr:'server URL not ready yet' }) and returns before calling the registerMcp application command (adapters/http/server.ts:203-204). runtime.baseUrl is populated only inside startServer's listen callback once the socket binds (adapters/http/server.ts:233), so this guards the window between process start and successful bind. It is the one check in this flow that actually fails the command; the scope whitelist and the fixed subcommands constrain content but never reject.","anchors":[{"path":"src/adapters/http/server.ts","line":204,"symbol":"createServer","note":"503 'server URL not ready yet' — no shell-out when url is null"},{"path":"src/adapters/http/server.ts","line":100,"symbol":"createServer","note":"mcpUrl() = runtime.baseUrl ? baseUrl+'/mcp' : null"},{"path":"src/adapters/http/server.ts","line":233,"symbol":"startServer","note":"runtime.baseUrl set only after the socket binds"}]},"usages":[{"flow":"register-mcp","explanation":"The route computes url = mcpUrl() = runtime.baseUrl ? runtime.baseUrl + '/mcp' : null. If url is null it returns sendJson(res, 503, { ok:false, stderr:'server URL not ready yet' }) and returns before calling the registerMcp application command (adapters/http/server.ts:203-204). runtime.baseUrl oes a bounded recursive walk of cwd (maxDepth 6, skipping node_modules/.git/.claude/dist/.next/out/coverage and any dotdir), sorts hits (a file inside a model/ dir first, then shallower paths, then alphabetical) and reads hits[0] (source='discovered'), pushing a warning when >1 candidate exists; (4) fallback: repo.readModelFile the bundled self-model at examples/event-storming-recovery/model/flows.json (source='example'). readModelFile (src/adapters/fs/model-repository.ts) JSON.parses the file and asserts nodes[] and flows[] are arrays (the load-path shape guard). Finally derives resolvedRepoRoot: explicit --repo-root flag > (example fallback -> packageRoot) > model.meta.repoRoot > cwd. Returns { model, source, sourcePath, repoRoot, warnings }. Pure selection/loading logic (all fs I/O goes through the injected ModelRepository port); the --traces branch is the only tier that runs the full merge validation.","anchors":[{"path":"src/application/commands/resolve-model.ts","line":26,"symbol":"resolveModel","note":"entry: 4-tier precedence dispatcher"},{"path":"src/application/commands/resolve-model.ts","line":30,"symbol":"resolveModel","note":"tier 1 --model: repo.readModelFile explicit path"},{"path":"src/application/commands/resolve-model.ts","line":34,"symbol":"resolveModel","note":"tier 2 --traces: mergeTraces(sourcePath, repo) + throw on merged.errors"},{"path":"src/application/commands/resolve-model.ts","line":46,"symbol":"resolveModel","note":"tier 3 auto-discover: repo.discoverFlowsFiles + hits[0] + multi-candidate warning"},{"path":"src/application/commands/resolve-model.ts","line":53,"symbol":"resolveModel","note":"tier 4 fallback: bundled example flows.json"},{"path":"src/adapters/fs/model-repository.ts","line":13,"symbol":"findFlowsFiles","note":"bounded recursive walk (maxDepth 6, IGNORE_DIRS + dotdirs)"},{"path":"src/adapters/fs/model-repository.ts","line":30,"symbol":"findFlowsFiles","note":"candidate sort heuristic: model/ dir > shallower > alphabetical"}  explorer views from the validated model","tier":1,"kind":"write","status":"live","summary":"The operator runs es-generate (or the demo wrapper) over a validated flows.json and an output directory. The tool JSON.parses the model, then in one deterministic pass renders two artifacts: a Graphviz flows.dot digraph (one event-storming-colored cluster per flow, physical datastore/field nodes excluded) and a single self-contained explorer.html with the whole model inlined and no external dependencies. Both are written into outDir; the operator opens explorer.html in a browser and can render flows.dot with Graphviz, with vscode:// deep links from either back into the analyzed source. The generator is a pure projection: it reads the model read-only, enforces none of the model's invariants, and trusts that es-merge already validated the input.","trigger":"Operator runs `node dist/node/adapters/cli/cli.js generate \u003cflows.json> \u003coutDir> [--repo-root \u003cpath>] [--title \u003ctext>]` (the unified CLI's `generate` subcommand -- cli.ts, backed by es-generate.ts's runGenerate), or `npm run demo` chains it after the `merge` subcommand (scripts/build-example.mjs:17).","steps":["actor-operator","cmd-generate-views","agg-model","rm-flows-dot","rm-explorer-html","ext-browser"],"edges":[{"from":"actor-operator","to":"cmd-generate-views","verb":"issues"},{"from":"cmd-generate-views","to":"agg-model","verb":"reads"},{"from":"cmd-generate-views","to":"ds-model-fs","verb":"connects via"},{"from":"cmd-generate-views","to":"ds-flows-json","verb":"reads"},{"from":"cmd-generate-views","to":"ds-flows-dot","verb":"writes"},{"from":"cmd-generate-views","to":"ds-explorer-html","verb":"writes"},{"from":"rm-flows-dot","to":"ds-flows-dot","verb":"projects from"},{"from":"rm-explorer-html","to":"ds-explorer-html","verb":"projects from"},{"from":"rm-flows-dot","to":"ext-graphviz","verb":"read by"},{"from":"rm-explorer-html","to":"ext-browser","verb":"read by"},{"from":"rm-explorer-html","to":"ext-vscode","verb":"calls"}],"hotspots":["hot-generator-trusts-unvalidated-model"],"instances":[]},{"id":"launch-explorer","name":"Operator launches the interactive explorer","tier":1,"kind":"write","status":"live","summary":"The operator runs `npx event-storming-recovery view` (the es-view bin). Boot parses args, resolves which model to serve (composing resolve-model: explicit --model, an on-the-fly --traces merge, an auto-discovered flows.json, or the bundled self-model), hydrates the persisted comment store from the comments.json sidecar, wires the empty in-memory session state, and starts ONE local http server that serves the SPA, the JSON API, and the MCP endpoint over that one shared state. The server binds 127.0.0.1:5178, falling forward up to 20 ports if taken; on success it prints the url and the `claude mcp add` command and best-effort opens the browser. The point is a single live session where a human's click in the browser is exactly what a connected Claude terminal reads.","trigger":"Operator runs `npx event-storming-recovery view [options]` / `es-view` (src/adapters/cli/cli.ts's `view` action, which awaits runView() in src/adapters/cli/es-view.ts).","steps":["actor-operator","cmd-launch-explorer","agg-model","agg-comment-store","agg-server-session","evt-server-started"],"edges":[{"from":"actor-operator","to":"cmd-launch-explorer","verb":"issues"},{"from":"cmd-launch-explorer","to":"agg-model","verb":"reads"},{"from":"cmd-launch-explorer","to":"agg-comment-store","verb":"reads"},{"from":"cmd-launch-explorer","to":"agg-server-session","verb":"handled by"},{"from":"agg-server-session","to":"evt-server-started","verb":"emits"},{"from":"agg-server-session","to":"ext-browser","verb":"calls"}],"hotspots":["hot-port-fallforward-exhaustion","hot-example-comments-unwritable"],"instances":[]},{"id":"load-model","name":"Operator opens the explorer and reads the rendered model","tier":1,"kind":"read","status":"live","summary":"The operator opens the es-view SPA in a browser. On first mount the app fetches the canonical model once over GET /api/model, which the server answers from the already-resolved in-memory model plus provenance meta. The app hydrates a React store (building node/hotspot indexes and the present-type list) and renders four read-only projection tabs over that one model: the Flows board (the selected flow as event-storming lanes), the Gallery (every node as a sticky card), the Overview (every flow as a bounded-context box), and the Glossary (the nodes as an alphabetical dictionary). Nothing is written; each tab is a pure client-side projection the operator reads to explore the recovered domain.","trigger":"Operator loads the es-view SPA in a browser (served by server.mjs), which mounts \u003cApp/> and fires fetchModel() on first render.","steps":["actor-operator","cmd-load-model","agg-model","rm-flows-board","rm-gallery","rm-overview","rm-glossary"],"edges":[{"from":"actor-operator","to":"cmd-load-model","verb":"issues"},{"from":"cmd-load-model","to":"agg-model","verb":"reads"},{"from":"rm-flows-board","to":"agg-model","verb":"projects from"},{"from":"rm-gallery","to":"agg-model","verb":"projects from"},{"from":"rm-overview","to":"agg-model","verb":"projects from"},{"from":"rm-glossary","to":"agg-model","verb":"projects from"},{"from":"rm-flows-board","to":"actor-operator","verb":"read by"},{"from":"rm-gallery","to":"actor-operator","verb":"read by"},{"from":"rm-overview","to":"actor-operator","verb":"read by"},{"from":"rm-glossary","to":"actor-operator","verb":"read by"}],"hotspots":["hot-glossary-shows-physical-and-invariant-nodes"],"instances":[]},{"id":"mcp-get-current-selection","name":"A connected Claude session reads the current selection","tier":1,"kind":"read","status":"live","summary":"A Claude session connected to the es-view MCP server calls get_current_selection to see what the human is currently looking at in the explorer. The tool reads the single shared in-memory selection pointer (set by th
