e browser via the select-node flow); if a node is selected it builds a grounded projection of that node — identity, the invariants it enforces, the flows it appears in, human comments, and the real source code behind every anchor — and returns it as markdown. If nothing is selected it returns a nudge to click a node. This is the core grounding bridge: a browser click becomes context a connected Claude session can act on, anchored to actual files rather than a bare label.","trigger":"MCP tool `get_current_selection` invoked over POST /mcp by a connected Claude session (src/adapters/mcp/mcp-server.ts:28).","steps":["ext-claude-mcp","cmd-get-current-selection","agg-selection","rm-grounded-node"],"edges":[{"from":"ext-claude-mcp","to":"cmd-get-current-selection","verb":"issues"},{"from":"cmd-get-current-selection","to":"agg-selection","verb":"reads"},{"from":"cmd-get-current-selection","to":"rm-grounded-node","verb":"reads"},{"from":"rm-grounded-node","to":"agg-selection","verb":"projects from"},{"from":"rm-grounded-node","to":"agg-model","verb":"projects from"},{"from":"rm-grounded-node","to":"agg-comment-store","verb":"reads"},{"from":"rm-grounded-node","to":"ds-repo-fs","verb":"reads"},{"from":"rm-grounded-node","to":"ext-claude-mcp","verb":"read by"}],"hotspots":["hot-selection-global-shared"],"instances":[]},{"id":"mcp-read-tools","name":"A connected Claude reads grounded model context over the MCP read tools","tier":1,"kind":"read","status":"live","summary":"A Claude session that registered the es-view MCP server pulls grounded domain context to ground a refactor. Over the streamable-HTTP /mcp transport it discovers ids with list_model, fetches a node with get_node, a whole flow (plus a Mermaid graph) with get_flow, the physical storage tree with list_data_model, and the human's curated set via the event-storming://selected-nodes resource. Every projection is served from the SAME in-memory state driven by the human: the merged model (agg-model, resolved once at boot) and the curated bundle (agg-context-bundle). The grounded reads (get_node/get_flow/bundle) pull REAL source excerpts from the repo filesystem behind each anchor; list_model/list_data_model stay pure in-memory. Nothing is written: this is the pure-read half of the bridge (the selection-aware get_current_selection is a sibling flow).","trigger":"A connected Claude session (registered via `claude mcp add`, initialized over POST /mcp) calls get_node / get_flow / list_model / list_data_model, or reads the `event-storming://selected-nodes` resource.","steps":["ext-claude-mcp","rm-model-listing","rm-grounded-node","rm-grounded-flow","rm-data-model","rm-selected-bundle","agg-model","agg-context-bundle"],"edges":[{"from":"ext-claude-mcp","to":"rm-model-listing","verb":"reads"},{"from":"ext-claude-mcp","to":"rm-grounded-node","verb":"reads"},{"from":"ext-claude-mcp","to":"rm-grounded-flow","verb":"reads"},{"from":"ext-claude-mcp","to":"rm-data-model","verb":"reads"},{"from":"ext-claude-mcp","to":"rm-selected-bundle","verb":"reads"},{"from":"rm-model-listing","to":"agg-model","verb":"projects from"},{"from":"rm-grounded-node","to":"agg-model","verb":"projects from"},{"from":"rm-grounded-node","to":"ds-repo-fs","verb":"projects from"},{"from":"rm-grounded-flow","to":"agg-model","verb":"projects from"},{"from":"rm-grounded-flow","to":"ds-repo-fs","verb":"projects from"},{"from":"rm-data-model","to":"agg-model","verb":"projects from"},{"from":"rm-selected-bundle","to":"agg-context-bundle","verb":"projects from"},{"from":"rm-selected-bundle","to":"agg-model","verb":"projects from"},{"from":"rm-selected-bundle","to":"ds-repo-fs","verb":"projects from"}],"hotspots":["hot-mcp-read-desc-drift","hot-mcp-grounded-output-unbounded"],"instances":[]},{"id":"merge-traces","name":"Operator merges per-flow traces into the validated model","tier":1,"kind":"write","status":"live","summary":"The operator runs es-merge (or es-view --traces) over a directory of per-flow trace JSONs. The tool reads every trace file, unions the shared nodes by global id and accumulates the flows, hotspots, and terms into one canonical model, computes derived meta (shared glossary, dead-flow index, counts), then validates the whole graph against its invariants. On success it writes (CLI) or holds in memory (server) the validated flows.json the server and generator consume; on any error the CLI writes-then-flags-and-exits-1 while the server throws and serves nothing. The point is to let independent trace agents converge on one consistent, referentially closed model.","trigger":"Operator runs `node dist/node/adapters/cli/cli.js merge \u003ctracesDir> \u003coutFile>` (the unified CLI's `merge` subcommand — cli.ts, backed by es-merge.ts's runMerge), or es-view resolves a model from `--traces \u003cdir>`.","steps":["actor-operator","rm-trace","cmd-merge-traces","agg-model","evt-model-merged","evt-model-validated"],"edges":[{"from":"actor-operator","to":"cmd-merge-traces","verb":"issues"},{"from":"cmd-merge-traces","to":"rm-trace","verb":"reads"},{"from":"rm-trace","to":"ds-trace-json","verb":"projects from"},{"from":"cmd-merge-traces","to":"ds-model-fs","verb":"connects via"},{"from":"cmd-merge-traces","to":"agg-model","verb":"handled by"},{"from":"agg-model","to":"inv-referential-integrity","verb":"enforces"},{"from":"agg-model","to":"inv-es-grammar","verb":"enforces"},{"from":"agg-model","to":"inv-terms-contract","verb":"enforces"},{"from":"agg-model","to":"inv-data-lineage","verb":"enforces"},{"from":"agg-model","to":"inv-anchor-coverage","verb":"enforces"},{"from":"agg-model","to":"evt-model-merged","verb":"emits"},{"from":"agg-model","to":"evt-model-validated","verb":"emits"},{"from":"agg-model","to":"ds-flows-json","verb":"persists to"}],"hotspots":["hot-invalid-model-written"],"instances":[]},{"id":"open-data-model-tab","name":"Operator opens the Data-model tab (and Claude reads the same via list_data_model)","tier":1,"kind":"read","status":"live","summary":"The operator clicks the 'Data model' tab in the es-view SPA. Without any server round-trip, the DataModel view filters the already-loaded model for its physical layer (datastore/field nodes) and renders a pannable containment graph: nested store cards with parent->child arrows, a per-store badge counting the behavioral nodes that touch it, per-verb footer pills, and each record set's demand-driven fields; big containers start collapsed. A connected Claude session reads the SAME recovered data model over MCP by calling list_data_model, which renders it as an indented markdown tree. Both surfaces are pure reads projecting one source of truth (agg-model) through two independent renderers, so a human's exploration and a model's grounding stay in lockstep.","trigger":"Operator clicks the 'Data model' tab (Tabs.jsx setMode('data')); or a connected Claude calls the MCP tool list_data_model.","steps":["actor-operator","ext-browser","ext-claude-mcp","rm-data-model","agg-model"],"edges":[{"from":"actor-operator","to":"ext-browser","verb":"calls"},{"from":"ext-browser","to":"rm-data-model","verb":"reads"},{"from":"ext-claude-mcp","to":"rm-data-model","verb":"reads"},{"from":"rm-data-model","to":"agg-model","verb":"projects from"},{"from":"rm-data-model","to":"ds-flows-json","verb":"projects from"}],"hotspots":["hot-data-model-drops-nested-loose-fields"],"instances":[]},{"id":"register-mcp","name":"Operator connects their Claude terminal from the explorer","tier":1,"kind":"write","status":"live","summary":"In the explorer's ConnectClaude panel the operator picks a scope and clicks 'Add to Claude'. The SPA POSTs /api/mcp/register; the server resolves its own live MCP URL (503 if the socket is not yet bound), whitelists the scope, and shells out `claude mcp add --transport http event-storming \"\u003curl>/mcp\" [--scope \u003cscope>]` on the host as the same OS user. On success the app is registered as an MCP server in the user's Claude config and the operator is told to run /mcp. The intent is one-click wiring of the running app into the user's Claude terminal, but the mechanism (a browser click spawning a host process that runs the user's CLI) is the single most surprising write in the app and the highest-privilege UI action.","trigger":"Operator clicks 'Add to Claude' in the ConnectClaude panel (scope dropdown local/project/user). Reachable end to end: ConnectClaude.jsx:20 -> api.js:37 -> adapters/http/server.ts:202 -> application/commands/register-mcp.ts:7 -> adapters/process/claude-cli.ts:18.","steps":["actor-operator","rm-mcp-connect-command","cmd-register-mcp","agg-mcp-registration","evt-mcp-registered","ext-claude-cli"],"edges":[{"from":"rm-mcp-connect-command","to":"actor-operator","verb":"read by"},{"from":"actor-operator","to":"cmd-register-mcp","verb":"issues"},{"from":"cmd-register-mcp","to":"agg-mcp-registration","verb":"handled by"},{"from":"agg-mcp-registration","to":"inv-mcp-url-ready","verb":"enforces"},{"from":"cmd-register-mcp","to":"ext-claude-cli","verb":"calls"},{"from":"agg-mcp-registration","to":"evt-mcp-registered","verb":"emits"}],"hotspots":["hot-ui-shells-claude-cli","hot-mcp-register-no-csrf"],"instances":[]},{"id":"resolve-model","name":"es-view resolves which model the session serves","tier":1,"kind":"read","status":"live","summary":"At boot, es-view must decide which Event Storming model this session will serve. ResolveModel applies a fixed 4-tier precedence -- explicit --model wins, else --traces merges the per-flow traces on the fly (and refuses to serve if that merge fails validation), else it auto-discovers a flows.json by a bounded recursive walk of the current directory, else it falls back to the bundled self-model shipped in the package. It loads the chosen model into memory, tags it with provenance, derives a repoRoot for deep-linking source anchors, and prints a banner so the operator can see which tier won. The recovered intent is 'always come up with SOME model, but make the source unambiguous to the human', with the --traces tier the only one that runs full merge validation.","trigger":"Operator runs `npx event-storming-recovery view [--model|--traces|...]`; src/adapters/cli/cli.ts's `view` action invokes runView(), which calls resolveModel at boot (src/adapters/cli/es-view.ts).","steps":["actor-operator","cmd-resolve-model","agg-server-session","agg-model","evt-model-resolved","rm-model-provenance"],"edges":[{"from":"actor-operator","to":"cmd-resolve-model","verb":"issues"},{"from":"cmd-resolve-model","to":"agg-server-session","verb":"handled by"},{"from":"cmd-resolve-model","to":"ds-flows-json","verb":"reads"},{"from":"cmd-resolve-model","to":"ds-model-fs","verb":"connects via"},{"from":"cmd-resolve-model","to":"ds-example-model","verb":"reads"},{"from":"cmd-resolve-model","to":"cmd-merge-traces","verb":"calls"},{"from":"cmd-resolve-model","to":"agg-model","verb":"reads"},{"from":"agg-server-session","to":"inv-model-shape","verb":"enforces"},{"from":"agg-server-session","to":"evt-model-resolved","verb":"emits"},{"from":"evt-model-resolved","to":"rm-model-provenance","verb":"updates"},{"from":"rm-model-provenance","to":"actor-operator","verb":"read by"}],"hotspots":["hot-discovery-ambiguity","hot-repo-root-stale","hot-unvalidated-model-served"],"instances":[]},{"id":"select-node","name":"Operator selects a node; the SPA opens its Detail and mirrors the selection to the server","tier":1,"kind":"write","status":"live","summary":"The selection bridge, write half. The operator clicks any sticky in the SPA and the store's openDetail does two things at once: it opens that node's Detail panel client-side (rendered from the already-loaded model) AND it fires a fire-and-forget POST /api/selection to mirror the choice to the server. The server validates the id against the merged model, then stores it in a purely in-memory Selection aggregate shared same-process with the MCP server. That shared state is why a connected Claude session, calling get_current_selection, sees exactly the node the operator is looking at. Push-on-click by the human; the pull-on-call read by Claude is the separate claude-mcp-read flow.","trigger":"The operator opens a node's detail anywhere in the SPA via openDetail (store.jsx:43), which posts to /api/selection (store.jsx:46). It fires from the flow board (Board.jsx onOpenDetail), Overview, Gallery, Glossary, the Data-model tab, Detail-panel nav rows, and context-bundle node rows.","steps":["actor-operator","cmd-select-node","agg-selection","evt-node-selected","rm-detail-panel","ext-claude-mcp"],"edges":[{"from":"actor-operator","to":"cmd-select-node","verb":"issues"},{"from":"cmd-select-node","to":"agg-selection","verb":"handled by"},{"from":"cmd-select-node","to":"agg-model","verb":"reads"},{"from":"agg-selection","to":"inv-selection-in-model","verb":"enforces"},{"from":"agg-selection","to":"evt-node-selected","verb":"emits"},{"from":"rm-detail-panel","to":"agg-model","verb":"projects from"},{"from":"actor-operator","to":"rm-detail-panel","verb":"reads"},{"from":"agg-selection","to":"ext-claude-mcp","verb":"read by"}],"hotspots":["hot-hotspot-selection-not-mirrored","hot-selection-never-cleared"],"instances":[]},{"id":"view-source","name":"Operator pulls the real code behind an anchor","tier":1,"kind":"read","status":"live","summary":"From a sticky's Detail panel, each tactical anchor offers two ways into the real code: a 'view source' toggle that pulls a line-windowed excerpt inline, and a vscode://file link that opens the exact file+line in VS Code. The inline path calls GET /api/source, which reads the file through a repo-root-sandboxed helper (readSource) whose path-traversal guard rejects any path that escapes the repo root, then returns a clamped window of lines around the anchor. The point is to ground a recovered, inferred sticky in verifiable source without leaving the explorer, and to hand off to a real editor when the operator wants the whole file.","trigger":"Operator clicks 'view source' under an anchor in the Detail panel (or clicks the anchor's vscode:// link).","steps":["actor-operator","cmd-view-source","agg-source-reader","rm-source-excerpt","ext-vscode"],"edges":[{"from":"actor-operator","to":"cmd-view-source","verb":"issues"},{"from":"cmd-view-source","to":"agg-source-reader","verb":"handled by"},{"from":"agg-source-reader","to":"inv-repo-root-sandbox","verb":"enforces"},{"from":"agg-source-reader","to":"ds-repo-fs","verb":"connects via"},{"from":"agg-source-reader","to":"rm-source-excerpt","verb":"returns"},{"from":"rm-source-excerpt","to":"ds-repo-source-file","verb":"projects from"},{"from":"rm-source-excerpt","to":"actor-operator","verb":"read by"},{"from":"actor-operator","to":"ext-vscode","verb":"calls"}],"hotspots":["hot-source-read-scope"],"instances":[]}],"hotspots":[{"id":"hot-comment-nonatomic-persist","label":"Comment persistence is non-atomic and its failure is silent","description":"store.add updates the in-memory Map and the API returns 200 BEFORE (and regardless of whether) the disk write succeeds. persist() does a single fs.writeFileSync straight over comments.json with no temp-file-plus-rename, so a crash mid-write can leave a truncated/corrupt sidecar — and the loader silently swallows a corrupt file and starts empty, i.e. total loss of prior notes. Separately, if the location is read-only (e.g. the bundled example under a global npx install) the write throws, is caught, logged ONCE via a warned flag, and otherwise ignored; the operator's dialog still shows the note as saved, but it exists only in memory for that session and vanishes on restart. Questions for a human: (1) should the sidecar write be made atomic (write to a temp file then rename)? (2) should a persistence failure surface to the operator / return a non-200 instead of appearing successful? (3) is starting empty on a corrupt/unreadable sidecar acceptable, or should it be backed up rather than overwritten?","tactical":{"explanation":"In the fs comment-repository adapter (adapters/fs/comment-repository.ts): CommentStore.add() calls onChange(), which is wired to persist(); persist() calls fs.writeFileSync(filePath, JSON.stringify(...)) with no atomic rename, and on throw does `if (!warned) { console.error(...); warned = true; }` — swallowed thereafter. The addComment command (application/commands/add-comment.ts) returns an 'ok' status with store.get(type,id) immediately after store.add() returns, irrespective of the write outcome, and the server maps that to HTTP 200. On startup createCommentStore's JSON.parse is wrapped in try/catch that discards a corrupt file and starts with an empty Map.","anchors":[{"path":"src/adapters/fs/comment-repository.ts","line":17,"symbol":"persist","note":"single writeFileSync, no temp+rename (non-atomic)"},{"path":"src/adapters/fs/comment-repository.ts","line":19,"symbol":"persist","note":"write error caught, warned-once, then swallowed"},{"path":"src/adapters/fs/comment-repository.ts","line":29,"symbol":"createCommentStore","note":"corrupt sidecar swallowed -> starts empty (data loss)"},{"path":"src/application/commands/add-comment.ts","line":21,"symbol":"addComment","note":"store.add() called; 'ok' status returned regardless of persist outcome"}]}},{"id":"hot-bundle-single-global-state","label":"One process-global bundle is shared by every browser tab and every Claude session","description":"The context bundle is a single in-memory Map on the one shared state object, with no per-client or per-session scoping. If two browser tabs (or two people on the same es-view URL) are open, or one operator curates while a Claude session reads, they all mutate and see the SAME bundle: an add in one tab appears in the other, and a 'Clear' wipes everyone's set. For the intended single-local-developer workflow this is the feature (the SPA click is exactly what Claude reads). Human question: is single-user, single-run the only supported mode, or should the bundle be scoped per browser session / per MCP session once es-view is ever shared or multi-tab? Restart also silently drops the bundle (no persistence).","tactical":{"explanation":"runView constructs one `ContextBundle` instance (adapters/cli/es-view.ts:60); the server passes that same instance to all HTTP handlers and every MCP session, and list/add/remove/clear all operate on it with no client identity. The MCP resource reads the identical instance (mcp-server.ts:92). There is no keying by tab, cookie, or Mcp-Session-Id.","anchors":[{"path":"src/domain/session/context-bundle.ts","line":17,"symbol":"ContextBundle","note":"single global bundle Map, no per-client scope"},{"path":"src/adapters/http/server.ts","line":133,"symbol":"createServer","note":"all /api/context calls mutate the one shared bundle instance"},{"path":"src/adapters/mcp/mcp-server.ts","line":92,"symbol":"buildMcpServer","note":"MCP resource reads the same bundle.list()"}]}},{"id":"hot-demo-example-drift","label":"CI regenerates the committed example but never verifies it is in sync","description":"The CI smoke-build runs `npm run demo`, which regenerates examples/event-storming-recovery/model/{flows.json,flows.dot,explorer.html} in place and then discards the result -- there is no `git diff --exit-code` (or equivalent) afterward. So the committed self-model example can silently drift from its source traces (someone edits a trace but forgets to rebuild, or hand-edits flows.json) and CI stays green, because it only asserts the build runs, not that the committed artifacts equal a fresh build. Compounding it: es-merge writes flows.json even when validation fails (see hot-invalid-model-written) and the demo's execFileSync chain aborts on merge's nonzero exit, so running demo against a broken trace set overwrites the committed flows.json with an invalid model and never reaches es-generate. Human question: should CI fail when `npm run demo` yields a diff against the committed example (treating the example as a verified fixture) and should build-example write to a temp/staging dir rather than mutating tracked files in place, or is regenerate-and-discard the intended smoke test?","tactical":{"explanation":".github/workflows/ci.yml runs `npm run demo` with no follow-up diff check. scripts/build-example.mjs writes directly into the committed ex/model dir (model = ex/model/flows.json; generate outDir = ex/model). The `run` helper uses execFileSync, which throws on a nonzero child exit, so a merge validation failure (which still wrote flows.json per hot-invalid-model-written) leaves a corrupted committed flows.json and aborts before the generate stage runs. Still true after the TS refactor; the only new wrinkle is the added tsc precompile step, which if it fails aborts even earlier (before either subcommand runs).","anchors":[{"path":".github/workflows/ci.yml","line":19,"symbol":"build the example (smoke)","note":"runs npm run demo; no git diff / no artifact assertion"},{"path":"scripts/build-example.mjs","line":16,"symbol":"build-example","note":"merge writes into the committed ex/model/flows.json in place"},{"path":"scripts/build-example.mjs","line":11,"symbol":"run","note":"execFileSync throws on nonzero merge exit, aborting before generate"}]}},{"id":"hot-silent-empty-copy","label":"A failed context fetch still reports success and copies an empty clipboard","description":"All three copy sites do navigator.clipboard.writeText(r.markdown || ''). If the fetch RESOLVES but carries no markdown -- a 404 for an unknown/stale id (returns { error }), an error body, or an empty bundle -- the client writes an EMPTY string to the clipboard, and Detail/ContextBundle still flip to 'Copied ✓'. The try/catch only catches a rejected clipboard write, not a resolved-but-empty fetch. Human question: should copy verify r.markdown is non-empty (and surface the 404/empty-bundle case) before claiming success, so the operator does not paste blank context into Claude believing it worked?","tactical":{"explanation":"getItem/getContext (web api.js) resolve the fetch to JSON regardless of HTTP status; on 404 the body is { error } and r.markdown is undefined, so `r.markdown || ''` writes ''. Detail.jsx and ContextBundle.jsx then setCopied(true). ContextMenu.jsx additionally shows no feedback at all. The server 404s via itemExists (inv-copy-target-exists, now application/read-models/items.ts), but that signal is lost at the client.","anchors":[{"path":"src/web/components/Detail.jsx","line":167,"symbol":"DetailActions.copy","note":"writeText(r.markdown || '') then setCopied(true)"},{"path":"src/web/components/ContextBundle.jsx","line":24,"symbol":"ContextBundle.copyAll","note":"same empty-fallback; button shows 'Copied ✓'"},{"path":"src/web/api.js","line":28,"symbol":"getItem","note":"resolves fetch to JSON without checking res.ok"},{"path":"src/adapters/http/server.ts","line":185,"symbol":"createServer","note":"404 for unknown id -- signal dropped client-side"}]}},{"id":"hot-generator-trusts-unvalidated-model","label":"es-generate renders any flows.json without validating it","description":"runGenerate JSON.parses flows.json and immediately hands it to renderDot/renderHtml with no validation and no try/catch. Unlike the server's resolveModel (which re-runs the merge and throws on errors), the es-generate path performs zero checks. Combined with the merge writing flows.json even when validation fails (see hot-invalid-model-written), an operator can generate an invalid or partial model and get a silently broken/misleading explorer, or a raw crash: a missing top-level `nodes` or `flows` array throws an uncaught TypeError from renderDot's `.map`/`for...of` (lines 21 and 31), and a missing outDir throws from writeViews's writeFileSync (no mkdir). Human question: should es-generate re-validate its input (import the domain validate()/crossValidate, or at least assert the required arrays) and fail loudly before rendering, or is trusting es-merge's output contract intended? Today the two consumers of flows.json disagree on whether to trust it.","tactical":{"explanation":"es-generate.ts:26 `const model: Model = JSON.parse(fs.readFileSync(flowsFile, 'utf8'))` -- no try/catch, no schema check. generate-views.ts's renderDot:21 `new Map(model.nodes.map(...))` and :31 `for (const f of model.flows)` assume those arrays exist. No import of the domain validate()/crossValidate anywhere in es-generate.ts or generate-views.ts. Contrast src/application/commands/resolve-model.ts, which throws when merged.errors.length so the server never serves an unvalidated model. No fs.mkdirSync of outDir in generator-writer.ts, so a non-existent output dir also throws from writeFileSync. The old CLI's manual argv guard (missing flowsFile/outDir -> usage + exit 2) is gone; commander's required \u003cflowsJson>/\u003coutDir> arguments in cli.ts now enforce that instead, which is a genuine improvement but doesn't touch the model-validation gap this hotspot is about.","anchors":[{"path":"src/adapters/cli/es-generate.ts","line":26,"symbol":"runGenerate","note":"JSON.parse with no try/catch and no validation"},{"path":"src/application/commands/generate-views.ts","line":21,"symbol":"renderDot","note":"model.nodes.map assumes the array exists"},{"path":"src/adapters/fs/generator-writer.ts","line":7,"symbol":"writeViews","note":"writeFileSync with no mkdir of outDir"}]}},{"id":"hot-port-fallforward-exhaustion","label":"Port fall-forward is bounded and fails hard; the http.Server is reused across attempts","description":"startServer tries the preferred port then up to 20 successors on EADDRINUSE; if all 20 are taken, OR the very first bind hits any non-EADDRINUSE error, it rejects and the top-level `program.parseAsync(...).catch` prints a raw error and exits 1 with no operator-facing remediation. Secondary subtlety: the SAME http.Server object is re-listened across attempts, so each failed attempt leaves its server.listen 'listening' callback queued — on the eventual successful bind every queued callback fires, resolving the promise (idempotent) and re-setting runtime.baseUrl more than once (harmless today). Human question: is a 20-port ceiling right for a tool meant to run many sessions, and should exhaustion give a friendly 'all ports 5178-5197 busy, pass --port' message instead of a stack trace? Should each attempt use a fresh server (or removeAllListeners) rather than re-listening one object?","tactical":{"explanation":"tryListen registers server.once('error', ...) and calls server.listen(pnum, host, cb); on EADDRINUSE with attemptsLeft>0 it recurses pnum+1, else reject(err). No cap message is surfaced; the rejection propagates up through runView's awaited startServer call (uncaught there) to cli.ts's top-level `program.parseAsync(...).catch` -> console.error(err) -> process.exit(1).","anchors":[{"path":"src/adapters/http/server.ts","line":226,"symbol":"startServer","note":"tryListen recursion; reject on exhaustion or non-EADDRINUSE error"},{"path":"src/adapters/http/server.ts","line":237,"symbol":"startServer","note":"tryListen(port, 20) — the 20-attempt ceiling"},{"path":"src/adapters/cli/cli.ts","line":73,"symbol":"program","note":"top-level parseAsync(...).catch -> raw console.error + exit 1"}]}},{"id":"hot-example-comments-unwritable","label":"Comment sidecar is placed next to the model even when that location is read-only","description":"The comments.json sidecar path is dirname(resolved.sourcePath). When no local model is found and es-view falls back to the BUNDLED example self-model, that dirname is inside the installed package (often a global/read-only npx location), so persist() fails and createCommentStore warns once and keeps comments in memory only — they are silently lost when the session ends. On the --traces path the sidecar lands INSIDE the traces directory (alongside the per-flow trace files); on --model/discovered it lands next to flows.json (intended). Human question: when the model directory is read-only or is the bundled example, should the sidecar fall back to a writable user-scoped location (e.g. a cache dir) so human comments are not silently discarded, and is writing comments.json into a --traces input directory desirable?","tactical":{"explanation":"runView() (src/adapters/cli/es-view.ts) computes commentsPath = path.join(path.dirname(resolved.sourcePath), 'comments.json'); resolveModel sets sourcePath to the bundled example path (packageRoot/examples/.../model/flows.json) when nothing is found, or to the traces dir on --traces. comment-repository.ts's persist() try/catches the writeFileSync and, on failure, does a one-time `! comments not persisted` warning, otherwise keeping data in the in-memory byKey map only (inside the domain CommentStore).","anchors":[{"path":"src/adapters/cli/es-view.ts","line":62,"symbol":"runView","note":"commentsPath rooted at dirname(resolved.sourcePath)"},{"path":"src/adapters/fs/comment-repository.ts","line":12,"symbol":"persist","note":"best-effort writeFileSync; warn-once, keep in memory on failure"},{"path":"src/application/commands/resolve-model.ts","line":53,"symbol":"resolveModel","note":"example fallback sets sourcePath inside the installed package"}]}},{"id":"hot-glossary-shows-physical-and-invariant-nodes","label":"Gallery and Glossary surface physical (datastore/field) and invariant nodes as domain vocabulary","description":"galleryTypes() drives the Gallery and Glossary type chips from every PALETTE key except 'hotspot' that is present in the model — so datastore, field, and invariant nodes appear as 'stickies' in the gallery and as dictionary entries in the Ubiquitous Language glossary, alongside the behavioral concepts. Physical data-model nodes have their own Data model tab and invariants normally hang off an aggregate's detail, so listing them as ubiquitous-language terms may be noise. Human question: should the glossary (and gallery) exclude the physical layer and invariants, or is showing every sticky type intentional?","tactical":{"explanation":"galleryTypes(model) = Object.keys(PALETTE).filter(t => t !== 'hotspot' && model.nodes.some(n => n.type === t)); PALETTE includes datastore, field, and invariant. Both Gallery.jsx and Glossary.jsx take `types` straight from the store (galleryTypes) for their chip set and default-active filter, and iterate model.nodes unfiltered by plane. So every datastore/field/invariant renders as a term. Only 'hotspot' is deliberately excluded.","anchors":[{"path":"src/web/model.js","line":13,"symbol":"galleryTypes","note":"all PALETTE types except hotspot, if present in model"},{"path":"src/domain/model/palette.ts","line":11,"symbol":"PALETTE","note":"invariant/datastore/field are palette types"},{"path":"src/web/components/Glossary.jsx","line":29,"symbol":"Glossary","note":"filters model.nodes only by active type + query, not by plane"}]}},{"id":"hot-selection-global-shared","label":"One process-global selection, read with no freshness or ownership signal","description":"The selection is a single process-global pointer shared by the web UI and EVERY connected MCP session, with no per-session scoping and no expiry. get_current_selection returns the node with no timestamp or age, even though the Selection stores `at`, and nothing invalidates the selection when the human navigates away. So a connected Claude session can read a selection another person set, or one the human clicked minutes ago, and cannot tell. Human questions: when more than one Claude session (or more than one person) connects, is a single shared selection intended, or should it be scoped per client? Should the tool surface the selection's age so a stale click is visible?","tactical":{"explanation":"Selection holds one private `selection` field for the whole process; get() returns { nodeId, at } but get_current_selection's handler discards `at` and renders only the node context, so the age never reaches the client. There is no TTL and no clear-on-navigate. Every MCP session's tools close over the same services + selection + bundle (createMcpHandler), so all readers see the one selection.","anchors":[{"path":"src/domain/session/selection.ts","line":14,"symbol":"get","note":"single shared { nodeId, at }; `at` captured but unused by the reader"},{"path":"src/adapters/mcp/mcp-server.ts","line":36,"symbol":"get_current_selection","note":"renders node context only; drops the selection timestamp"},{"path":"src/adapters/mcp/mcp-server.ts","line":116,"symbol":"createMcpHandler","note":"all MCP sessions share one services+selection+bundle"}]}},{"id":"hot-mcp-read-desc-drift","label":"Read-tool registered descriptions drift from actual behavior / mcp.md","description":"Two read tools advertise themselves inaccurately to a client selecting tools by description. get_flow's registered description lists 'trigger/summary, the command→aggregate→event chain, hotspots, and every node with its source anchors' but never mentions the Mermaid graph it returns — a feature mcp.md DOES document. list_data_model's registered description is relational-only ('servers ▸ databases ▸ tables ▸ columns') while the implementation (dataModelTree/renderDataModelMarkdown) is storage-neutral and mcp.md hedges with '(or the equivalent for non-relational storage)'. Human question: should the registered tool descriptions be regenerated from mcp.md/the implementation so a client picking tools by description isn't misled (get_flow yields a graph; list_data_model handles any storeKind)?","tactical":{"explanation":"get_flow registerTool description (mcp-server.ts:57) omits Mermaid, yet renderFlowMarkdown appends fc.mermaid built by flowMermaid. list_data_model registerTool description (mcp-server.ts:77) says 'servers ▸ databases ▸ tables ▸ columns', but renderDataModelMarkdown labels each node by its freeform storeKind and walks any containment tree. mcp.md is the corrected face (mentions the Mermaid graph and the non-relational equivalent); the in-code tool descriptions were not kept in sync by the refactor.","anchors":[{"path":"src/adapters/mcp/mcp-server.ts","line":57,"symbol":"get_flow","note":"description omits the Mermaid graph it returns"},{"path":"src/adapters/mcp/mcp-server.ts","line":77,"symbol":"list_data_model","note":"relational-only wording vs storage-neutral impl"},{"path":"src/application/read-models/context.ts","line":360,"symbol":"renderFlowMarkdown","note":"appends the Mermaid graph to every get_flow result"}]}},{"id":"hot-mcp-grounded-output-unbounded","label":"Grounded read results inline source for every node with no size cap","description":"get_flow grounds EVERY node in a flow and the selected-nodes resource grounds EVERY bundled item, each anchor carrying a ±8-line fenced source excerpt (includeSource defaults true on the MCP path). There is no cap on how large the returned markdown gets, even though the inbound request body is capped at 4MB. A large flow or a big curated bundle could return a very large tool result and eat the client's context window. Human question: should get_flow / the bundle resource cap or paginate grounded output, or expose an includeSource=false toggle on the MCP path (buildNodeContext already supports the flag, but the tools always pass the default)?","tactical":{"explanation":"buildNodeContext({ includeSource = true }) reads a source excerpt per anchor; buildFlowContext and renderBundleMarkdown call it for every node/item and never pass includeSource:false. The MCP tools expose no way to opt out. Contrast: readJsonBody caps the INBOUND body at 4_000_000 bytes, but nothing bounds the OUTBOUND grounded markdown.","anchors":[{"path":"src/application/read-models/context.ts","line":240,"symbol":"buildFlowContext","note":"grounds every node with source (includeSource default true)"},{"path":"src/application/read-models/context.ts","line":121,"symbol":"buildNodeContext","note":"readSource excerpt per anchor, no cap"},{"path":"src/adapters/mcp/mcp-server.ts","line":102,"symbol":"readJsonBody","note":"4MB cap on inbound body only; no outbound cap"}]}},{"id":"hot-invalid-model-written","label":"es-merge writes an invalid flows.json even when validation fails","description":"The CLI writes the merged model to disk BEFORE it checks errors, then exits 1. So a validation failure still leaves an invalid flows.json on disk, which a later es-view auto-discovery could pick up and serve, whereas the server's --traces path throws and serves nothing. Human question: should es-merge withhold the output file on validation errors (write only when clean), or is emitting the invalid artifact for debugging intended? The two callers disagree today.","tactical":{"explanation":"es-merge.ts's runMerge: `if (model) writeModelFile(outFile, model)` at line 24, then errors are printed and `process.exit(1)` at line 30 -- the file is already on disk. mergeTraceDocs always returns a model object (it never nulls on validation errors; null only happens in the application-layer mergeTraces when the dir has zero files). resolveModel (resolve-model.ts) instead throws when merged.errors.length, so the in-memory server path never exposes an invalid model. Still true after the refactor; the file/function names changed but the sequencing did not.","anchors":[{"path":"src/adapters/cli/es-merge.ts","line":24,"symbol":"runMerge","note":"writes model before the error check"},{"path":"src/adapters/cli/es-merge.ts","line":30,"symbol":"runMerge","note":"errors printed then process.exit(1), after the write"},{"path":"src/application/commands/resolve-model.ts","line":37,"symbol":"resolveModel","note":"server throws and refuses to serve on any error (37-40)"}]}},{"id":"hot-data-model-drops-nested-loose-fields","label":"Data-model tab counts fields it never renders (nested sub-fields and loose fields)","description":"DataModel.jsx's header count (`dataCount`) counts EVERY datastore + field node in the model, but both renderers draw only the DIRECT `field` children of a rendered record set: the SPA's fieldsOf(id) and the MCP markdown's per-store fields line each go exactly one level deep. Nested sub-fields (a field whose parent is another field) and loose fields (a field parented to nothing or to a non-datastore) are counted but never shown on the canvas or in the markdown — even though selectors.mjs already provides fieldTree() for nested fields and dataModelTree()'s looseFields for orphans, which neither renderer wires up. Human question: is the one-level-of-fields rendering intentional (keep the graph shallow), or should the Data-model tab render nested/loose fields so the 'Data model N' badge matches what is actually drawn?","tactical":{"explanation":"DataModel.jsx:16 dataCount = model.nodes.filter(datastore|field).length feeds the header badge and the empty-state gate. datamodel-layout.js:50 fieldsOf(id) = fields with parent===id (direct only); buildCard iterates fieldsOf(ds.id) with no recursion into sub-fields. context.ts renderDataModelMarkdown lists dataModelTree's per-node `fields` (childFields, one level) and walks only `roots`+`stores`, never emitting looseFields. indexes.ts fieldTree() (nested) and dataModelTree's looseFields (orphans) exist but are unused by both the tab and the tool, so any nested/loose field inflates the count without appearing.","anchors":[{"path":"src/web/components/DataModel.jsx","line":16,"symbol":"DataModel","note":"dataCount counts ALL datastore+field nodes"},{"path":"src/web/lib/datamodel-layout.js","line":50,"symbol":"renderDataModelInto","note":"fieldsOf: direct field children only, no sub-field recursion"},{"path":"src/application/read-models/indexes.ts","line":98,"symbol":"dataModelTree","note":"looseFields computed but rendered by neither surface"},{"path":"src/application/read-models/indexes.ts","line":133,"symbol":"fieldTree","note":"nested-field support that the renderers do not use"},{"path":"src/application/read-models/context.ts","line":333,"symbol":"renderDataModelMarkdown","note":"markdown per-store fields also one level; looseFields never emitted"}]}},{"id":"hot-ui-shells-claude-cli","label":"A browser click spawns a host process running the user's claude CLI","description":"Clicking 'Add to Claude' makes the loopback server run `claude mcp add` on the host via a SHELL STRING (exec, not execFile/arg-array). Today the inputs are non-injectable — name is a constant, the URL is the server's own quoted localhost address, and scope is double-whitelisted — so this is not arbitrary command execution, and the server already runs as the user, so the code argues 'no new privilege'. Still, a web page triggering host command execution is a real trust surface. Because the command is built by string concatenation and run through a shell, ANY future change that lets a caller-supplied value flow into the string (a different MCP name, a custom URL, extra flags) would become a shell-injection vector with no escaping in place. Human question: should the one-click convenience be kept as-is, or should host-command execution from the UI require an explicit terminal confirmation / a boot token, and should the exec be hardened to execFile with an argument array so the string can never be re-opened to injection?","tactical":{"explanation":"POST /api/mcp/register (adapters/http/server.ts:202) -> the registerMcp application command -> claudeMcpAdd -> exec(command, ...) (adapters/process/claude-cli.ts:18). The command is a single string built at claude-cli.ts:16 by template concatenation; exec spawns it via the OS shell (cmd.exe on Windows, /bin/sh on POSIX). The file comment (claude-cli.ts:1-8) documents the deliberate choice of exec over execFile(args,{shell:true}) to let a Windows claude.cmd shim resolve, and asserts every part is controlled. That holds for the CURRENT inputs only; the safety is by-construction of the fixed template, not by escaping. The server binds 127.0.0.1 by default, overridable via --host (adapters/cli/cli.ts:40), which would expose this write endpoint beyond loopback.","anchors":[{"path":"src/adapters/process/claude-cli.ts","line":16,"symbol":"claudeMcpAdd","note":"command string built by template concatenation"},{"path":"src/adapters/process/claude-cli.ts","line":18,"symbol":"claudeMcpAdd","note":"exec(command) runs the user's claude CLI through a shell"},{"path":"src/adapters/http/server.ts","line":202,"symbol":"createServer","note":"unauthenticated POST route that triggers the shell-out"},{"path":"src/adapters/cli/cli.ts","line":40,"symbol":"program","note":"--host option overrides the 127.0.0.1 default, widening exposure"}]}},{"id":"hot-mcp-register-no-csrf","label":"The shell-out endpoint has no auth, CSRF, or Origin check","description":"POST /api/mcp/register performs a host-side side effect (running the user's claude CLI) with NO authentication, NO CSRF token, and NO Origin/Host validation anywhere in the server (a repo-wide grep for origin/cors/csrf/token/auth in src/adapters/http and src/adapters/mcp finds nothing). The SPA's own call sends content-type application/json, which forces a CORS preflight a cross-origin page can't satisfy — but the server reads the body with JSON.parse regardless of content-type and only uses body.scope, so a simple form-encoded or text/plain POST (which skips preflight) with an empty/garbage body still triggers registration. That opens a CSRF / DNS-rebinding path: a malicious page the operator visits while es-view is running could silently register this app into their Claude config. Impact is bounded — the command is fixed to `claude mcp add` pointing at this app's own URL, so it is not RCE — but it is still an unconsented host state change. Human question: should this endpoint require a same-origin/Origin check (or a per-boot token minted into the SPA) before it will shell out, and should it reject non-JSON content types?","tactical":{"explanation":"adapters/http/server.ts has no Origin/Host/referer validation on any route (confirmed by grep). readJsonBody (adapters/http/server.ts:61-68) JSON.parses whatever body arrives and swallows parse errors to {}; the register route (adapters/http/server.ts:202-207) then calls the registerMcp application command, which whitelists body.scope (application/commands/register-mcp.ts:8) and proceeds — an empty body just yields scope=undefined, still a valid registration. Combined with the default loopback bind (mitigation) and the --host override (aggravator), the missing origin defense is the sharp part: loopback is not a trust boundary against a browser the user is driving. Note the register route sits BEFORE the generic /api 404 and has no gate other than inv-mcp-url-ready.","anchors":[{"path":"src/adapters/http/server.ts","line":202,"symbol":"createServer","note":"POST /api/mcp/register: no auth/CSRF/Origin check before shelling out"},{"path":"src/adapters/http/server.ts","line":61,"symbol":"readJsonBody","note":"parses any body regardless of content-type; errors -> {}"},{"path":"src/application/commands/register-mcp.ts","line":8,"symbol":"registerMcp","note":"only guard is the scope whitelist; empty body still registers"}]}},{"id":"hot-discovery-ambiguity","label":"Auto-discovery silently picks one flows.json among many","description":"When no --model/--traces is given and the cwd subtree contains more than one flows.json, ResolveModel serves hits[0] chosen purely by a heuristic sort (a file inside a model/ directory wins, then the shallowest path, then alphabetical) and only emits a warning line -- it does not stop or prompt. Human question: is the heuristic the right default, and is a warning enough, or should multiple candidates be a hard error that forces the operator to pass --model? A stale or example flows.json left in a subdirectory can quietly win over the intended one.","tactical":{"explanation":"findFlowsFiles (src/adapters/fs/model-repository.ts) walks cwd (maxDepth 6) and sorts: model/flows.json first (regex on the path), then fewer path segments, then localeCompare. resolveModel takes discovered[0] and, only when discovered.length > 1, pushes `found N flows.json files; using \u003crel>. Pass --model to choose another.` into warnings. The selection is otherwise silent and non-blocking.","anchors":[{"path":"src/adapters/fs/model-repository.ts","line":30,"symbol":"findFlowsFiles","note":"sort heuristic that decides the winner"},{"path":"src/application/commands/resolve-model.ts","line":46,"symbol":"resolveModel","note":"take discovered[0]; warn only when >1 candidate"}]}},{"id":"hot-repo-root-stale","label":"Derived repoRoot can point at a path that doesn't exist here","description":"The repoRoot used to resolve every /api/source anchor deep-link is derived, not verified. When no --repo-root flag is passed and the source is a loaded flows.json, repoRoot = model.meta.repoRoot || cwd. The merge NEVER sets meta.repoRoot, so a --traces or freshly merged model falls back to cwd; but a hand-authored or generator-stamped flows.json can carry an absolute meta.repoRoot from the machine that produced it, making anchors resolve against a directory that doesn't exist on this machine (source lookups then fail). Human question: should es-view validate that the derived repoRoot exists / contains the anchored files, and warn or fall back to cwd when it doesn't?","tactical":{"explanation":"resolveModel: resolvedRepoRoot = repoRoot flag ? resolve(cwd,flag) : source==='example' ? packageRoot : (model.meta && model.meta.repoRoot) || cwd. mergeTraceDocs (src/domain/model/merge.ts) builds meta = { generatedFrom, counts, deadFlows, sharedGlossary } with NO repoRoot key, so merged models always land on cwd; only a pre-existing flows.json with a meta.repoRoot (e.g. an absolute path baked in elsewhere) diverges. No existence check is done on the result.","anchors":[{"path":"src/application/commands/resolve-model.ts","line":61,"symbol":"resolveModel","note":"repoRoot derivation chain, unvalidated"},{"path":"src/domain/model/merge.ts","line":109,"symbol":"mergeTraceDocs","note":"meta built WITHOUT a repoRoot key"}]}},{"id":"hot-unvalidated-model-served","label":"Only --traces validates; --model/discovered/example are served unchecked","description":"Three of the four tiers (--model, auto-discovered, bundled example) load via readModelFile, whose ONLY check is that nodes[] and flows[] are arrays. They completely bypass the merge's invariant suite (referential integrity, ES grammar, term contract, data lineage). So a structurally-shaped but semantically-broken flows.json -- including one that es-merge itself wrote to disk despite failing validation (see hot-invalid-model-written) and that auto-discovery later picks up -- is served without complaint, while the same content passed via --traces would be rejected. Human question: should the load tiers also run the merge validation (or at least a referential-integrity pass) before serving, so the two entry paths agree?","tactical":{"explanation":"readModelFile (src/adapters/fs/model-repository.ts) does JSON.parse + Array.isArray(nodes)/Array.isArray(flows) only. The --traces tier alone routes through mergeTraces/mergeTraceDocs and throws on merged.errors. This mirrors, on the read side, the CLI's write-before-validate gap: es-merge can leave an invalid flows.json on disk, and the discovered tier would serve it after only the shape check.","anchors":[{"path":"src/adapters/fs/model-repository.ts","line":43,"symbol":"readModelFile","note":"sole check on load tiers: nodes/flows are arrays"},{"path":"src/application/commands/resolve-model.ts","line":34,"symbol":"resolveModel","note":"only --traces runs full merge validation (throws on error)"}]}},{"id":"hot-hotspot-selection-not-mirrored","label":"Selecting a hotspot never mirrors to the server, so Claude cannot see the operator is looking at a hotspot","description":"openDetail (node click) mirrors to the server via pushSelection; its sibling openHotspot (red-sticky click) sets local detail state ONLY and never posts. So when the operator opens a hotspot's detail -- the tool's whole payoff, the open questions -- a connected Claude session's get_current_selection still reports the LAST node (or 'nothing selected'), never the hotspot. The selection channel is deliberately node-only (Selection is typed to a single nodeId; the selectNode command validates against nodeById and would return not-found for a hotspot id, which the route maps to a 404), so this may be intended. Human question: is it acceptable that Claude is blind to the operator viewing a hotspot, or should hotspot selections be mirrored too (a typed selection, or a separate get_current_hotspot tool) so Claude can help answer the very open question the operator is staring at?","tactical":{"explanation":"store.jsx openDetail (line 43) calls pushSelection(id) at line 46; openHotspot (line 48) = `setDetail({ kind:'hotspot', id })` with NO pushSelection and it does not even set selectedNodeId. openHotspot is live-wired to real clicks: Main.jsx:137 (hotspot cards on the board) and ContextBundle.jsx:19 (bundle hotspot rows). The server selection is node-only: the selectNode command guards `nodeById.has(nodeId)` (application/commands/select-node.ts:12) so a hotspot id is rejected as not-found, and get_current_selection (mcp-server.ts:36) only ever resolves a node. Net effect: the hotspot the operator is viewing is invisible to Claude via the selection channel.","anchors":[{"path":"src/web/store.jsx","line":48,"symbol":"openHotspot","note":"local detail state only; no pushSelection, no selectedNodeId"},{"path":"src/web/store.jsx","line":46,"symbol":"openDetail","note":"the node path DOES mirror -- the asymmetry"},{"path":"src/web/components/Main.jsx","line":137,"symbol":"Main","note":"hotspot card onClick={() => openHotspot(s.id)}"},{"path":"src/application/commands/select-node.ts","line":12,"symbol":"selectNode","note":"selection validated node-only via nodeById; a hotspot id would return not-found"}]}},{"id":"hot-selection-never-cleared","label":"Closing the detail panel never clears the selection server-side, so Claude sees a stale node","description":"closeDetail clears only React state (setSelectedNodeId(null); setDetail(null)); it does NOT tell the server. The server (and therefore get_current_selection) keeps the LAST selected node indefinitely, so a connected Claude session reports the operator is 'looking at' a node they already dismissed. A clean path exists but is unused: DELETE /api/selection -> the clearSelection command (-> selection.clear()) is wired server-side, but the SPA client has no wrapper for it (api.js exposes only pushSelection's POST). The selection's `at` timestamp is captured but never surfaced, so there is not even an age hint. Human question: should closeDetail clear the server selection on close, or is holding the last-viewed node intended for Claude's continuity (and if so, should get_current_selection expose staleness/age)?","tactical":{"explanation":"store.jsx closeDetail (line 49) = `setSelectedNodeId(null); setDetail(null)` only, no api call. There is no DELETE (or GET) /api/selection caller anywhere in src/web -- api.js's only /api/selection reference is pushSelection's POST. Server-side, the clearSelection command (application/commands/clear-selection.ts) -> selection.clear() (domain/session/selection.ts) is wired to DELETE /api/selection (server.ts:130) but nothing invokes it. get_current_selection (mcp-server.ts:36) reads selection.get() live, returning the last node set until the process ends or a new node is opened. The `at` stamp (selection.ts:20) is never read back out, so staleness is undetectable.","anchors":[{"path":"src/web/store.jsx","line":49,"symbol":"closeDetail","note":"clears React state only; no server call"},{"path":"src/adapters/http/server.ts","line":130,"symbol":"createServer","note":"DELETE /api/selection -> clearSelection exists but the SPA never calls it"},{"path":"src/application/commands/clear-selection.ts","line":4,"symbol":"clearSelection","note":"server clear path, unreferenced by the UI"}]}},{"id":"hot-source-read-scope","label":"/api/source can read any file under the repo root, not just model anchors","description":"The path-traversal guard correctly blocks ../ and absolute-path escapes, but it only sandboxes reads to the repo ROOT — it does not restrict them to files that are actually anchors in the model, and it is a lexical guard that does NOT resolve symlinks. So the endpoint will serve the contents of ANY file under the repo root (e.g. .env, .git/config, committed keys) to whoever can reach the server, and a symlink inside the tree pointing outside would be followed. The default bind is 127.0.0.1 (localhost only, no auth), but --host accepts any address (e.g. 0.0.0.0), which would expose this unauthenticated file-read on the network. Human question: is arbitrary repo-root file read the intended trust boundary, and should the guard additionally (a) restrict to known anchor paths, (b) realpath-resolve symlinks, and/or (c) refuse to bind a non-loopback --host without auth?","tactical":{"explanation":"guardPath guards abs against root+path.sep (domain/source/source-window.ts) — lexically sound, but there is no allowlist of anchor paths and no fs.realpath check, and the read (fs.readFileSync in the fs source-gateway) will return any in-root file. The handler is unauthenticated (server.ts's /api/source branch). startServer defaults host to 127.0.0.1 (server.ts) but the CLI's --host option (cli.ts, on the `view` subcommand) overrides it with no auth gate, so 0.0.0.0 would publish the read to the LAN.","anchors":[{"path":"src/domain/source/source-window.ts","line":26,"symbol":"guardPath","note":"lexical sandbox guard: no anchor allowlist, no symlink realpath"},{"path":"src/adapters/http/server.ts","line":194,"symbol":"createServer","note":"unauthenticated /api/source returns viewSource(...) verbatim"},{"path":"src/adapters/http/server.ts","line":223,"symbol":"startServer","note":"default host 127.0.0.1"},{"path":"src/adapters/cli/cli.ts","line":40,"symbol":"view","note":"--host option on the `view` subcommand overrides the loopback default with no auth"}]}}],"terms":[{"id":"term-es-actor","term":"Actor","category":"role","aka":["actor-*","user","role"],"definition":"A person or role that issues commands and reads read models to decide. This self-model has exactly one: the Operator, the local developer who runs the recovery CLIs and the explorer. A connected Claude session acts through the Operator's session rather than as a distinct actor node.","relatedNodes":["actor-operator"],"anchors":[{"path":"docs/reference/flows-schema.md","line":24,"symbol":"Node type: actor"}],"status":"resolved"},{"id":"term-es-aggregate","term":"Aggregate","category":"concept","aka":["agg-*"],"definition":"A consistency boundary: state that changes together and enforces its own invariants. In Event Storming an aggregate only RECEIVES commands and EMITS events, never issues a command. In a services-and-repositories codebase there are no explicit aggregates, so the data-layer scout recovers them as clusters of entities that change together (they are almost always `inferred: true`).","relatedNodes":["agg-model","agg-comment-store","agg-context-bundle","agg-server-session","agg-selection","agg-mcp-registration","agg-source-reader"],"anchors":[{"path":"docs/reference/flows-schema.md","line":40,"symbol":"Node rules: aggregates only receive commands and emit events"}],"status":"resolved"},{"id":"term-rt-anchor","term":"Anchor","category":"concept","aka":["tactical.anchors","source anchor"],"definition":"A `{ path, line, symbol }` pointer from a model node to the exact source that implements it. Anchors are how the Explorer moves between the strategic (sticky) and tactical (code) planes: they back the inline 'view source' excerpt, the VS Code deep link, and every grounded Markdown export's inlined code. `symbol` (method/handler/class) is strongly encouraged because it survives rebases; `line` alone rots.","relatedNodes":["cmd-view-source","rm-source-excerpt","ds-repo-source-file"],"status":"resolved"},{"id":"term-es-bounded-context","term":"Bounded context","category":"concept","aka":["subdomain","swimlane"],"definition":"A strategic boundary within which the ubiquitous language is consistent; edges crossing it are the integration points. This tool deliberately treats bounded contexts as a documented LIMIT rather than something it infers: a code-derived model is a scaffold that does not capture timeline order, bounded contexts, or swimlanes on its own, because code layout (namespaces/folders) is an accident, not a domain fact.","status":"partial","openQuestion":"This self-model does not declare any bounded-context boundaries. Is the event-storming-recovery tool (CLI/merge/generate) meant to be a separate bounded context from the es-view server + MCP surface, or is the whole tool one context? A human who knows the intended architecture should label this explicitly if it matters.","anchors":[{"path":"prompts/00-orchestrator.md","line":159,"symbol":"a code-derived model ... does not capture timeline order, bounded contexts, swimlanes"}]},{"id":"term-es-command","term":"Command","category":"concept","aka":["cmd-*"],"definition":"An intent to change state, named in the imperative (\"MergeTraces\", \"RegisterMcp\"). Commands come from actors, policies, or external systems, are handled by an aggregate, and produce an event. A command that must read other aggregates/read models before acting (gating data, join keys) expresses that with a `reads` edge rather than folding the lookup silently into tactical prose.","relatedNodes":["cmd-merge-traces","cmd-generate-views","cmd-add-comment","cmd-register-mcp"],"anchors":[{"path":"docs/reference/flows-schema.md","line":25,"symbol":"label: commands IMPERATIVE"},{"path":"docs/reference/flows-schema.md","line":47,"symbol":"Command lookups"}],"status":"resolved"},{"id":"term-rt-context-bundle","term":"Context bundle","category":"concept","aka":["the bundle","Add to context bundle"],"definition":"The insertion-ordered, deduped set of typed refs (`{ type: node|flow|hotspot, id }`) the operator gathers via right-click → 'Add to context bundle' across the SPA. Purely in-memory per server run; it is the read side both the clipboard's 'Copy all for Claude' and the `event-storming://selected-nodes` MCP resource render from.","relatedNodes":["agg-context-bundle","rm-context-bundle","rm-selected-bundle"],"status":"resolved"},{"id":"term-rt-current-selection","term":"Current selection","category":"state","aka":["the selected node","\"the node the user is looking at\""],"definition":"The single node id (plus click timestamp) the operator most recently opened in the Detail panel, held in the same in-memory slot the API write side and the MCP read side both close over. This is the mechanism behind 'explain the selected node/aggregate' — a browser click becomes instantly readable to a connected Claude session with no polling.","relatedNodes":["agg-selection","cmd-select-node","evt-node-selected","cmd-get-current-selection"],"status":"resolved"},{"id":"term-es-data-model-layer","term":"Data model layer","category":"concept","aka":["physical layer","Phase 5.5","data mapping"],"definition":"The optional Phase 5.5 addition that joins the behavioral model to physical storage: a demand-driven `fields[]` array on read models and aggregates (never a full-ERD dump), plus two technology-neutral physical node types (`datastore`, `field`) linked to behavior by `persists to` / `projects from` / `writes` / `connects via` edges. It answers \"what data does this read model/aggregate return, and where does it come from?\" without forcing relational vocabulary onto files, queues, or caches.","anchors":[{"path":"docs/reference/flows-schema.md","line":68,"symbol":"## Data model (the physical layer)"},{"path":"docs/explanation/METHOD.md","line":183,"symbol":"Phase 5.5 - Data mapping"}],"status":"resolved"},{"id":"term-es-datastore","term":"Datastore","category":"concept","aka":["ds-*","storeKind"],"definition":"A physical node type: any container of data (server, database, table, filesystem, directory, file, broker, queue, cache, ...). It self-nests via a `parent` pointer to whatever depth the real storage has, with an open-vocabulary `storeKind` label naming the concrete flavor. Unlike behavioral nodes, physical nodes default `inferred: false` because the code or config literally names them.","relatedNodes":["ds-model-fs","ds-flows-json","ds-comments-json","ds-session-state","ds-traces-dir"],"anchors":[{"path":"docs/reference/flows-schema.md","line":107,"symbol":"Physical node types: datastore | field"}],"status":"resolved"},{"id":"term-es-dead-flow","term":"Dead flow","category":"state","aka":["status: dead","deadFlows","dead-flow index"],"definition":"A flow whose code path is unreachable by any real actor today, but which is still traced (not skipped): the delta between a dead flow and any replacement is recovered intent that no other reading of the codebase produces. `dead` is a positive claim needing positive evidence (a verified removal commit, or an exhaustive search ruling out indirect invocation), not a default for \"couldn't find the trigger.\" This self-model's current trace has none (`meta.deadFlows` is empty); the merge step still computes a `dead-flow index` (every non-live flow projected to `{ id, status, supersededBy, name }`) whenever one exists.","anchors":[{"path":"docs/reference/flows-schema.md","line":168,"symbol":"status: live | dead | superseded"},{"path":"docs/explanation/METHOD.md","line":121,"symbol":"dead is a positive claim that needs positive evidence"},{"path":"src/domain/model/merge.ts","line":211,"symbol":"deadFlows computation"}],"status":"resolved"},{"id":"term-rt-deep-trace","term":"Deep-trace","category":"role","aka":["trace agent","tracer"],"definition":"A Phase-3 agent that owns one domain flow end to end: verifies reachability at both ends (a real actor-reachable trigger, and a real final effect — 'dead-but-armed' code that compiles and is wired but nothing can start is not reachable), traces the main spine, spawns its own children to chase high-signal side-branches, and writes its own `\u003cflow-id>.json` + `\u003cflow-id>.notes.md` into the traces directory. One pilot trace runs before the rest, specifically to surface schema/briefing gaps cheaply.","relatedNodes":["ds-trace-json"],"anchors":[{"path":"prompts/03-trace-briefing.md","line":1,"symbol":null,"note":"Deep-trace agent briefing (Phase 3)"},{"path":"docs/explanation/METHOD.md","line":99,"symbol":null,"note":"Phase 3 — Deep-trace: pilot first, then waves"}],"status":"resolved"},{"id":"term-es-domain-event","term":"Domain Event","category":"concept","aka":["Event","evt-*"],"definition":"A named business fact that already happened, stated in the past tense (\"ModelMerged\", \"McpRegistered\"). \"A row was inserted\" is not an event; the discriminator against a raw log line or measurement is whether the fact is domain-significant. Prefer few meaningful events over one event per statement: a multi-table transactional write is still one event from one aggregate.","relatedNodes":["evt-model-merged","evt-mcp-registered","evt-comment-added"],"anchors":[{"path":"docs/reference/flows-schema.md","line":54,"symbol":"Node rules: events past tense"}],"status":"resolved"},{"id":"term-rt-es-view","term":"es-view","category":"system","aka":["event-storming-recovery view","the viewer","the explorer server"],"definition":"The npm bin (`bin/es-view.mjs`) that boots a running Explorer session: it resolves which model to serve, wires shared in-memory state and the comment sidecar, mounts the SPA + JSON API + MCP endpoint on one local `http.Server`, binds a port, and best-effort opens the browser. Run via `npx event-storming-recovery view` (aliased `es-view`).","relatedNodes":["agg-server-session","cmd-launch-explorer"],"anchors":[],"status":"resolved"},{"id":"term-es-event-storming","term":"Event Storming","category":"concept","aka":["ES","event storm"],"definition":"A workshop technique for modeling a business domain as a timeline of domain events, then filling in the commands, aggregates, policies, read models, actors, and external systems around them. This tool recovers a first-draft Event Storming model directly from code instead of running a from-scratch workshop, so the result is an always-true scaffold and conversation starter, not a replacement for the wall.","anchors":[{"path":"docs/explanation/METHOD.md","line":9,"symbol":"The problem"}],"status":"resolved"},{"id":"term-rt-explorer","term":"Explorer","category":"system","aka":["the SPA","explorer.html","the app"],"definition":"The interactive React single-page app es-view serves (Flows board, Gallery, Overview, Glossary, Data model tabs plus a source-linked Detail panel). The same model also renders to a self-contained static `explorer.html` via `es-generate`, so 'Explorer' names both the running app and its generated offline twin.","relatedNodes":["rm-flows-board","rm-gallery","rm-overview","rm-glossary","rm-detail-panel"],"status":"resolved"},{"id":"term-es-external-system","term":"External System","category":"system","aka":["ext-*"],"definition":"A system outside the deploy boundary: SaaS, another service, a cloud API, the local browser, VS Code, Claude Desktop/CLI over MCP, or CI, as this self-model uses the concept. It can issue commands and raise or receive events. An in-process library is NOT an external system; an aggregate whose state actually lives inside one is marked with `ownedBy`.","relatedNodes":["ext-claude-mcp","ext-browser","ext-vscode","ext-ci","ext-clipboard","ext-graphviz","ext-claude-cli"],"anchors":[{"path":"docs/reference/flows-schema.md","line":56,"symbol":"Node rules: external systems"}],"status":"resolved"},{"id":"term-es-field","term":"Field","category":"concept","aka":["fld-*","fieldKind","conceptual field"],"definition":"Two related but distinct senses share this word. A physical `field` (`fld-*`) is a stored attribute hanging off a `datastore` or another field, with a `fieldKind` label (column, key, property, message-field, ...). A conceptual field is an entry in a read model's or aggregate's `fields[]` list: a property consumers see, carrying a prose `derivation` over 0..N storage `sources` (zero sources is valid for a computed/constant/unresolved value) - never assume a 1:1 field-to-column mapping.","relatedNodes":["fld-comment-key","fld-comment-id","fld-comment-text","fld-comment-at"],"anchors":[{"path":"docs/reference/flows-schema.md","line":73,"symbol":"fields[] on readModel & aggregate nodes"},{"path":"docs/reference/flows-schema.md","line":116,"symbol":"field: a stored attribute hanging off a datastore"}],"status":"resolved"},{"id":"term-es-flow","term":"Flow","category":"concept","aka":["trace","flow-candidate"],"definition":"One end-to-end path through the model: a trigger, an ordered `steps` lane of node ids, the `edges` connecting them, and a plain-language summary of what happens and why. A flow is `tier` 1 (individually traced) or 2 (a pattern exemplar traced once with `instances` listed), and carries a `status` of live, dead, or superseded. Flows are how the map stays walkable story-by-story even though nodes are shared globally across them.","anchors":[{"path":"docs/reference/flows-schema.md","line":162,"symbol":"## Flow"}],"status":"resolved"},{"id":"term-rt-generate","term":"Generate","category":"concept","aka":["es-generate","generate-views.js","GenerateViews"],"definition":"The deterministic, stateless render step (`tools/generate-views.js`, bin name `es-generate`) that reads a canonical `flows.json` and writes two files: `flows.dot` (a Graphviz digraph, one cluster per flow) and a single self-contained `explorer.html` with the whole model inlined. It trusts the merge's output contract fully — no re-validation on the generate side.","relatedNodes":["cmd-generate-views","rm-flows-dot","rm-explorer-html"],"anchors":[],"status":"partial","openQuestion":"es-generate fully trusts es-merge's output and never validates; is that an acceptable division of labor (validate-once-at-merge) given a hand-edited or externally-produced flows.json could reach es-generate directly (see hot-generator-trusts-unvalidated-model)?"},{"id":"term-es-grounded","term":"Grounded (node/flow)","category":"jargon","aka":["grounded context","grounded markdown"],"definition":"This tool's own coinage for a model node or flow rendered together with the REAL source excerpt behind every one of its anchors, not just its label. `buildNodeContext`/`buildFlowContext` assemble it for the SPA's inline detail panel and the MCP read tools, so a connected Claude session (or the browser-side panel) sees actual code, not a summary of it - the point being that a refactor request stays anchored to real files.","relatedNodes":["rm-grounded-node","rm-grounded-flow","rm-grounded-markdown"],"anchors":[],"status":"resolved"},{"id":"term-rt-grounded-markdown","term":"Grounded Markdown","category":"concept","aka":["Copy for Claude","Copy all for Claude","grounded context"],"definition":"The ready-to-paste Markdown rendering of a node, flow, hotspot, or the whole context bundle: label, description, fields, invariants/related, flows, human comments, and — for every tactical anchor — the ACTUAL source code re-read fresh from disk. It is the one projection shared by the clipboard 'Copy for Claude' actions, the MCP tools, and the `selected-nodes` MCP resource, so 'grounded' means every claim is backed by a live source-file read, not a cached label.","relatedNodes":["rm-grounded-markdown","cmd-copy-for-claude","rm-grounded-node"],"status":"resolved"},{"id":"term-es-hotspot","term":"Hotspot","category":"concept","aka":["red sticky","hot-*"],"definition":"The red sticky: friction, risk, disagreement, or a place where intent is unrecoverable from code, framed as THE QUESTION A HUMAN SHOULD ANSWER and anchored to source. Hotspots are the payoff of a code-derived model and the one thing no code reading can produce on its own; they attach at flow level (a flow's `hotspots` array of ids like `hot-mcp-grounded-output-unbounded`), living in the model's own top-level `hotspots` array, not inside `nodes`.","anchors":[{"path":"docs/reference/flows-schema.md","line":181,"symbol":"## Hotspot"},{"path":"docs/explanation/METHOD.md","line":225,"symbol":"Hotspots are questions, not verdicts"}],"status":"resolved"},{"id":"term-es-invariant","term":"Invariant","category":"concept","aka":["inv-*","business rule","guard"],"definition":"A constraint enforced INSIDE an aggregate while it handles a command, before any event, that can reject the action (\"a comment's target must already exist\", \"an aggregate never issues a command\"). It is not event-triggered and does not issue a command, which is exactly what distinguishes it from a Policy. Invariants attach to their aggregate with an `enforces` edge and never appear in a flow's `steps` lane.","relatedNodes":["inv-comment-target-exists","inv-comment-text-nonempty","inv-referential-integrity","inv-es-grammar"],"anchors":[{"path":"docs/reference/flows-schema.md","line":45,"symbol":"Node rules: invariant vs policy"}],"status":"resolved"},{"id":"term-rt-marketplace","term":"Marketplace","category":"system","definition":"The Claude Code plugin-distribution manifest (`.claude-plugin/marketplace.json`) that lists this repo's own plugin so it is installable via `/plugin marketplace add bhastings-t3/event-storming-recovery` then `/plugin install event-storming-recovery@event-storming-recovery`. This repo is simultaneously the marketplace and the one plugin it hosts.","anchors":[{"path":".claude-plugin/marketplace.json","line":1}],"status":"resolved"},{"id":"term-rt-mcp-resource","term":"MCP resource","category":"concept","definition":"An @-mentionable MCP artifact the user (or Claude) can attach to a chat turn wholesale, rather than call. The Explorer exposes exactly one: `event-storming://selected-nodes`, the curated context bundle rendered as one grounded Markdown document (mimeType text/markdown).","aka":["event-storming://selected-nodes"],"relatedNodes":["rm-selected-bundle"],"anchors":[],"status":"resolved"},{"id":"term-rt-mcp-server","term":"MCP server","category":"system","aka":["the /mcp endpoint","the MCP bridge"],"definition":"The Model Context Protocol face es-view mounts at `POST /mcp`, in the SAME process as the web UI so it shares the same in-memory selection and context-bundle state. A connected Claude session is an MCP client of it (`ext-claude-mcp`); the plugin declares it in `.claude-plugin/plugin.json` so it can be one-command-connected.","relatedNodes":["agg-server-session","ext-claude-mcp"],"anchors":[],"status":"partial","openQuestion":"src/server/mcp.mjs's own header comment (line 4) calls the transport 'stateless', but createMcpHandler's JSDoc and mcp.md both call it STATEFUL, and the implementation keeps a `transports` Map keyed by Mcp-Session-Id (per-session state) — which description is authoritative, and should the stale comment be fixed? (Flagged in the model as hot-mcp-read-desc-drift's neighbor; no hotspot currently names this specific stateless/stateful self-contradiction.)"},{"id":"term-rt-mcp-tool","term":"MCP tool","category":"concept","definition":"A pull-based, always-fresh MCP call the connected Claude session invokes on demand (no subscription): `get_current_selection`, `get_node`, `get_flow`, `list_model`, `list_data_model`. Chosen deliberately over a resource for 'current selection' because a tool call always re-reads live state, per the design note in mcp.mjs.","aka":["get_current_selection","get_node","get_flow","list_model","list_data_model"],"relatedNodes":["cmd-get-current-selection","rm-model-listing","rm-grounded-node","rm-data-model"],"anchors":[],"status":"resolved"},{"id":"term-rt-merge","term":"Merge","category":"concept","aka":["es-merge","merge-flows.js","MergeTraces"],"definition":"The deterministic ETL step (`tools/merge-flows.js`, bin name `es-merge`) that folds every per-flow trace document in a traces directory into one canonical, validated `flows.json`: nodes unioned by global id (first-seen type/label wins, longest description wins, fields unioned by name), flows/hotspots/terms deduped, then checked against every structural invariant. `resolveModel`'s `--traces` tier calls the same merge logic in-process rather than shelling out to the CLI.","relatedNodes":["cmd-merge-traces","evt-model-merged","evt-model-validated"],"anchors":[{"path":"src/domain/model/merge.ts","line":65,"symbol":"mergeTraceDocs","note":"seed/union nodes, accumulate flows, validate, build model"}],"status":"resolved"},{"id":"term-rt-model-resolution","term":"Model resolution","category":"concept","aka":["the 4-tier precedence","ResolveModel"],"definition":"The single choke point (`resolveModel`) that decides which flows.json a running es-view session serves, in fixed highest-first precedence: (1) `--model \u003cflows.json>` explicit path, (2) `--traces \u003cdir>` merge-on-the-fly (full validation; throws on error), (3) auto-discovered flows.json under cwd (bounded recursive walk, warns on multiple candidates), (4) the bundled self-model example as a last-resort fallback. It also derives `repoRoot` for resolving source anchors.","relatedNodes":["cmd-resolve-model","evt-model-resolved","inv-model-shape"],"anchors":[],"status":"partial","openQuestion":"Only the --traces tier runs full merge-invariant validation (inv-model-shape is the only guard on tiers 1/3/4); a structurally-shaped but semantically-invalid flows.json (dangling refs, an aggregate that issues a command) passes tiers 1/3/4 unchecked. Is that an accepted tradeoff (trust the file on the other three tiers) or a gap to close?"},{"id":"term-rt-npx-delivery","term":"npx delivery","category":"concept","definition":"Running the Explorer straight from the published npm package with no local install step: `npx event-storming-recovery view`. The package exposes four bins (`event-storming-recovery`/`es-view` → `bin/es-view.mjs`, `es-merge` → `tools/merge-flows.js`, `es-generate` → `tools/generate-views.js`). As of this glossary's writing the README flags this is not yet published to npm, so it currently works for local development via `npm link`.","anchors":[{"path":"package.json","line":1,"symbol":"bin","note":"four bins: event-storming-recovery/es-view, es-merge, es-generate"}],"status":"partial","openQuestion":"README states the npx flow needs the event-storming-recovery npm package published, tracked as an open repo issue. Has it since been published, and is npx delivery now the default install path rather than npm link?"},{"id":"term-rt-orchestrator","term":"Orchestrator","category":"role","definition":"The top-level driver of the recovery workflow (`prompts/00-orchestrator.md`). It never reads the target codebase itself — it dispatches scouts, trace agents, and glossary miners, persists every sub-agent's return to disk immediately, and makes the human-facing judgment calls (triage, coverage tiers). Its context stays clean specifically because file-reading happens inside sub-agents, not in its own turn.","anchors":[{"path":"prompts/00-orchestrator.md","line":1,"symbol":null,"note":"# Orchestrator playbook"},{"path":"prompts/00-orchestrator.md","line":3,"symbol":null,"note":"\"You are the orchestrator. You do not read the whole codebase yourself\""}],"status":"resolved"},{"id":"term-rt-plugin","term":"Plugin","category":"system","definition":"The Claude Code plugin form of this repo (`.claude-plugin/plugin.json`): installing it bundles both skills (`event-storming-recovery`, `event-storming-explorer`), the MCP server declaration (so the Explorer's `/mcp` endpoint auto-connects once running), and the bundled prompts/tools — so a user never runs the raw CLI commands by hand.","anchors":[{"path":".claude-plugin/plugin.json","line":1}],"status":"resolved"},{"id":"term-es-policy","term":"Policy","category":"concept","aka":["pol-*","process","re
