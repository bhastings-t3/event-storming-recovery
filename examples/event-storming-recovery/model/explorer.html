<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Storming Recovery — self-model</title>
<style>
  /* shadcn-style neutral-dark token system (vanilla CSS, no framework) */
  :root {
    --bg: #0a0a0d; --panel: #131317; --card: #17171c; --input: #1a1a21;
    --fg: #f4f4f5; --muted: #9a9aa6; --dim: #d1d1d8;
    --line: #26262d; --accent: #1e1e26; --accent-2: #26262f; --ring: #6b6b7a;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  /* sidebar */
  #sidebar { width: 300px; min-width: 300px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #sidebar header { padding: 16px 18px 13px; border-bottom: 1px solid var(--line); }
  #sidebar h1 { font-size: 14px; font-weight: 650; margin: 0 0 3px; letter-spacing: -.01em; }
  #sidebar .sub { font-size: 11px; color: var(--muted); line-height: 1.4; }
  #search {
    margin: 12px; padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--radius);
    font: inherit; font-size: 13px; width: calc(100% - 24px); background: var(--input); color: var(--fg); outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--ring); box-shadow: 0 0 0 3px rgba(120,120,140,.16); }
  /* group-by switch: pivot the flow list by tier / actor / aggregate */
  #groupby { display: flex; align-items: center; gap: 5px; margin: 0 12px 6px; flex-wrap: wrap; }
  #groupby .gb-cap { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-right: 1px; }
  .gb { font: inherit; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--input); color: var(--muted); cursor: pointer; transition: background .1s, color .1s, border-color .1s; }
  .gb:hover { color: var(--dim); background: var(--accent); }
  .gb.active { background: var(--accent-2); color: #fff; border-color: var(--ring); }
  #flowlist { overflow-y: auto; flex: 1; padding: 4px 8px 16px; }
  .flow-group { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 15px 8px 6px; font-weight: 600; display: flex; align-items: center; }
  .flow-group .fg-dot { width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; flex-shrink: 0; }
  .flow-item { position: relative; padding: 9px 10px 9px 17px; border-radius: var(--radius); cursor: pointer; display: flex; gap: 8px; align-items: center; transition: background .1s; }
  .flow-item::before { content: ''; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--kind, #3f3f46); }
  .flow-item:hover { background: var(--accent); }
  .flow-item.active { background: var(--accent-2); }
  .flow-item.dim { opacity: .5; }
  .flow-item.dim:hover { opacity: .75; }
  .flow-item .nm { flex: 1; min-width: 0; font-size: 12.5px; color: var(--dim); line-height: 1.32; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .flow-item.active .nm { color: #fff; font-weight: 600; }
  .fi-tags { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .status-dot { width: 7px; height: 7px; border-radius: 99px; }
  .status-dot.dead { background: #e5645e; }
  .status-dot.superseded { background: #d2a63a; }
  .hs-count { font-size: 10px; font-weight: 700; color: #e18d88; background: rgba(229,100,94,.14); border-radius: 99px; padding: 1px 6px; min-width: 17px; text-align: center; }
  .badge { font-size: 9px; padding: 2px 7px; border-radius: 99px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; text-transform: uppercase; }
  .badge.dead { background: #3a1414; color: #fca5a5; }
  .badge.superseded { background: #382b10; color: #fcd34d; }
  .badge.read { background: rgba(95,208,138,.15); color: #74dc9b; }
  .badge.write { background: rgba(91,157,240,.15); color: #93c5fd; }
  .badge.policy { background: rgba(187,143,234,.16); color: #d0aef5; }
  .badge.hs { background: rgba(239,78,78,.18); color: #fca5a5; }
  /* main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #flowheader { padding: 18px 24px 15px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #flowheader h2 { margin: 0 0 6px; font-size: 18px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  #flowheader .summary { color: var(--muted); font-size: 12.5px; max-width: 900px; line-height: 1.55; }
  #flowheader .trigger { font-size: 12px; margin-top: 9px; color: var(--dim); }
  #flowheader .trigger b { color: var(--muted); font-weight: 600; }
  /* the board: a subtle dot-grid backdrop for the sticky lane */
  #lane-wrap {
    flex: 1; min-height: 250px; overflow: hidden; padding: 0; position: relative; cursor: grab;
    background-image: radial-gradient(circle, #1b1b22 1px, transparent 1.4px);
    background-size: 22px 22px; background-position: -1px -1px;
  }
  #lane-wrap.grabbing { cursor: grabbing; }
  #lane { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  .zoomctl { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 20; }
  .zoomctl button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 16px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); user-select: none; }
  .zoomctl button:hover { background: var(--line); }
  svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .sticky {
    position: absolute; width: 176px; min-height: 92px; border-radius: var(--radius); padding: 11px 13px; cursor: pointer;
    border: 1px solid rgba(0,0,0,.28); box-shadow: var(--shadow); transition: transform .1s, box-shadow .1s; z-index: 1;
  }
  .sticky:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.55); z-index: 3; }
  .sticky.selected { outline: 2px solid var(--fg); outline-offset: 2px; z-index: 3; }
  .sticky .ntype { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-bottom: 5px; overflow-wrap: anywhere; }
  .sticky .nlabel { font-size: 12.5px; font-weight: 650; line-height: 1.32; overflow-wrap: anywhere; }
  .sticky .flags { position: absolute; bottom: 7px; right: 10px; font-size: 9px; opacity: .72; font-weight: 600; }
  /* corner dot marking a node that appears more than once (same color = same node) */
  .dupdot { position: absolute; top: 7px; right: 8px; width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.5); cursor: pointer; transition: transform .1s; z-index: 4; }
  .dupdot:hover { transform: scale(1.4); }
  .inv .dupdot { top: 5px; right: 6px; width: 8px; height: 8px; }
  /* hover-focus: dim everything except the hovered node's neighborhood + its duplicates */
  .sticky, .inv, .edge-verb { transition: opacity .13s; }
  svg.edges path { transition: opacity .13s; }
  .focusing .sticky.lo, .focusing .inv.lo { opacity: .12; }
  .focusing .edge-verb.lo { opacity: .06; }
  .focusing svg.edges path.lo { opacity: .08; }
  .inv { position: absolute; width: 150px; border-radius: 7px; padding: 7px 10px; font-size: 10.5px; cursor: pointer; line-height: 1.35; transition: transform .1s; overflow-wrap: anywhere; z-index: 1; }
  .inv:hover { transform: translateY(-2px); z-index: 3; }
  .edge-verb { position: absolute; font-size: 9px; color: var(--muted); background: var(--bg); padding: 0 4px; border-radius: 3px; pointer-events: none; letter-spacing: .02em; white-space: nowrap; z-index: 2; transform: translate(-50%, -50%); }
  /* findings band: distinct panel surface below the dark board, scrolls if tall */
  #findings { background: var(--panel); border-top: 1px solid var(--line); flex-shrink: 0; max-height: 30vh; overflow-y: auto; }
  #hotspots { padding: 14px 24px 18px; }
  #hotspots h3, #instances h3 { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; margin: 0 0 11px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  #hotspots h3 { color: #e5645e; }
  #hotspots h3 .n, #instances h3 .n { font-size: 10px; background: var(--accent-2); color: var(--dim); border-radius: 99px; padding: 1px 7px; font-weight: 700; letter-spacing: 0; }
  .hs-cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .hs-card {
    background: rgba(229,100,94,.07); border: 1px solid rgba(229,100,94,.28); border-radius: var(--radius);
    padding: 11px 14px; width: 320px; cursor: pointer; transition: background .12s, border-color .12s, transform .1s;
  }
  .hs-card:hover { background: rgba(229,100,94,.13); border-color: rgba(229,100,94,.5); transform: translateY(-2px); }
  .hs-card b { display: block; font-size: 12px; margin-bottom: 4px; color: #eda3a0; line-height: 1.35; overflow-wrap: anywhere; }
  .hs-card span { font-size: 11px; color: #b98e8c; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; overflow-wrap: anywhere; }
  #instances { padding: 4px 24px 22px; font-size: 12px; }
  #instances h3 { color: var(--muted); }
  #instances table { border-collapse: collapse; width: 100%; }
  #instances tr { border-bottom: 1px solid rgba(255,255,255,.04); }
  #instances td { padding: 5px 16px 5px 0; vertical-align: top; }
  #instances .i-label { color: var(--dim); font-weight: 500; }
  #instances .i-route { color: var(--muted); font: 11px/1.5 ui-monospace, Consolas, monospace; }
  #instances .i-file { color: #7d7d88; font: 11px/1.5 ui-monospace, Consolas, monospace; }
  /* detail panel */
  #detail { width: 0; min-width: 0; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; transition: width .16s, min-width .16s; }
  #detail.open { width: 440px; min-width: 440px; }
  #detail .inner { padding: 20px 22px 32px; }
  #detail h3 { margin: 4px 0 3px; font-size: 16px; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
  #detail .dtype { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; display: inline-block; margin-bottom: 10px; }
  #detail .desc { font-size: 13px; margin-bottom: 14px; color: var(--dim); line-height: 1.6; }
  #detail .chips { margin-bottom: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 10px; background: var(--accent); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; color: var(--muted); font-weight: 600; }
  #detail h4 { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; font-weight: 700; }
  .usage { border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 13px; margin-bottom: 10px; background: var(--card); }
  .usage .uflow { font-size: 10px; font-weight: 700; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .usage .uexp { font-size: 12px; margin-bottom: 9px; white-space: pre-wrap; color: var(--dim); line-height: 1.55; }
  .anchor { display: block; font: 11px/1.65 ui-monospace, "Cascadia Code", Consolas, monospace; color: #7db2f5; text-decoration: none; word-break: break-all; margin-bottom: 2px; }
  .anchor:hover { text-decoration: underline; color: #a5cbf9; }
  .anchor .note { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; }
  /* "appears in" flow rows: each flow is a card whose colored count-dots preview its composition */
  .flowrow { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; background: var(--card); cursor: pointer; transition: background .12s, border-color .12s; }
  .flowrow:hover { background: var(--accent); border-color: var(--ring); }
  .flowrow .fr-name { font-size: 12.5px; font-weight: 600; color: var(--dim); line-height: 1.3; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .flowrow:hover .fr-name { color: #fff; }
  .flowrow .fr-dots { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .cdot { display: inline-flex; align-items: center; justify-content: center; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 99px; font-size: 10.5px; font-weight: 800; border: 1px solid rgba(255,255,255,.14); }
  /* aggregate <-> invariant cross-reference rows: a small colored sticky-chip + label, navigates on click */
  .relrow { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 11px; margin-bottom: 7px; background: var(--card); cursor: pointer; transition: background .12s, border-color .12s; }
  .relrow:hover { background: var(--accent); border-color: var(--ring); }
  .relrow .rdot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.35); }
  .relrow .rlabel { font-size: 12.5px; color: var(--dim); line-height: 1.35; overflow-wrap: anywhere; }
  .relrow:hover .rlabel { color: #fff; }
  #closedetail { float: right; border: 0; background: none; font-size: 15px; cursor: pointer; color: var(--muted); padding: 3px 6px; border-radius: 6px; line-height: 1; }
  #closedetail:hover { background: var(--accent); color: var(--fg); }
  #legend { padding: 12px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; }
  #legend .lg { font-size: 9px; padding: 3px 8px; border-radius: 6px; font-weight: 700; letter-spacing: .02em; }
  /* scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2c2c34; border-radius: 6px; border: 2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a45; }
  /* top tab bar: Flows board vs. Gallery of every sticky */
  #tabbar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .tab { font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 15px; border-radius: 7px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; transition: background .1s, color .1s; }
  .tab:hover { background: var(--accent); color: var(--dim); }
  .tab.active { background: var(--accent-2); color: #fff; border-color: var(--line); }
  #shell { flex: 1; min-height: 0; display: flex; }
  /* gallery: a wall of every sticky in the model, filtered by type chips + search */
  #gallery { flex: 1; min-width: 0; display: none; flex-direction: column; }
  #gallery.show { display: flex; }
  .gallery-head { padding: 16px 24px 13px; border-bottom: 1px solid var(--line); background: var(--panel); flex-shrink: 0; }
  .gallery-head h2 { margin: 0 0 11px; font-size: 18px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .gallery-head h2 .count { font-size: 11px; font-weight: 700; background: var(--accent-2); color: var(--dim); border-radius: 99px; padding: 2px 9px; letter-spacing: 0; }
  .gallery-search { padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; font-size: 13px; width: 100%; max-width: 420px; background: var(--input); color: var(--fg); outline: none; transition: border-color .12s, box-shadow .12s; }
  .gallery-search::placeholder { color: var(--muted); }
  .gallery-search:focus { border-color: var(--ring); box-shadow: 0 0 0 3px rgba(120,120,140,.16); }
  .type-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .tchip { font-size: 10px; font-weight: 700; letter-spacing: .03em; padding: 4px 11px; border-radius: 99px; cursor: pointer; border: 1px solid transparent; user-select: none; text-transform: uppercase; opacity: .38; transition: opacity .1s, box-shadow .1s; }
  .tchip:hover { opacity: .75; }
  .tchip.on { opacity: 1; }
  .tchip-all { background: var(--accent-2); color: var(--dim); border-color: var(--line); }
  .gallery-grid { flex: 1; overflow-y: auto; padding: 18px 24px 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; align-content: start; }
  .gcard { border-radius: var(--radius); padding: 12px 14px; cursor: pointer; border: 1px solid rgba(0,0,0,.28); box-shadow: var(--shadow); position: relative; min-height: 104px; display: flex; flex-direction: column; transition: transform .1s, box-shadow .1s; }
  .gcard:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.55); }
  .gcard.selected { outline: 2px solid var(--fg); outline-offset: 2px; }
  .gcard .gtype { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-bottom: 5px; }
  .gcard .glabel { font-size: 13px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
  .gcard .gdesc { font-size: 11px; line-height: 1.45; margin-top: 6px; opacity: .82; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .gcard .gmeta { margin-top: auto; padding-top: 9px; font-size: 10px; font-weight: 600; opacity: .72; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .gcard .gdead { background: rgba(0,0,0,.2); border-radius: 99px; padding: 1px 8px; text-transform: uppercase; letter-spacing: .04em; }
  .gempty { grid-column: 1 / -1; color: var(--muted); font-size: 13px; padding: 22px 2px; }
  /* overview: the whole model at once — every flow rendered inside its own bounded-context box */
  #overview { flex: 1; min-width: 0; display: none; flex-direction: column; }
  #overview.show { display: flex; }
  /* Glossary: the ubiquitous language as a readable, alphabetical dictionary */
  #glossary { flex: 1; min-width: 0; display: none; flex-direction: column; }
  #glossary.show { display: flex; }
  .gl-head { padding: 16px 24px 13px; border-bottom: 1px solid var(--line); background: var(--panel); flex-shrink: 0; }
  .gl-head h2 { margin: 0 0 11px; font-size: 18px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .gl-head h2 .count { font-size: 11px; font-weight: 700; background: var(--accent-2); color: var(--dim); border-radius: 99px; padding: 2px 9px; letter-spacing: 0; }
  .gl-search { width: 100%; max-width: 520px; padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; font-size: 13px; background: var(--input); color: var(--fg); outline: none; margin-bottom: 11px; }
  .gl-search::placeholder { color: var(--muted); }
  .gl-search:focus { border-color: var(--ring); box-shadow: 0 0 0 3px rgba(120,120,140,.16); }
  .gl-body { flex: 1; display: flex; min-height: 0; }
  .gl-list { flex: 1; overflow-y: auto; padding: 4px 20px 44px 24px; }
  .gl-rail { flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 8px 9px; border-left: 1px solid var(--line); background: var(--panel); }
  .gl-rail span { font-size: 10px; font-weight: 700; color: var(--muted); cursor: pointer; padding: 1px 5px; border-radius: 4px; text-align: center; }
  .gl-rail span:hover { background: var(--accent-2); color: #fff; }
  .gl-letter { font-size: 20px; font-weight: 750; color: var(--fg); padding: 20px 0 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; letter-spacing: -.02em; position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .gl-entry { padding: 12px 8px 14px 12px; border-bottom: 1px solid var(--accent); border-left: 2px solid transparent; transition: background .08s; }
  .gl-entry:hover { background: var(--accent); }
  .gl-entry.flagged { border-left-color: rgba(229,100,94,.55); background: rgba(229,100,94,.04); }
  .gl-entry.flagged:hover { background: rgba(229,100,94,.09); }
  .gl-term { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .gl-badge { font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; flex-shrink: 0; }
  .gl-name { font-size: 15px; font-weight: 650; color: var(--fg); overflow-wrap: anywhere; }
  .gl-flag { font-size: 9px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: rgba(229,100,94,.16); color: #eda3a0; border: 1px solid rgba(229,100,94,.4); }
  .gl-aka { font-size: 11px; font-style: italic; color: var(--muted); }
  .gl-flows { font-size: 10.5px; font-weight: 600; color: var(--muted); }
  .gl-def { font-size: 12.5px; line-height: 1.5; color: var(--dim); margin-top: 6px; overflow-wrap: anywhere; }
  .gl-oq { font-size: 12px; line-height: 1.5; color: #b98e8c; margin-top: 7px; padding: 7px 11px; background: rgba(229,100,94,.07); border: 1px solid rgba(229,100,94,.25); border-radius: var(--radius); overflow-wrap: anywhere; }
  .gl-oq b { color: #eda3a0; }
  .gl-used { margin-top: 9px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .gl-nchip { font-size: 10px; font-weight: 600; color: var(--dim); background: var(--accent-2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; cursor: pointer; }
  .gl-nchip:hover { color: #fff; }
  .gl-fchip { font-size: 10px; font-weight: 600; color: var(--muted); background: var(--accent-2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; cursor: pointer; }

ler"}]},"usages":[{"flow":"explore-and-select","explanation":"The SPA store's openDetail(id) sets React selection state AND calls pushSelection(id) (api.js) -- a fire-and-forget POST /api/selection { nodeId } whose response is ignored (.catch(() => null)). The server route validates the id against the model, then calls state.setSelection(nodeId). This is ONE command with MANY triggers: every surface that funnels through openDetail fires it -- the Flows board (Board.jsx onOpenDetail), the Overview map (Overview.jsx onOpenDetail), the Gallery cards (Gallery.jsx onClick), the Glossary entries (Glossary.jsx onClick), the Data-model tab (DataModel.jsx table/column/consumer/server/database rows), the Detail panel's own navigation rows (Detail.jsx breadcrumb, related, field-column and storage links), and the context-bundle rows (ContextBundle.jsx open). The click-to-server mirror is the same for all of them.","anchors":[{"path":"src/web/store.jsx","line":40,"symbol":"openDetail","note":"sets React selection + calls pushSelection(id)"},{"path":"src/web/store.jsx","line":43,"symbol":"openDetail","note":"pushSelection(id) mirrors the click to the server"},{"path":"src/web/api.js","line":17,"symbol":"pushSelection","note":"POST /api/selection { nodeId }, response ignored"},{"path":"src/server/server.mjs","line":128,"symbol":"createServer","note":"POST /api/selection route handler"}]}]},{"id":"evt-node-selected","type":"event","label":"NodeSelected","inferred":true,"description":"The human has selected a (model-valid) node; the shared in-memory selection now points at it, stamped with the time of the click. This is the push half of the bridge: recorded the instant the human clicks, with no subscription opened.","tactical":{"explanation":"Realized when the POST /api/selection route calls state.setSelection(nodeId), replacing the in-memory selection with { nodeId, at: Date.now() } (state.mjs:17). Nothing is pushed to Claude here -- the fact simply becomes readable in shared memor tion":"Fetch the REAL code behind an anchor so the viewer can ground a command/aggregate/event/etc. sticky in the actual implementation. Given an anchor's { path, line }, return a small windowed excerpt (line +/- 8) read from the target repo, sandboxed to the repo root.","tactical":{"explanation":"Read flow, no state change. Click path: the Anchor component's `view source` button toggles a lazy expander (Detail.jsx:100-104 toggle) that calls fetchSource(a.path, a.line) (src/web/api.js:35). fetchSource builds `GET /api/source?path&line&ctx` (api.js:37). The route handler (server.mjs:165) parses path/line/ctx, 400s if no path, else calls readSource(resolved.repoRoot, relPath, line, ctx) (src/server/source.mjs:13) and returns the result verbatim as JSON. readSource resolves abs = path.resolve(root, relPath), then reads the file and slices lines [ln-ctx .. ln+ctx] (ctx defaults to 8). SANDBOX GUARD (source.mjs:18): `if (abs !== root && !abs.startsWith(root + path.sep)) return { exists:false, error:'path escapes repo root' }` -- this prefix check is the ONLY thing stopping a caller from reading arbitrary files via ../ escapes; path.resolve normalizes ../ so plain traversal and absolute paths are caught. Note the guard uses path.resolve, not fs.realpath, so a symlink that lives inside repoRoot but points outside it would pass the check and be read (see notes). repoRoot is resolved once at boot by resolve-model.mjs (explicit --repo-root > model.meta.repoRoot > the model file's own tree > cwd) and frozen into `resolved`. There is NO authentication on this endpoint (or any /api route).","anchors":[{"path":"src/web/components/Detail.jsx","line":103,"symbol":"Anchor/toggle","note":"view source button -> fetchSource(a.path, a.line)"},{"path":"src/web/api.js","line":35,"symbol":"fetchSource","note":"builds GET /api/source?path&line&ctx"},{"path":"src/server/server.mjs","line":165,"symbol":"createServer","note":"GET /api/source route -> readSource(resolved.repoRoot, ...)"},{"path":"src/server/source.mjs","line":13,"symbol":"readSource","note":"resolve abs, sandbox-check, read file, slice +/-ctx window"}]},"usages":[{"flow":"view-source","explanation":"Read flow, no state change. Click path: the Anchor component's `view source` button toggles a lazy expander (Detail.jsx:100-104 toggle) that calls fetchSource(a.path, a.line) (src/web/api.js:35). fetchSource builds `GET /api/source?path&line&ctx` (api.js:37). The route handler (server.mjs:165) parses path/line/ctx, 400s if no path, else calls readSource(resolved.repoRoot, relPath, line, ctx) (src/server/source.mjs:13) and returns the result verbatim as JSON. readSource resolves abs = path.resolve(root, relPath), then reads the file and slices lines [ln-ctx .. ln+ctx] (ctx defaults to 8). SANDBOX GUARD (source.mjs:18): `if (abs !== root && !abs.startsWith(root + path.sep)) return { exists:false, error:'path escapes repo root' }` -- this prefix check is the ONLY thing stopping a caller from reading arbitrary files via ../ escapes; path.resolve normalizes ../ so plain traversal and absolute paths are caught. Note the guard uses path.resolve, not fs.realpath, so a symlink that lives inside repoRoot but points outside it would pass the check and be read (see notes). repoRoot is resolved once at boot by resolve-model.mjs (explicit --repo-root > model.meta.repoRoot > the model file's own tree > cwd) and frozen into `resolved`. There is NO authentication on this endpoint (or any /api route).","anchors":[{"path":"src/web/components/Detail.jsx","line":103,"symbol":"Anchor/toggle","note":"view source button -> fetchSource(a.path, a.line)"},{"path":"src/web/api.js","line":35,"symbol":"fetchSource","note":"builds GET /api/source?path&line&ctx"},{"path":"src/server/server.mjs","line":165,"symbol":"createServer","note":"GET /api/source route -> readSource(resolved.repoRoot, ...)"},{"path":"src/server/source.mjs","line":13,"symbol":"readSource","note":"resolve abs, sandbox-check, read file, slice +/-ctx window"}]}]}],"flows":[{"id":"browser-load-model","name":"Viewer opens the explorer and the SPA loads the whole model once","tier":1,"kind":"read","status":"live","summary":"The viewer opens the es-view explorer in a browser. On mount the SPA fetches GET /api/model exactly once and the server returns the entire resolved model plus provenance meta from the snapshot it captured at startup -- minimal server work, one endpoint, no per-view queries. The SPA holds that single payload in one React context and re-derives every tab client-side (Flows board, Gallery, Data model, Glossary, Overview) via selectors shared with the server. The point is that the server is a thin model transport and the explorer's richness is all client-side derivation over ONE response.","trigger":"The viewer opens the es-view URL in a browser; the React App mounts and its boot useEffect fires.","steps":["actor-viewer","cmd-load-model","agg-model","rm-model-index","rm-flow-board","rm-data-model","rm-glossary","rm-gallery"],"edges":[{"from":"actor-viewer","to":"cmd-load-model","verb":"issues"},{"from":"cmd-load-model","to":"agg-model","verb":"reads"},{"from":"cmd-load-model","to":"rm-model-index","verb":"returns"},{"from":"rm-flow-board","to":"agg-model","verb":"projects from"},{"from":"rm-data-model","to":"agg-model","verb":"projects from"},{"from":"rm-glossary","to":"agg-model","verb":"projects from"},{"from":"rm-gallery","to":"agg-model","verb":"projects from"},{"from":"rm-flow-board","to":"ds-tbl-flows-json","verb":"projects from"},{"from":"rm-gallery","to":"ds-tbl-flows-json","verb":"projects from"},{"from":"rm-glossary","to":"ds-tbl-flows-json","verb":"projects from"},{"from":"actor-viewer","to":"rm-flow-board","verb":"reads"},{"from":"actor-viewer","to":"rm-data-model","verb":"reads"},{"from":"actor-viewer","to":"rm-glossary","verb":"reads"},{"from":"actor-viewer","to":"rm-gallery","verb":"reads"}],"hotspots":["hot-model-loaded-once"],"instances":[]},{"id":"build-example-demo","name":"Operator rebuilds the bundled toy-shop example (npm run demo)","tier":2,"kind":"write","status":"live","summary":"A thin orchestration wrapper. The operator runs `npm run demo`, which executes scripts/build-example.mjs. The script makes two synchronous execFileSync('node', ...) calls in order: first it invokes the merge CLI (merge-flows.js) over examples/toy-shop/traces to (re)write flows.json, then it invokes the view generator (generate-views.js) over that flows.json to (re)write flows.dot and explorer.html into examples/toy-shop/model. Because the calls are blocking and inherit exit status, a merge validation failure (exit 1) aborts before regeneration. The point is a one-command way to keep the shipped example -- which doubles as es-view's bundled fallback model -- in sync with its trace set.","trigger":"Operator runs `npm run demo` (i.e. `node scripts/build-example.mjs`).","steps":["actor-operator","cmd-build-example","cmd-merge-traces","agg-model","cmd-generate-views","rm-flows-dot","rm-explorer","ext-source-fs"],"edges":[{"from":"actor-operator","to":"cmd-build-example","verb":"issues"},{"from":"cmd-build-example","to":"cmd-merge-traces","verb":"invokes","synchronous":true},{"from":"cmd-merge-traces","to":"agg-model","verb":"handled by"},{"from":"agg-model","to":"ext-source-fs","verb":"persists to"},{"from":"cmd-build-example","to":"cmd-generate-views","verb":"invokes","synchronous":true},{"from":"cmd-generate-views","to":"agg-model","verb":"reads"},{"from":"cmd-generate-views","to":"rm-flows-dot","verb":"writes"},{"from":"cmd-generate-views","to":"rm-explorer","verb":"writes"},{"from":"rm-flows-dot","to":"ext-source-fs","verb":"persists to"},{"from":"rm-explorer","to":"ext-source-fs","verb":"persists to"}],"hotspots":["hot-example-overwrite-in-place"],"instances":[]},{"id":"claude-mcp-read","name":"A connected Claude session reads the live model/selection/bundle over MCP","tier":1,"kind":"read","status":"live","summary":"A Claude session that has registered the es-view MCP server reads the live domain model to ground a refactor. Over the streamable-HTTP /mcp transport it calls tools (get_current_selection, get_node, get_flow, list_model, list_data_model) and reads the event-storming://selected-nodes resource. Each projection is served from the SAME in-memory state the human drives in the SPA: the selection/bundle (agg-selection) and the merged model (agg-model). The grounded projections pull REAL source excerpts from the filesystem behind each anchor, so Claude sees actual code, not just labels. Nothing is written: this is a pure read that lets Claude act on 'the selected node' or 'the gathered context'.","trigger":"A connected Claude session (registered via `claude mcp add` and initialized over /mcp) calls an MCP tool (get_current_selection / get_node / get_flow / list_model / list_data_model) or reads the `event-storming://selected-nodes` resource.","steps":["actor-claude","ext-claude-mcp-client","rm-current-selection","rm-node-context","rm-flow-context","rm-model-index","rm-data-model","rm-context-bundle","agg-selection","agg-model","ext-source-fs"],"edges":[{"from":"actor-claude","to":"ext-claude-mcp-client","verb":"calls"},{"from":"ext-claude-mcp-client","to":"rm-current-selection","verb":"reads"},{"from":"ext-claude-mcp-client","to":"rm-node-context","verb":"reads"},{"from":"ext-claude-mcp-client","to":"rm-flow-context","verb":"reads"},{"from":"ext-claude-mcp-client","to":"rm-model-index","verb":"reads"},{"from":"ext-claude-mcp-client","to":"rm-data-model","verb":"reads"},{"from":"ext-claude-mcp-client","to":"rm-context-bundle","verb":"reads"},{"from":"rm-current-selection","to":"agg-selection","verb":"projects from"},{"from":"rm-current-selection","to":"agg-model","verb":"projects from"},{"from":"rm-current-selection","to":"ext-source-fs","verb":"projects from"},{"from":"rm-node-context","to":"agg-model","verb":"projects from"},{"from":"rm-node-context","to":"ext-source-fs","verb":"projects from"},{"from":"rm-flow-context","to":"agg-model","verb":"projects from"},{"from":"rm-flow-context","to":"ext-source-fs","verb":"projects from"},{"from":"rm-model-index","to":"agg-model","verb":"projects from"},{"from":"rm-data-model","to":"agg-model","verb":"projects from"},{"from":"rm-context-bundle","to":"agg-selection","verb":"projects from"},{"from":"rm-context-bundle","to":"agg-model","verb":"projects from"},{"from":"rm-context-bundle","to":"ext-source-fs","verb":"projects from"},{"from":"rm-current-selection","to":"ds-tbl-flows-json","verb":"projects from"},{"from":"rm-node-context","to":"ds-tbl-flows-json","verb":"projects from"},{"from":"rm-flow-context","to":"ds-tbl-flows-json","verb":"projects from"},{"from":"rm-data-model","to":"ds-tbl-flows-json","verb":"projects from"}],"hotspots":["hot-selection-never-cleared","hot-mcp-name-mismatch"],"instances":[]},{"id":"curate-context-bundle","name":"Viewer curates a context bundle for a connected Claude session","tier":1,"kind":"write","status":"live","summary":"In the explorer SPA the human gathers a set of nodes, whole flows, and hotspots into a 'context bundle' by clicking 'Add to context' or right-clicking items. Each add is validated (the item must exist for its type) and stored in an insertion-ordered set in the server's in-memory state, the same object the MCP bridge reads. The bundle is projected on demand to one grounded markdown document (descriptions, invariants, flows, real source, Mermaid graphs) and handed to Claude two ways: as the @-mentionable MCP resource event-storming://selected-nodes, and as the SPA's 'Copy all' clipboard export. The point is to let the human assemble exactly the slice of the model a refactor conversation needs, grounded in actual files.","trigger":"The viewer clicks '+ Add to context' on a node/flow, or right-clicks a node/flow/hotspot and picks 'Add to context bundle', in the explorer SPA.","steps":["actor-viewer","cmd-add-to-bundle","agg-selection","evt-bundle-item-added","rm-context-bundle","actor-claude"],"edges":[{"from":"actor-viewer","to":"cmd-add-to-bundle","verb":"issues"},{"from":"actor-viewer","to":"cmd-remove-from-bundle","verb":"issues"},{"from":"actor-viewer","to":"cmd-clear-bundle","verb":"issues"},{"from":"cmd-add-to-bundle","to":"agg-selection","verb":"handled by"},{"from":"cmd-remove-from-bundle","to":"agg-selection","verb":"handled by"},{"from":"cmd-clear-bundle","to":"agg-selection","verb":"handled by"},{"from":"agg-selection","to":"inv-bundle-item-exists","verb":"enforces"},{"from":"agg-selection","to":"evt-bundle-item-added","verb":"emits"},{"from":"agg-selection","to":"evt-bundle-item-removed","verb":"emits"},{"from":"agg-selection","to":"evt-bundle-cleared","verb":"emits"},{"from":"rm-context-bundle","to":"agg-selection","verb":"projects from"},{"from":"rm-context-bundle","to":"agg-model","verb":"reads"},{"from":"rm-context-bundle","to":"ext-source-fs","verb":"reads"},{"from":"actor-claude","to":"rm-context-bundle","verb":"reads"},{"from":"actor-viewer","to":"rm-context-bundle","verb":"reads"}],"hotspots":["hot-bundle-single-global-state"],"instances":[]},{"id":"es-view-boot","name":"Operator boots the es-view explorer server","tier":1,"kind":"read","status":"live","summary":"The operator runs `npx event-storming-recovery` / `es-view` (or `npm run preview`). es-view parses its args, resolves a servable model (explicit --model, an on-the-fly --traces merge, an auto-discovered flows.json, or the bundled toy-shop example), builds an eager read-only index over it, and initializes an empty in-memory selection/bundle state. It then stands up ONE local node:http server -- SPA + JSON API + MCP endpoint over that shared state -- binding the first free port at/after 5178, prints the connect banner (including the exact `claude mcp add` line), and opens the browser. The result is a live session a human can explore and a Claude terminal can attach to.","trigger":"Operator runs `npx event-storming-recovery [view] [options]`, `es-view`, or `npm run preview` (which builds then runs `node bin/es-view.mjs`).","steps":["actor-operator","cmd-launch-es-view","agg-es-view-session","agg-model","evt-model-resolved","agg-selection","evt-server-started","ext-browser"],"edges":[{"from":"actor-operator","to":"cmd-launch-es-view","verb":"issues"},{"from":"cmd-launch-es-view","to":"agg-es-view-session","verb":"handled by"},{"from":"agg-es-view-session","to":"agg-model","verb":"reads"},{"from":"agg-model","to":"ext-source-fs","verb":"projects from"},{"from":"agg-es-view-session","to":"inv-servable-model","verb":"enforces"},{"from":"agg-es-view-session","to":"agg-selection","verb":"initializes"},{"from":"agg-es-view-session","to":"evt-model-resolved","verb":"emits"},{"from":"agg-es-view-session","to":"evt-server-started","verb":"emits"},{"from":"agg-es-view-session","to":"ext-browser","verb":"opens"}],"hotspots":["hot-port-fall-forward-stale-mcp","hot-eager-indexes-never-invalidated","hot-host-exposure"],"instances":[]},{"id":"explore-and-select","name":"Human selects a node in the explorer; Claude reads it live","tier":1,"kind":"write","status":"live","summary":"This is the selection bridge, the heart of the tool. The human opens any node's detail in the SPA (from the flows board, overview, gallery, glossary, data-model tab, a detail-panel nav row, or a bundle row), and the store's openDetail mirrors that node to the server via POST /api/selection. The server validates the id against the merged model and stores it in a purely in-memory Selection aggregate shared same-process with the MCP server. A connected Claude session then pulls the current selection through the get_current_selection MCP tool, which grounds it (invariants, flows, and the real source behind each anchor) via context.mjs. Push-on-click by the human, pull-on-call by Claude -- no poll, no subscription.","trigger":"The human opens a node's detail anywhere in the SPA (openDetail), which posts it to /api/selection. It fires from the Flows board (Board.jsx), Overview (Overview.jsx), Gallery (Gallery.jsx), Glossary (Glossary.jsx), Data-model tab (DataModel.jsx), Detail-panel nav rows (Detail.jsx), and context-bundle rows (ContextBundle.jsx).","steps":["actor-viewer","cmd-select-node","agg-selection","evt-node-selected","rm-current-selection","actor-claude"],"edges":[{"from":"actor-viewer","to":"cmd-select-node","verb":"issues"},{"from":"cmd-select-node","to":"agg-selection","verb":"handled by"},{"from":"agg-selection","to":"inv-selection-in-model","verb":"enforces"},{"from":"agg-selection","to":"evt-node-selected","verb":"emits"},{"from":"rm-current-selection","to":"agg-selection","verb":"projects from"},{"from":"rm-current-selection","to":"agg-model","verb":"projects from"},{"from":"rm-current-selection","to":"ext-source-fs","verb":"projects from"},{"from":"actor-claude","to":"rm-current-selection","verb":"reads"}],"hotspots":["hot-selection-never-cleared"],"instances":[]},{"id":"generate-views","name":"Operator generates the DOT + explorer views from the model","tier":1,"kind":"read","status":"live","summary":"The operator runs es-generate over a merged flows.json and an output directory. The tool reads the model once and projects it into two human-facing read models without mutating any domain state: a Graphviz DOT board (one cluster per flow, physical storage nodes excluded) and a self-contained explorer.html that inlines the whole model and a dependency-free SPA. Both artifacts are written to the output directory and embed vscode:// deep links back into the analyzed checkout. The point is to turn the abstract model into something a human can open in a browser or Graphviz and click straight to source.","trigger":"Operator runs `node tools/generate-views.js \u003cflows.json> \u003coutDir> --repo-root \u003cabs> --title \"...\"` (via the `es-generate` bin, or `npm run demo` -> scripts/build-example.mjs).","steps":["actor-operator","cmd-generate-views","agg-model","rm-flows-dot","rm-explorer","evt-views-generated","ext-source-fs"],"edges":[{"from":"actor-operator","to":"cmd-generate-views","verb":"issues"},{"from":"cmd-generate-views","to":"agg-model","verb":"reads"},{"from":"cmd-generate-views","to":"rm-flows-dot","verb":"writes"},{"from":"cmd-generate-views","to":"rm-explorer","verb":"writes"},{"from":"cmd-generate-views","to":"evt-views-generated","verb":"emits"},{"from":"rm-flows-dot","to":"ext-source-fs","verb":"persists to"},{"from":"rm-explorer","to":"ext-source-fs","verb":"persists to"},{"from":"rm-flows-dot","to":"ext-editor","verb":"links to"},{"from":"rm-explorer","to":"ext-editor","verb":"links to"},{"from":"rm-flows-dot","to":"ds-tbl-flows-json","verb":"projects from"},{"from":"rm-explorer","to":"ds-tbl-flows-json","verb":"projects from"},{"from":"cmd-generate-views","to":"ds-tbl-flows-dot","verb":"writes"},{"from":"cmd-generate-views","to":"ds-tbl-explorer-html","verb":"writes"}],"hotspots":["hot-frozen-explorer-snapshot","hot-unresolved-repo-root-links"],"instances":[]},{"id":"grounded-copy","name":"Viewer copies grounded markdown to the clipboard for Claude","tier":2,"kind":"read","status":"live","summary":"From several places in the explorer (a node detail panel, a flow header, a right-click menu, or the context-bundle drawer) the viewer hits a 'Copy for Claude' button. The SPA calls GET /api/item (or GET /api/context for the whole bundle), the server reads the in-memory model and slices the real source behind each anchor from disk, and returns grounded markdown, a flow item also embedding a Mermaid graph. The handler writes that markdown to the OS clipboard so the viewer can paste it straight into a Claude session. This is the manual clipboard channel, the parallel 'give it to Claude' path to the server-persisted MCP context bundle.","trigger":"Viewer clicks a 'Copy for Claude' / 'Copy all for Claude' button (detail panel, flow header, right-click context menu, or bundle drawer).","steps":["actor-viewer","cmd-copy-grounded-markdown","agg-model","ext-source-fs","rm-item-markdown"],"edges":[{"from":"actor-viewer","to":"cmd-copy-grounded-markdown","verb":"issues"},{"from":"cmd-copy-grounded-markdown","to":"agg-model","verb":"reads"},{"from":"cmd-copy-grounded-markdown","to":"ext-source-fs","verb":"reads"},{"from":"cmd-copy-grounded-markdown","to":"rm-item-markdown","verb":"returns"},{"from":"rm-item-markdown","to":"actor-viewer","verb":"read by"},{"from":"rm-item-markdown","to":"ds-tbl-flows-json","verb":"projects from"}],"hotspots":[],"instances":[{"label":"Detail panel: '⧉ Copy for Claude' (single node)","route":"Node detail → Copy for Claude → GET /api/item?type=node","file":"src/web/components/Detail.jsx"},{"label":"Flow header: '⧉ Copy flow for Claude' (whole flow incl. Mermaid graph)","route":"Flow header → Copy flow for Claude → GET /api/item?type=flow","file":"src/web/components/Main.jsx"},{"label":"Right-click context menu: '⧉ Copy this \u003cnode|flow|hotspot> for Claude'","route":"Right-click any item → Copy for Claude → GET /api/item?type=\u003cnode|flow|hotspot>","file":"src/web/components/ContextMenu.jsx"},{"label":"Context bundle drawer: 'Copy all for Claude' (whole bundle)","route":"Bundle drawer → Copy all for Claude → GET /api/context → renderBundleMarkdown","file":"src/web/components/ContextBundle.jsx"}]},{"id":"merge-traces","name":"Operator merges per-flow traces into the validated model","tier":1,"kind":"write","status":"live","summary":"The operator runs es-merge (or es-view --traces) over a directory of per-flow trace JSONs. The tool reads every trace, unions the shared nodes by global id and accumulates the flows, hotspots, and terms into one canonical model, then validates the whole graph against its invariants. On success it writes (or holds in memory) the validated flows.json that the server and generator consume; on any error it refuses (server) or writes-then-flags (CLI). The point is to let independent trace agents converge on one consistent, referentially closed model.","trigger":"Operator runs `node tools/merge-flows.js \u003ctracesDir> \u003coutFile>` (or `es-merge`), or es-view resolves a model from `--traces \u003cdir>`.","steps":["actor-operator","rm-trace","cmd-merge-traces","agg-model","evt-model-merged","evt-model-validated","ext-source-fs"],"edges":[{"from":"actor-operator","to":"cmd-merge-traces","verb":"issues"},{"from":"rm-trace","to":"ext-source-fs","verb":"projects from"},{"from":"cmd-merge-traces","to":"rm-trace","verb":"reads"},{"from":"cmd-merge-traces","to":"agg-model","verb":"handled by"},{"from":"agg-model","to":"inv-referential-integrity","verb":"enforces"},{"from":"agg-model","to":"inv-es-grammar","verb":"enforces"},{"from":"agg-model","to":"inv-terms-contract","verb":"enforces"},{"from":"agg-model","to":"inv-data-lineage","verb":"enforces"},{"from":"agg-model","to":"evt-model-merged","verb":"emits"},{"from":"agg-model","to":"evt-model-validated","verb":"emits"},{"from":"agg-model","to":"ext-source-fs","verb":"persists to"},{"from":"agg-model","to":"ds-tbl-flows-json","verb":"persists to"}],"hotspots":["hot-invalid-model-written"],"instances":[]},{"id":"register-mcp","name":"Viewer connects their Claude terminal from the explorer","tier":1,"kind":"write","status":"live","summary":"In the explorer's ConnectClaude panel the viewer picks a scope and clicks 'Add to Claude'. The SPA POSTs /api/mcp/register; the server resolves its own live MCP URL, whitelists the scope, and shells out `claude mcp add --transport http event-storming \"\u003curl>/mcp\" [--scope \u003cscope>]` on the host as the same OS user. On success the app is registered as an MCP server in the user's Claude config and the viewer is told to run /mcp. The point is one-click wiring of the running app into the user's Claude terminal, but the mechanism (a browser click spawning a host process that runs the user's CLI) is the single most surprising write in the app.","trigger":"Viewer clicks 'Add to Claude' in the ConnectClaude panel (scope dropdown: local/project/user).","steps":["actor-viewer","rm-mcp-connect-command","cmd-register-mcp","agg-mcp-registration","evt-mcp-registered","ext-claude-cli"],"edges":[{"from":"rm-mcp-connect-command","to":"actor-viewer","verb":"read by"},{"from":"actor-viewer","to":"cmd-register-mcp","verb":"issues"},{"from":"cmd-register-mcp","to":"agg-mcp-registration","verb":"handled by"},{"from":"cmd-register-mcp","to":"ext-claude-cli","verb":"calls"},{"from":"agg-mcp-registration","to":"inv-mcp-input-safe","verb":"enforces"},{"from":"agg-mcp-registration","to":"evt-mcp-registered","verb":"emits"}],"hotspots":["hot-ui-shells-claude-cli","hot-mcp-name-mismatch","hot-port-fall-forward-stale-mcp"],"instances":[]},{"id":"view-source","name":"Viewer grounds a sticky in the real code behind its anchor","tier":2,"kind":"read","status":"live","summary":"Every command/aggregate/event/etc. sticky in the explorer carries source anchors. When the viewer clicks an anchor's 'view source', the SPA calls GET /api/source?path&line&ctx; the server's readSource resolves the path against the frozen repo root, rejects anything escaping it, and returns a windowed excerpt (line +/- 8) read straight from the target repo's files. The excerpt renders inline beneath the anchor. A sibling grounding path skips the server entirely: the same anchor is an \u003ca href='vscode://file/...'> deep link, so the OS/editor can open the real file at that line. Both paths turn an abstract sticky into the actual code, one inline (via the filesystem through the sandboxed API) and one by jumping to the editor.","trigger":"Viewer clicks 'view source' on an anchor in a node/hotspot detail (or clicks the anchor's vscode:// link to jump to their editor).","steps":["actor-viewer","cmd-view-source","ext-source-fs","rm-source-excerpt","ext-editor"],"edges":[{"from":"actor-viewer","to":"cmd-view-source","verb":"issues"},{"from":"cmd-view-source","to":"ext-source-fs","verb":"reads"},{"from":"rm-source-excerpt","to":"ext-source-fs","verb":"projects from"},{"from":"cmd-view-source","to":"rm-source-excerpt","verb":"returns"},{"from":"actor-viewer","to":"ext-editor","verb":"calls"},{"from":"ext-editor","to":"ext-source-fs","verb":"reads"}],"hotspots":["hot-source-api-network-exposed"],"instances":[]}],"hotspots":[{"id":"hot-model-loaded-once","label":"The explorer loads the model once at boot; edits need a page reload AND a server restart","description":"The SPA fetches /api/model exactly once (App boot useEffect, empty deps) and never re-fetches -- no polling, websocket, or live-reload. The server serves the model snapshot resolved at startup and builds its indexes eagerly, so it never picks up file changes either. Result: after editing flows.json (or the traces feeding --traces), the viewer sees nothing new until the operator BOTH restarts es-view (to re-resolve + re-index) AND reloads the page (to re-fetch). Human question: is a one-shot frozen boot acceptable for the curate-while-you-work loop this tool is built for, or should es-view watch the model file and the SPA poll / offer a reload affordance?","tactical":{"explanation":"App.jsx useEffect has [] deps and an alive guard -- exactly one fetch per page load, no interval or socket. server.mjs GET /api/model returns resolved.model captured in the createServer closure; buildServices runs buildIndexes once at startup (bin/es-view.mjs main); resolveModel likewise runs once. Nothing invalidates or rebuilds either the payload or the indexes for the process lifetime.","anchors":[{"path":"src/web/App.jsx","line":42,"symbol":"App","note":"single boot fetch, [] deps, no re-fetch path"},{"path":"src/server/server.mjs","line":114,"symbol":"createServer","note":"returns the startup model snapshot verbatim"},{"path":"src/server/server.mjs","line":85,"symbol":"buildServices","note":"indexes built once, never invalidated"},{"path":"bin/es-view.mjs","line":82,"symbol":"main","note":"resolveModel + buildServices run once at startup"}]}},{"id":"hot-example-overwrite-in-place","label":"npm run demo overwrites the shipped fallback model in place with no backup or gate","description":"The demo regenerates examples/toy-shop/model/{flows.json,flows.dot,explorer.html} directly over the shipped files. That same examples/toy-shop/model/flows.json is es-view's 4th-tier bundled fallback (resolve-model.mjs:92), served whenever a user runs es-view with no model of their own. So the quality of the shipped default is only as good as the toy-shop trace set at demo time, and there is no backup, diff, or review gate before the shipped artifact is replaced. Compounding it: es-merge (hot-invalid-model-written) writes flows.json BEFORE checking validation errors, so a toy-shop trace edit that fails validation would still leave a written flows.json on disk (the chain then aborts before generate-views, so flows.dot/explorer.html would be stale relative to it) -- and if that broken flows.json is committed, es-view ships a broken default. Human question: should the demo (or the package's prepack/CI) validate and guard the regenerated toy-shop model -- e.g. fail the build on merge errors, or verify the artifacts against a golden snapshot -- before it can become the shipped fallback?","tactical":{"explanation":"scripts/build-example.mjs writes straight into examples/toy-shop/model (the packaged example dir, listed in package.json files[]). resolve-model.mjs tier 4 resolves sourcePath = packageRoot/examples/toy-shop/model/flows.json as the bundled example; bin/es-view.mjs advertises the fallback to the bundled toy-shop example when no model is found here. No test in the demo path asserts the regenerated artifacts before they overwrite the shipped ones (smoke.test.mjs merges the traces but does not gate the demo).","anchors":[{"path":"scripts/build-example.mjs","line":13,"symbol":"run","note":"writes flows.json then flows.dot/explorer.html into examples/toy-shop/model in place"},{"path":"src/server/resolve-model.mjs","line":92,"symbol":"resolveModel","note":"examples/toy-shop/model/flows.json is the bundled fallback served when no model is found"},{"path":"bin/es-view.mjs","line":66,"symbol":"help","note":"documents fall-back to the bundled toy-shop example"}]}},{"id":"hot-mcp-name-mismatch","label":"MCP server self-name 'event-storming-recovery' vs registration alias 'event-storming'","description":"The McpServer identifies itself to clients as 'event-storming-recovery', but the app registers itself into the user's Claude config under the name 'event-storming' (the name shown in the connect-UI success message and used in the `claude mcp add` command). Human question: is this two-name split intentional (a short connection alias vs the server's product name), or a bug that will confuse tool namespacing / which name the user types after /mcp? A mismatch can make the registered server hard to find or address.","tactical":{"explanation":"mcp.mjs: `new McpServer({ name: 'event-storming-recovery', version: '0.1.0' })`. server.mjs: `export const MCP_NAME = 'event-storming'`, used to build `claude mcp add --transport http event-storming \u003curl>` (GET /api/mcp/info) and passed to claudeMcpAdd on POST /api/mcp/register; ConnectClaude.jsx surfaces the same 'event-storming' name to the user. The resource uri scheme `event-storming://selected-nodes` matches the registration alias, not the server self-name.","anchors":[{"path":"src/server/mcp.mjs","line":20,"symbol":"buildMcpServer","note":"McpServer name 'event-storming-recovery'"},{"path":"src/server/server.mjs","line":24,"symbol":"MCP_NAME","note":"registration alias 'event-storming' used in claude mcp add"},{"path":"src/web/components/ConnectClaude.jsx","line":26,"symbol":"ConnectClaude","note":"success message surfaces 'event-storming' to the user"}]}},{"id":"hot-bundle-single-global-state","label":"The context bundle is one process-global set, not per-session","description":"The bundle (like the selection) lives in a single in-memory Map on the shared state object -- one bundle per es-view process, keyed by nothing but type:id. Every browser tab and every connected MCP/Claude session reads and mutates the SAME bundle. With the default 127.0.0.1 bind this is just 'one human, one run', but es-view can bind --host 0.0.0.0, at which point multiple viewers would stomp each other's bundle and a connected Claude would see a racy union of everyone's curation via the selected-nodes resource. Human question: is the bundle intended to be a single shared workspace for one run, or should it be scoped per browser session / per MCP connection before the server is ever exposed beyond localhost?","tactical":{"explanation":"state.mjs createState() holds one `bundle` Map with no session/tab/connection key; server.mjs and mcp.mjs both close over the same state instance (bin/es-view.mjs passes one state to startServer and createMcpHandler). The MCP resource handler renders renderBundleMarkdown(services, state.getBundle()) over that shared bundle. There is no per-session partitioning anywhere on the add/read path.","anchors":[{"path":"src/server/state.mjs","line":12,"symbol":"createState","note":"single bundle Map, no session key"},{"path":"bin/es-view.mjs","line":91,"symbol":"main","note":"one shared state passed to both HTTP and MCP handlers"},{"path":"src/server/mcp.mjs","line":96,"symbol":"buildMcpServer","note":"resource renders the shared bundle live"}]}},{"id":"hot-port-fall-forward-stale-mcp","label":"Port fall-forward makes the pinned MCP URL stale","description":"startServer falls forward from 5178 to 5179+ on EADDRINUSE (up to 20 attempts) and prints whatever port it landed on -- but the plugin-declared MCP server (.claude-plugin/plugin.json) and .mcp.json.example hardcode http://127.0.0.1:5178/mcp, and the explorer skill (skills/event-storming-explorer/SKILL.md) states the app 'must run on port 5178' and tells the user to free 5178 if it is taken. So if 5178 is occupied, es-view silently serves on 5179 while the pinned MCP config points at the wrong server (or nothing), and the banner's `claude mcp add ... {url}/mcp` line contradicts the pinned config. Human question: should the fall-forward be removed (fail hard when 5178 is taken, matching the pinned URL), or should the plugin/MCP registration be made port-dynamic? The two designs disagree today.","tactical":{"explanation":"server.mjs startServer/tryListen(port,20): on EADDRINUSE with attemptsLeft>0 it retries pnum+1, else rejects; runtime.baseUrl and the printed banner use the actual bound port. plugin.json and .mcp.json.example both pin :5178; SKILL.md hard-codes the 5178 assumption. The runtime is dynamic, the declared MCP endpoint is static.","anchors":[{"path":"src/server/server.mjs","line":197,"symbol":"startServer","note":"tryListen recurses pnum+1 on EADDRINUSE up to 20 attempts"},{"path":".claude-plugin/plugin.json","line":13,"symbol":"mcpServers.event-storming.url","note":"hardcoded http://127.0.0.1:5178/mcp"},{"path":"skills/event-storming-explorer/SKILL.md","line":25,"symbol":"run-requirements","note":"'the app must run on port 5178'; free 5178 if taken"}]}},{"id":"hot-eager-indexes-never-invalidated","label":"The model + indexes are frozen at boot and never invalidated","description":"buildServices/buildIndexes runs ONCE at boot over the resolved model, and the session holds that snapshot for its whole life. There is no file watcher and no invalidation, so editing flows.json or re-running es-merge has no effect until the operator restarts es-view -- even though the explorer is meant for live, iterative work with Claude. Human question: is a static boot snapshot intended (restart to refresh), or should es-view watch the model file / --traces dir and rebuild the model+indexes on change?","tactical":{"explanation":"main() calls buildServices(resolved) exactly once; the returned { model, indexes, repoRoot } is closed over by every /api and /mcp handler for the process lifetime. buildIndexes builds nodeById/hotspotById Maps eagerly. Nothing re-reads resolved.sourcePath or rebuilds the indexes after listen.","anchors":[{"path":"bin/es-view.mjs","line":90,"symbol":"main","note":"buildServices(resolved) called once at boot"},{"path":"src/server/server.mjs","line":85,"symbol":"buildServices","note":"eager { model, indexes: buildIndexes(model), repoRoot }; never rebuilt"},{"path":"src/lib/selectors.mjs","line":4,"symbol":"buildIndexes","note":"eager nodeById/hotspotById Maps over the boot-time model"}]}},{"id":"hot-host-exposure","label":"--host is an unauthenticated passthrough (0.0.0.0 exposes the API + MCP)","description":"--host is passed straight to server.listen with no authentication anywhere on the API or MCP surface. The 127.0.0.1 default is safe, but `--host 0.0.0.0` (or a LAN IP) exposes to the network the full unauthenticated JSON API -- including GET /api/source, which streams any file under repoRoot -- and the MCP endpoint that a Claude session drives, plus POST /api/mcp/register which shells out `claude mcp add`. Human question: should es-view refuse a non-loopback host (or require auth / warn loudly) before binding to 0.0.0.0? Note /api/source IS sandboxed to repoRoot with a traversal guard, so the exposure is the whole repo tree, not the arbitrary filesystem.","tactical":{"explanation":"parseArgs takes --host (default 127.0.0.1) and passes it verbatim to startServer -> server.listen(pnum, host). No route checks Origin, a token, or the bound host. readSource guards against ../ escapes (abs must stay under path.resolve(repoRoot)), bounding /api/source to the repo tree. mcp-register.mjs's claudeMcpAdd is invoked by POST /api/mcp/register with no auth.","anchors":[{"path":"bin/es-view.mjs","line":38,"symbol":"parseArgs","note":"--host parsed, default 127.0.0.1, passed through unmodified"},{"path":"src/server/server.mjs","line":202,"symbol":"startServer","note":"server.listen(pnum, host) with no auth on any /api or /mcp route"},{"path":"src/server/source.mjs","line":18,"symbol":"readSource","note":"traversal guard bounds /api/source to repoRoot (whole-repo, not whole-FS, exposure)"}]}},{"id":"hot-selection-never-cleared","label":"Closing the detail panel never clears the selection server-side, so Claude sees a stale node","description":"When the human closes the detail panel, the SPA's closeDetail clears only React state (setSelectedNodeId(null); setDetail(null)); it does NOT tell the server. The server (and therefore the MCP get_current_selection tool) keeps the LAST selected node indefinitely, so a connected Claude session will report the human is \"looking at\" a node they already dismissed. A clean path exists but is unused: DELETE /api/selection -> state.clearSelection() is wired on the server, and the SPA client even has no wrapper for it (pushSelection only ever POSTs an id). Human question: should closeDetail clear the server selection (POST/DELETE null on close), or is holding the last-viewed node the intended behavior for Claude's continuity? If holding is intended, get_current_selection arguably should signal that the panel is closed (staleness/age) rather than present the node as currently-open.","tactical":{"explanation":"store.jsx closeDetail (line 46) = `setSelectedNodeId(null); setDetail(null)` only -- no api call. There is no DELETE /api/selection caller anywhere in src/web (grep: the only /api/selection reference in api.js is pushSelection's POST). Server-side, state.clearSelection() (state.mjs:18) is wired to DELETE /api/selection (server.mjs:135) but nothing invokes it. Meanwhile get_current_selection (mcp.mjs:30) reads state.getSelection() live, so it returns the last node set until the process ends or a new node is opened. The selection's `at` timestamp is captured (state.mjs:17) but never surfaced to Claude, so there is not even an age hint to detect the staleness.","anchors":[{"path":"src/web/store.jsx","line":46,"symbol":"closeDetail","note":"clears React state only; no server call"},{"path":"src/server/server.mjs","line":135,"symbol":"createServer","note":"DELETE /api/selection -> clearSelection exists but the SPA never calls it"},{"path":"src/server/state.mjs","line":18,"symbol":"clearSelection","note":"server clear path, unreferenced by the UI"},{"path":"src/server/mcp.mjs","line":30,"symbol":"get_current_selection","note":"returns the last selection until overwritten"}]}},{"id":"hot-frozen-explorer-snapshot","label":"explorer.html embeds a frozen model snapshot that silently drifts from flows.json","description":"The generator inlines the entire model into explorer.html as `const MODEL = ...` (line 438). Unlike the es-view server, which serves the live in-memory model, the generated explorer is a self-contained static COPY: once flows.json changes (a re-merge, a later data-mapping pass), an already-open or already-shared explorer.html keeps showing stale nodes/flows/terms until someone re-runs es-generate. Nothing in the artifact records which model version or commit it was built from. Human question: should the explorer stamp the source model's version / meta.generatedFrom (or a build timestamp) and surface a 'this snapshot may be stale' signal, or is a frozen, shareable, offline snapshot the intended contract that the reader is expected to keep regenerating?","tactical":{"explanation":"modelJson = JSON.stringify(model) with `\u003c` escaped to \\u003c (94), then inlined verbatim at `const MODEL = ${modelJson}` (438). The SPA reads only from MODEL (441-442) — there is no fetch, no version banner, and no reference back to the on-disk flows.json. Contrast the es-view server, which holds the model in memory and re-resolves it. The smoke test even asserts the model is embedded and there are no external \u003cscript src=> tags, confirming the static/offline design is deliberate.","anchors":[{"path":"tools/generate-views.js","line":94,"symbol":"modelJson","note":"JSON.stringify(model), \u003c escaped for inline \u003cscript>"},{"path":"tools/generate-views.js","line":438,"symbol":"MODEL","note":"whole model frozen into the page"},{"path":"tools/generate-views.js","line":1487,"symbol":"html","note":"static explorer.html written; no live source link"}]}},{"id":"hot-unresolved-repo-root-links","label":"vscode:// deep links silently break when --repo-root is not an absolute path","description":"Every source anchor becomes `vscode://file/${repoRoot}/${a.path}:${a.line}` (line 60 for DOT, line 478 in the SPA). repoRoot defaults to model.meta.repoRoot, and if that is absent, to '.' (line 27). But the vscode://file/ scheme requires an ABSOLUTE path, so when neither --repo-root nor meta.repoRoot is set the links become `vscode://file/./src/...` and silently open nothing. A set-but-wrong repoRoot (a different machine's checkout path) fails the same way, and nothing warns at generate time. Human question: should es-generate validate that repoRoot is an absolute, existing path (and warn/refuse otherwise), given that a broken deep link is indistinguishable to the viewer from a file that simply won't open?","tactical":{"explanation":"repoRoot = argVal('--repo-root', (model.meta && model.meta.repoRoot) || '.') at line 27 — the '.' fallback is the trap. Both anchorUrl definitions (60 DOT-side, 478 SPA-side) interpolate repoRoot directly into a vscode://file/ URL with no absolute-path check or normalization. The DOT side additionally only ever links the FIRST anchor of each node (78-79), so secondary anchors are unreachable from the graph regardless of repoRoot.","anchors":[{"path":"tools/generate-views.js","line":27,"symbol":"repoRoot","note":"defaults to meta.repoRoot else '.', no absolute-path validation"},{"path":"tools/generate-views.js","line":60,"symbol":"anchorUrl","note":"DOT-side vscode:// link built from raw repoRoot"},{"path":"tools/generate-views.js","line":478,"symbol":"anchorUrl","note":"SPA-side vscode:// link built from raw REPO_ROOT"}]}},{"id":"hot-invalid-model-written","label":"es-merge writes an invalid flows.json even when validation fails","description":"The CLI writes the merged model to disk BEFORE it checks errors, then exits 1. So a validation failure still leaves an invalid flows.json on disk (a later es-view auto-discovery could pick it up), whereas the server's --traces path throws and serves nothing. Human question: should es-merge withhold the output file on validation errors (write only when clean), or is emitting the invalid artifact for debugging the intended behavior? The two callers disagree today.","tactical":{"explanation":"merge-flows.js: `if (model) fs.writeFileSync(outFile, ...)` runs at line 31, then errors are printed and `process.exit(1)` at line 37 -- the file is already written. mergeTraceDocs always returns a model object (it never nulls on validation errors; null only happens in mergeTracesDir when the dir has no files). resolve-model.mjs instead throws when merged.errors.length, so the in-memory path never exposes an invalid model.","anchors":[{"path":"tools/merge-flows.js","line":30,"symbol":"cli","note":"writes model before the error check; exits 1 after"},{"path":"src/server/resolve-model.mjs","line":76,"symbol":"resolveModel","note":"server throws and refuses to serve on any error"}]}},{"id":"hot-ui-shells-claude-cli","label":"A browser click spawns a host process running the user's claude CLI","description":"Clicking 'Add to Claude' makes the local server run `claude mcp add` on the host via a shell. The inputs are whitelisted and non-injectable, and the server already runs as the user with their PATH, so the code argues this is 'no new privilege'. Still: a web page triggering host command execution is a real trust surface (any page/script that can reach 127.0.0.1:\u003cport> could POST /api/mcp/register). Human question: is the one-click convenience worth letting the UI spawn host processes, or should this require an explicit terminal confirmation / be gated behind a token, especially if the server is ever bound beyond loopback (--host 0.0.0.0)?","tactical":{"explanation":"POST /api/mcp/register (server.mjs:178) -> claudeMcpAdd -> exec(`claude mcp add ...`) (mcp-register.mjs:17). No auth/CSRF token on the route; the only guard is scope whitelisting and the fixed command. The server binds 127.0.0.1 by default (bin/es-view.mjs:27) but --host is user-overridable, which would widen exposure of this write endpoint.","anchors":[{"path":"src/server/mcp-register.mjs","line":17,"symbol":"claudeMcpAdd","note":"exec runs the user's claude CLI on the host"},{"path":"src/server/server.mjs","line":178,"symbol":"createServer","note":"unauthenticated POST route that triggers the shell-out"},{"path":"bin/es-view.mjs","line":27,"symbol":"parseArgs","note":"default host 127.0.0.1 but --host is overridable"}]}},{"id":"hot-source-api-network-exposed","label":"Unauthenticated GET /api/source is an arbitrary-file-read primitive if bound to 0.0.0.0","description":"es-view binds to 127.0.0.1 by default, but --host accepts any address including 0.0.0.0. There is no authentication on any /api route, and GET /api/source reads an arbitrary repo-relative file and returns its contents. The ONLY thing scoping it is the path-escape prefix guard in readSource (abs must equal repoRoot or start with repoRoot + sep). Bound to 0.0.0.0, anyone on the network can read every file under repoRoot (source, .env, secrets committed in the tree, etc.). Two gaps widen it: (1) the guard uses path.resolve, not fs.realpath, so a symlink inside repoRoot pointing outside it would pass the check and leak files beyond the root; (2) repoRoot often IS the user's whole working tree (default cwd). Human question: should es-view refuse --host 0.0.0.0 (or any non-loopback bind) without an explicit opt-in / auth token, and should readSource realpath-check to defeat symlink escapes? Or is this strictly a localhost dev tool where a non-loopback bind is user-accepted risk?","tactical":{"explanation":"No auth exists on the server: createServer routes /api/* with zero credential checks (server.mjs:100-190). --host flows unmodified from parseArgs (bin/es-view.mjs:38) into startServer's server.listen(pnum, host, ...) (server.mjs:202). GET /api/source (server.mjs:165) calls readSource(resolved.repoRoot, relPath, line, ctx). The sandbox is the single guard at source.mjs:18: `if (abs !== root && !abs.startsWith(root + path.sep)) return { exists:false, error:'path escapes repo root' }`. path.resolve normalizes ../ and absolute paths (both caught), but does not resolve symlinks, so an in-root symlink to an out-of-root target is read. repoRoot defaults to cwd (resolve-model.mjs:99-102).","anchors":[{"path":"src/server/source.mjs","line":18,"symbol":"readSource","note":"the sole guard: prefix check, no realpath/symlink resolution"},{"path":"src/server/server.mjs","line":165,"symbol":"createServer","note":"GET /api/source: no auth, returns file contents"},{"path":"bin/es-view.mjs","line":38,"symbol":"parseArgs","note":"--host accepts 0.0.0.0; default 127.0.0.1"}]}}],"terms":[{"id":"term-es-actor","term":"Actor","category":"role","aka":["actor-*","user","role"],"definition":"A person or role that issues commands and reads read models to decide (Viewer, Operator, a connected Claude session). Actor is the softest color convention on a wall (a small yellow), and in a flat digital diagram it needs a genuinely different hue from the aggregate to stay distinct.","anchors":[{"path":"docs/flows-schema.md","line":24,"symbol":"Node type: actor"}],"status":"resolved"},{"id":"term-es-aggregate","term":"Aggregate","category":"concept","aka":["agg-*"],"definition":"A consistency boundary: state that changes together and enforces its own invariants. In Event Storming an aggregate only RECEIVES commands and EMITS events, never issues a command. In a services-and-repositories codebase there are no explicit aggregates, so the data-layer scout recovers them as clusters of entities that change together (they are almost always 'inferred').","anchors":[{"path":"docs/flows-schema.md","line":40,"symbol":"Node rules: aggregates only receive"}],"status":"resolved"},{"id":"term-es-altitude","term":"Altitude","category":"jargon","aka":["altitude variation"],"definition":"The zoom level at which the same action is modeled. A generic 'cmd-attach-file' in a file-attachment pattern flow and a specialized 'cmd-attach-files-to-line' inline in an ordering flow are the same action at two altitudes. The merge deliberately does NOT force-merge legitimate altitude variations: collapsing them breaks the ability to walk each flow as a self-contained story. Shared aggregates and external systems, not collapsed commands, carry the connective tissue between flows.","anchors":[{"path":"docs/METHOD.md","line":142,"symbol":"don't force-merge altitude variations"}],"status":"resolved"},{"id":"term-smb-anchor","term":"Anchor","category":"jargon","aka":["tactical anchor","source anchor","{ path, line, symbol }"],"definition":"A pointer from a model node to a specific place in the source: { path, line, symbol, note }. `symbol` (method/handler/class) is the durable part since line numbers rot across rebases. Anchors are what grounding reads through to fetch real code, what the SPA turns into vscode:// deep links, and what MCP tool results inline. A cross-cutting term the whole tool uses, not owned by one node.","anchors":[{"path":"docs/flows-schema.md","line":31,"symbol":"tactical.anchors"},{"path":"src/server/context.mjs","line":55,"symbol":"anchors loop"}],"status":"resolved"},{"id":"term-es-bounded-context","term":"Bounded context","category":"concept","aka":["subdomain","core domain","supporting subdomain"],"definition":"A strategic boundary within which the ubiquitous language is consistent; edges that cross it are the integration points (an anti-corruption layer or published language). A bounded context must be DECLARED with an explicit label, never inferred from namespace/folder layout, because code layout is an accident rather than a domain fact. A code-derived view cannot recover context grouping on its own, which is one of the things it structurally loses versus a workshop wall.","status":"partial","openQuestion":"This recovered self-model is small enough to be a single context and does not declare bounded-context boundaries; a human who knows the intended architecture should say whether the recovery/explorer/MCP surfaces are meant to be separate bounded contexts and, if so, label them."},{"id":"term-asc-claude-cli","term":"Claude Code CLI","category":"system","aka":["claude mcp add","claude.cmd","ext-claude-cli"],"definition":"The user's Claude Code command-line tool (`claude`), invoked out-of-process by the es-view server. RegisterMcp shells out to `claude mcp add --transport http event-storming \"\u003curl>\" [--scope \u003cscope>]` on the Viewer's behalf to register the running app as an MCP server in the user's own Claude config. It runs as the same OS user with their PATH (a Windows claude.cmd shim resolves), so the effect is exactly what the user could type by hand; a missing binary is reported as notFound.","relatedNodes":["ext-claude-cli"],"anchors":[{"path":"src/server/mcp-register.mjs","line":13,"symbol":"claudeMcpAdd","note":"builds and execs the `claude mcp add` command"}],"status":"resolved"},{"id":"term-asc-claude-mcp-client","term":"Claude MCP client","category":"system","aka":["ext-claude-mcp-client","streamable-HTTP transport client"],"definition":"The Claude process on the far side of the MCP transport that POSTs to /mcp over streamable HTTP to read the model, the current selection, and the curated bundle. Distinct from the @modelcontextprotocol/sdk used inside the server (that is an in-process LIBRARY, not this external system) and from the `claude` CLI (the separate command shelled out to REGISTER the server). Per-session transports are keyed by Mcp-Session-Id.","relatedNodes":["ext-claude-mcp-client"],"anchors":[{"path":"src/server/mcp.mjs","line":120,"symbol":"createMcpHandler","note":"transports Map keyed by Mcp-Session-Id; POST /mcp entry"}],"status"
