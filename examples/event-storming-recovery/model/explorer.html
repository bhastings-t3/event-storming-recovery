:"resolved"},{"id":"term-es-command","term":"Command","category":"concept","aka":["cmd-*"],"definition":"An intent to change state, named in the imperative (\"PlaceOrder\", \"MergeTraces\"). Commands come from actors, policies, or external systems, are handled by an aggregate, and produce an event. A command that must read other aggregates/read models before acting expresses that with a 'reads' edge (a command lookup).","anchors":[{"path":"docs/flows-schema.md","line":25,"symbol":"label: commands IMPERATIVE"},{"path":"docs/flows-schema.md","line":47,"symbol":"Command lookups"}],"status":"resolved"},{"id":"term-dm-conceptual-vs-confidence","term":"conceptual vs confidence","category":"concept","aka":["conceptual: true","confidence: high|medium|low","two independent signals"],"definition":"Two independent per-field signals kept deliberately separate. 'conceptual' answers 'are we sure consumers see this field'; 'confidence' (high|medium|low) answers 'how sure are we of its derivation/sources'. A field can be conceptual and certain to exist yet still carry low source confidence, so the two must never be collapsed.","anchors":[{"path":"prompts/05-data-mapping.md","line":30,"symbol":"Keep two signals separate"},{"path":"docs/flows-schema.md","line":104,"symbol":"conceptual and confidence are independent"}],"status":"resolved"},{"id":"term-smb-connect-command","term":"Connect command (claude mcp add)","category":"jargon","aka":["claude mcp add --transport http","Add to Claude","RegisterMcp"],"definition":"The `claude mcp add --transport http \u003cname> \u003curl>` command that wires this running es-view session into the user's Claude configuration. The app surfaces it three ways: printed in the CLI banner, returned by GET /api/mcp/info to read/copy, and run on the user's behalf (via a shell, with a whitelisted --scope of local|project|user) when they click 'Add to Claude'. Because es-view already runs as the user with their PATH, this grants no new privilege.","relatedNodes":["rm-mcp-connect-command","cmd-register-mcp"],"anchors":[{"path":"src/server/mcp-register.mjs","line":13,"symbol":"claudeMcpAdd"},{"path":"src/server/server.mjs","line":178,"symbol":"/api/mcp/register"}],"status":"resolved"},{"id":"term-asc-connected-claude","term":"Connected Claude session","category":"role","aka":["actor-claude","connected Claude terminal"],"definition":"A Claude session wired to the running es-view app's MCP endpoint (same process as the SPA). It READS what the Viewer selected or gathered (via get_current_selection or the event-storming://selected-nodes resource) as grounded markdown, then does the real refactoring work in its own session on the real files. It is a context CONSUMER; the app is a 'context authority, not a Claude owner'. Contrast the Claude MCP client (the transport-level process) and the Claude CLI (the shelled-out registration command).","relatedNodes":["actor-claude"],"anchors":[],"status":"resolved"},{"id":"term-smb-context-bundle","term":"Context bundle","category":"concept","aka":["curated bundle","the gathered set","selected-nodes"],"definition":"The curated, @-mentionable set of typed refs ({ type: node | flow | hotspot, id }) the human gathers in the explorer, insertion-ordered and deduplicated (it is a set). Projected to one grounded markdown document (each item rendered with its invariants, flows, source anchors, and for flows a colored Mermaid graph) and handed to Claude all at once. Distinct from the Selection, which is the single node in focus right now.","relatedNodes":["rm-context-bundle","agg-selection"],"anchors":[{"path":"src/server/state.mjs","line":20,"symbol":"getBundle"},{"path":"src/server/context.mjs","line":158,"symbol":"renderBundleMarkdown"}],"status":"resolved"},{"id":"term-dm-storage-verbs","term":"Data-model edge verbs (persists to / projects from / writes / connects via)","category":"jargon","aka":["persists to","projects from","writes","connects via","STORAGE_VERBS"],"definition":"The four new behavioral-to-physical edge verbs: aggregate 'persists to' table, read model 'projects from' table, command 'writes' table, and any of command/readModel/aggregate 'connects via' server (existing 'reads' is reused for read access). They are demand-driven satellites attached by edges only; physical nodes are NEVER added to a flow's steps lane, exactly like invariants.","relatedNodes":["rm-data-model"],"anchors":[{"path":"src/lib/merge.mjs","line":14,"symbol":"EDGE_VERBS (persists to / projects from / writes / connects via)"},{"path":"src/lib/selectors.mjs","line":50,"symbol":"STORAGE_VERBS"}],"status":"resolved"},{"id":"term-mp-deep-trace-agent","term":"Deep-trace agent","category":"role","aka":["trace agent","tracer"],"definition":"A Phase-3 sub-agent that recovers one flow end to end: it verifies reachability, distrusts its hints (contradictions are the best findings), traces the main spine itself, records invariants and hotspots, and writes its own \u003cflow-id>.json + .notes.md to the traces dir, returning only a short summary. It is a recursion root, not a leaf: it spawns its own sub-agents to chase hubs, contradictions, and unfamiliar subsystems. A pilot trace runs first to tune the schema/briefing before the waves.","anchors":[{"path":"prompts/00-orchestrator.md","line":83,"symbol":"Phase 3","note":"each agent is a recursion root; writes two files itself"},{"path":"prompts/03-trace-briefing.md","line":21,"symbol":"Method","note":"trace end to end, verify reachability, record invariants/hotspots"}],"status":"resolved"},{"id":"term-asc-browser","term":"Default web browser","category":"system","aka":["ext-browser","OS opener","start/open/xdg-open"],"definition":"The Operator's default web browser, outside the process boundary. At the end of boot es-view crosses the browser/OS-shell boundary by spawning a detached, best-effort OS opener (win32 `start`, darwin `open`, else `xdg-open`) to launch the served URL there, unless --no-open. The URL is always printed too, so a failed open is non-fatal.","relatedNodes":["ext-browser"],"anchors":[{"path":"src/server/open.mjs","line":4,"symbol":"openBrowser","note":"platform-specific detached spawn; best-effort, never throws"},{"path":"bin/es-view.mjs","line":111,"symbol":"main","note":"if (opts.open) openBrowser(url)"}],"status":"resolved"},{"id":"term-dm-demand-driven","term":"demand-driven","category":"jargon","aka":["demand-driven, not exhaustive","no full-ERD dump","only referenced columns"],"definition":"The stance that the data-model layer captures ONLY the servers/databases/tables/columns the behavioral model actually references, never a full-ERD dump. Only the columns a field references are added, never every column of a table. It keeps the layer strategic, the same spirit as 'prefer few, meaningful events', and answers 'what data does this read model/aggregate return and where does it come from' rather than describing the whole schema.","anchors":[{"path":"docs/flows-schema.md","line":68,"symbol":"Data model: demand-driven, not exhaustive"},{"path":"prompts/05-data-mapping.md","line":91,"symbol":"Don't dump schemas"}],"status":"resolved"},{"id":"term-mp-demo","term":"demo (BuildExample)","category":"jargon","aka":["npm run demo","build-example.mjs","BuildExample","cmd-build-example"],"definition":"A thin convenience wrapper (npm run demo -> scripts/build-example.mjs) that synchronously chains the merge CLI then the generate CLI over the bundled toy-shop example, so the shipped default explorer stays in sync with its trace set. The two child processes are blocking and inherit exit status, so a merge validation failure (exit 1) aborts before regeneration. It issues no state of its own; it delegates to Merge then Generate. Note it overwrites the shipped fallback model in place (see hot-example-overwrite-in-place).","relatedNodes":["cmd-build-example"],"anchors":[{"path":"scripts/build-example.mjs","line":11,"symbol":"run","note":"execFileSync('node', args, { stdio:'inherit' }) - synchronous, blocking"},{"path":"package.json","line":31,"symbol":"scripts.demo","note":"\"demo\": \"node scripts/build-example.mjs\""}],"status":"resolved"},{"id":"term-dm-derivation","term":"Derivation","category":"concept","aka":["derivation"],"definition":"The required prose sentence on every field saying HOW that field is produced (e.g. 'Sum of order_items.amount plus computed regional tax', or 'constant, hard-coded'). It is the human-readable lineage that stands even when there are zero machine-resolvable sources. In this tool's own self-model the stores are file-based / in-memory rather than SQL, so a derivation typically describes reading a JSON payload or an in-memory selector, not a column projection.","anchors":[{"path":"docs/flows-schema.md","line":83,"symbol":"derivation (prose, REQUIRED)"},{"path":"prompts/05-data-mapping.md","line":26,"symbol":"Every field carries a prose derivation"}],"status":"resolved"},{"id":"term-es-domain-event","term":"Domain Event","category":"concept","aka":["Event","evt-*"],"definition":"A named business fact that already happened, stated in the past tense (\"OrderPlaced\", \"ModelValidated\"). It is the most stable Event Storming convention. \"A row was inserted\" is NOT an event; the discriminator against a raw measurement/telemetry data-point is whether it is a domain-significant fact. Prefer few meaningful events over one event per statement (a multi-table transactional write is one event).","anchors":[{"path":"docs/flows-schema.md","line":54,"symbol":"Node rules: events past tense"}],"status":"resolved"},{"id":"term-es-grammar-rule","term":"ES grammar rule (aggregates never issue commands)","category":"concept","aka":["the flow grammar","The Picture That Explains Everything"],"definition":"The self-reinforcing loop Actor/Policy/External-System -> Command -> Aggregate -> Event -> Policy -> Command, with read models fed off events. The one hard constraint the merge enforces at load time is that an aggregate may only receive commands and emit events, never issue one: an edge from an aggregate with verb 'issues' is an error. The other shapes (policies issue commands, command lookups) are left to author discipline.","relatedNodes":["inv-es-grammar"],"anchors":[{"path":"src/lib/merge.mjs","line":169,"symbol":"aggregate issues a command - forbidden"}],"status":"resolved"},{"id":"term-smb-es-view","term":"es-view","category":"jargon","aka":["npx event-storming-recovery view","es-view server","the explorer app"],"definition":"The tool's runtime: one local node:http process that serves the React SPA, the JSON API, and the MCP endpoint over a single shared in-memory state, launched by `npx event-storming-recovery view`. It resolves a model (explicit --model, merged --traces, an auto-discovered flows.json, or the bundled toy-shop example), binds one loopback port, and opens the browser. Distinct from the static explorer.html the generator emits: es-view serves the live model and hosts the MCP bridge.","relatedNodes":["agg-es-view-session"],"anchors":[{"path":"bin/es-view.mjs","line":75,"symbol":"main"},{"path":"src/server/server.mjs","line":194,"symbol":"startServer"}],"status":"resolved"},{"id":"term-es-event-storming","term":"Event Storming","category":"concept","aka":["ES","event storm"],"definition":"A workshop technique (Alberto Brandolini) for modeling a business domain as a timeline of domain events, then filling in the commands, aggregates, policies, read models, actors, and external systems around them. This tool recovers a first-draft Event Storming model directly from code instead of a from-scratch workshop, so the result is an always-true scaffold and conversation starter rather than a replacement for the wall.","anchors":[{"path":"docs/METHOD.md","line":11,"symbol":"The problem"}],"status":"resolved"},{"id":"term-smb-event-storming-name","term":"event-storming (MCP server name)","category":"jargon","aka":["MCP_NAME","event-storming-recovery (self-name)"],"definition":"The alias this app registers under in the user's Claude config, MCP_NAME = 'event-storming' (the name shown in the connect UI and the `claude mcp add` command). Note a mismatch: the McpServer identifies ITSELF to clients as 'event-storming-recovery' (its SDK name/version), so the tool effectively goes by two names. Which is canonical for the user to reference is unsettled.","relatedNodes":["agg-mcp-registration"],"anchors":[{"path":"src/server/server.mjs","line":24,"symbol":"MCP_NAME"},{"path":"src/server/mcp.mjs","line":20,"symbol":"new McpServer name"}],"status":"partial","openQuestion":"Should the registration alias ('event-storming') and the McpServer self-identifier ('event-storming-recovery') be unified, and which name is the intended public one users type after `claude mcp add` and in `/mcp`? (See hotspot hot-mcp-name-mismatch.)"},{"id":"term-mp-explorer-html","term":"explorer.html","category":"jargon","aka":["the explorer","interactive explorer","rm-explorer"],"definition":"The self-contained interactive Event Storming explorer generate emits: a single HTML file with the entire model serialized inline (const MODEL = ...) and a dependency-free vanilla-JS/CSS SPA (Flows board, Gallery, Data model, Glossary, Overview tabs, detail panel with source anchors). Openable directly in a browser with no server or network. Because the model is embedded, it is a FROZEN snapshot that drifts from flows.json until regenerated (see hot-frozen-explorer-snapshot). Note: the live es-view server serves a React SPA of the same shape from the in-memory model rather than this static file.","relatedNodes":["rm-explorer"],"anchors":[{"path":"tools/generate-views.js","line":438,"symbol":"MODEL","note":"entire model inlined as const MODEL (frozen snapshot)"},{"path":"tools/generate-views.js","line":1487,"symbol":"html","note":"writeFileSync(outDir/explorer.html)"}],"status":"resolved"},{"id":"term-es-external-system","term":"External System","category":"concept","aka":["ext-*"],"definition":"A system outside the deploy boundary (SaaS, another service, a cloud API, a legacy system, the local filesystem/browser/editor as this tool models them). It can issue commands and raise or receive events. An in-process library is NOT an external system. An aggregate whose state actually lives inside one is marked with 'ownedBy'.","anchors":[{"path":"docs/flows-schema.md","line":56,"symbol":"Node rules: external systems"}],"status":"resolved"},{"id":"term-dm-field","term":"Field","category":"concept","aka":["fields[]","conceptual property"],"definition":"A conceptual property a read model or aggregate exposes (what a consumer sees), NOT a column alias. A field carries a prose derivation and 0..N storage sources; it may be assembled through joins and sums or computed and never stored at all, so a field with sources:[] is correct, not incomplete. Fields sit on top of what the code reveals and never force a one-to-one field-to-column mapping.","relatedNodes":["rm-data-model"],"anchors":[{"path":"docs/flows-schema.md","line":73,"symbol":"fields[] on readModel & aggregate nodes"},{"path":"prompts/05-data-mapping.md","line":21,"symbol":"A field is a conceptual property"}],"status":"resolved"},{"id":"term-mp-flow","term":"Flow","category":"concept","aka":["flow","flows[]"],"definition":"The tool's unit of recovered behavior: one end-to-end path through the system, from a trigger, through commands/aggregates/events, to what the actor reads. A flow is a first-class object in flows.json (id, name, tier, kind, status, ordered steps, edges, hotspots, instances); a trace agent authors one flow per file and the merge accumulates them. Flows join into a single map only through shared node ids, not through direct flow-to-flow links.","anchors":[{"path":"docs/flows-schema.md","line":137,"symbol":"Flow"},{"path":"src/lib/merge.mjs","line":110,"symbol":"mergeTraceDocs","note":"flows deduped by id into the model"}],"status":"resolved"},{"id":"term-mp-flow-status","term":"Flow status (live / dead / superseded)","category":"state","aka":["status","live","dead","superseded","supersededBy"],"definition":"A flow's reachability verdict from the deep-trace reachability check. live = the path is reachable and current; dead = an unreachable code path (no caller / unregistered route); superseded = replaced but still reachable, with supersededBy naming the flow id that replaced it. Dead and superseded flows are traced anyway, because the delta to their replacement is recovered intent. The merge indexes every non-live flow into meta.deadFlows; DOT/explorer render them dashed with a [STATUS] label.","anchors":[{"path":"docs/flows-schema.md","line":143,"symbol":"status","note":"live | dead | superseded (+ supersededBy)"},{"path":"src/lib/merge.mjs","line":209,"symbol":"mergeTraceDocs","note":"deadFlows = flows whose status != live"}],"status":"resolved"},{"id":"term-mp-flows-dot","term":"flows.dot (Graphviz DOT)","category":"jargon","aka":["flows.dot","DOT","Graphviz digraph","rm-flows-dot"],"definition":"The Graphviz digraph generate emits alongside explorer.html: one subgraph cluster per flow with Event-Storming-colored stickies and verb-labeled edges, rendered offline (e.g. dot -Tsvg) or in a Graphviz viewer to read the whole board at a glance. Physical data-model nodes (server/database/table/column) and any edge touching them are deliberately excluded; each node's first tactical anchor is attached as a vscode:// deep link; dead/superseded flows render dashed with a [STATUS] suffix.","relatedNodes":["rm-flows-dot"],"anchors":[{"path":"tools/generate-views.js","line":64,"symbol":"dot","note":"digraph header + per-flow subgraphs"},{"path":"tools/generate-views.js","line":91,"symbol":"dot","note":"writeFileSync(outDir/flows.dot)"}],"status":"resolved"},{"id":"term-mp-es-generate","term":"Generate (es-generate)","category":"concept","aka":["es-generate","generate-views.js","GenerateViews","cmd-generate-views"],"definition":"Phase 6: render the canonical flows.json into the two shipped views: a Graphviz flows.dot digraph (one cluster per flow, Event-Storming palette) and a self-contained interactive explorer.html with the whole model inlined. A pure read-render transform, never editing the model; you edit traces and regenerate, keeping the model diffable and the views disposable.","relatedNodes":["cmd-generate-views"],"anchors":[{"path":"tools/generate-views.js","line":19,"symbol":"args","note":"flowsFile, outDir, --repo-root, --title"},{"path":"tools/generate-views.js","line":64,"symbol":"dot","note":"build DOT then explorer.html template"}],"status":"resolved"},{"id":"term-smb-grounding","term":"Grounding / grounded context","category":"concept","aka":["grounded","grounded node context","source behind the anchor"],"definition":"Assembling a node/flow/hotspot together with the REAL source code read from disk behind each of its anchors, so a refactor request Claude receives is tied to actual files, not just a label. buildNodeContext gathers the node's description, fields, invariant relation, flows, and for each anchor calls readSource(repoRoot, path, line) to inline the excerpt. 'Grounded' throughout the tool means this: label plus its evidence.","relatedNodes":["rm-node-context"],"anchors":[{"path":"src/server/context.mjs","line":18,"symbol":"buildNodeContext"},{"path":"src/server/context.mjs","line":58,"symbol":"readSource inline"}],"status":"resolved"},{"id":"term-es-hotspot","term":"Hotspot","category":"concept","aka":["red sticky","hot-*"],"definition":"The red sticky: friction, risk, disagreement, or a place where intent is unrecoverable from code, framed as THE QUESTION A HUMAN SHOULD ANSWER and anchored to the source. Hotspots are the payoff of a code-derived model and the one thing no code reading can produce; they are human judgment. They attach at flow level and live in a top-level hotspots array, not in nodes.","anchors":[{"path":"docs/flows-schema.md","line":156,"symbol":"Hotspot"},{"path":"docs/METHOD.md","line":208,"symbol":"Hotspots are questions, not verdicts"}],"status":"resolved"},{"id":"term-smb-in-memory-state","term":"In-memory state","category":"jargon","aka":["state.mjs","shared state","non-persistent"],"definition":"The mutable session state (the current selection plus the context bundle) created once at boot and shared same-process by the JSON API and the MCP server. Non-persistent by design: it is the live 'what am I looking at / what have I gathered right now' for one es-view run, lost on restart. It is one process-global set, NOT per browser tab or per MCP session, so every connected reader sees the same selection and bundle.","relatedNodes":["agg-selection","agg-es-view-session"],"anchors":[{"path":"src/server/state.mjs","line":9,"symbol":"createState"}],"status":"resolved"},{"id":"term-es-inferred","term":"inferred","category":"jargon","aka":["inferred: true","inferred: false"],"definition":"A per-node flag: true when the concept was RECOVERED from code that never names it (the usual case for behavioral stickies in a services-and-repositories codebase), false only when the code literally names the concept. Physical data-model nodes (server/database/table/column) default to inferred:false, the inverse of the behavioral layer, because the SQL names them outright. At merge time an explicit inferred:false wins over an inferred:true seeding.","anchors":[{"path":"docs/flows-schema.md","line":59,"symbol":"inferred rule"},{"path":"src/lib/merge.mjs","line":91,"symbol":"explicit code naming wins"}],"status":"resolved"},{"id":"term-mp-instance","term":"Instance (tier-2 pattern instance)","category":"jargon","aka":["instances","instances[]"],"definition":"One member of a Tier-2 pattern family, listed on the exemplar flow's instances[] as { label, route, file } instead of being traced on its own. Instances let the model enumerate every repetitive screen/endpoint of a pattern (so nothing is missing from the map) without paying to deep-trace each. In this self-model every flow is a fully traced Tier-1 or a standalone Tier-2, so all instances[] are empty.","anchors":[{"path":"docs/flows-schema.md","line":152,"symbol":"instances","note":"tier-2 only: [{ label, route, file }] per instance"}],"status":"resolved"},{"id":"term-es-invariant","term":"Invariant","category":"concept","aka":["inv-*","business rule","guard","specification"],"definition":"A constraint enforced INSIDE an aggregate while it handles a command, before any event, that can reject the action (\"a bundle item references a real item at most once\", \"aggregates never issue commands\"). It is NOT event-triggered and does not issue a command, which is exactly what distinguishes it from a Policy. Invariants attach to their aggregate with an 'enforces' edge and never appear in a flow's steps lane.","anchors":[{"path":"docs/flows-schema.md","line":45,"symbol":"Node rules: invariant vs policy"}],"status":"resolved"},{"id":"term-smb-json-api","term":"JSON API (/api/*)","category":"jargon","aka":["/api/model","/api/selection","/api/context","/api/source","/api/item"],"definition":"The local HTTP+JSON surface es-view serves alongside the SPA and MCP endpoint: /api/model (resolved model + provenance), /api/health, GET/POST/DELETE /api/selection and /api/context (the shared selection and bundle), /api/item and /api/source (grounded markdown / real code behind an anchor), and /api/mcp/info + /api/mcp/register (the connect helper). It is the SPA's data plane and mirrors the same state the MCP tools read.","anchors":[{"path":"src/server/server.mjs","line":100,"symbol":"createServer request router"},{"path":"src/web/api.js","line":1,"symbol":"api client"}],"status":"resolved"},{"id":"term-dm-lineage","term":"Lineage","category":"concept","aka":["data lineage","fieldsSourcingColumn"],"definition":"The traceable chain from a conceptual field back to the physical columns it draws from, expressed through derivation prose plus sources[] refs. The explorer can walk it in reverse (which fields draw from a given column) to answer impact questions before a schema change. Lineage is intentionally partial: a field with strong derivation prose and zero resolvable sources is a legitimate lineage endpoint, not a gap.","anchors":[{"path":"src/lib/selectors.mjs","line":96,"symbol":"fieldsSourcingColumn (reverse lineage)"},{"path":"docs/flows-schema.md","line":84,"symbol":"sources[] wiring ref to columns"}],"status":"resolved"},{"id":"term-asc-source-fs","term":"Local filesystem as a data source","category":"system","aka":["ext-source-fs","local filesystem"],"definition":"The local filesystem treated as the tool's data source and sink, outside the process boundary. It holds the per-flow trace JSONs the merge reads, receives the merged flows.json written as output (CLI path only; the server keeps the model in memory), and supplies the REAL code excerpts pulled behind each anchor when a Viewer views source.","relatedNodes":["ext-source-fs"],"anchors":[{"path":"src/server/source.mjs","line":13,"symbol":"readSource","note":"reads the real file behind an anchor from disk"}],"status":"resolved"},{"id":"term-smb-loopback-trust-boundary","term":"Loopback trust boundary (127.0.0.1 / --host)","category":"jargon","aka":["127.0.0.1","loopback","--host exposure"],"definition":"es-view binds to 127.0.0.1 by default, so the unauthenticated JSON API and MCP endpoint are reachable only from the local machine, treated as the trust boundary (no auth anywhere on the surface). The --host flag is passed straight to server.listen, so `--host 0.0.0.0` (or a LAN IP) drops that boundary and exposes the full API, including the arbitrary-file-read GET /api/source and the MCP tools, to the network (see hotspots hot-host-exposure, hot-source-api-network-exposed).","relatedNodes":["agg-es-view-session"],"anchors":[{"path":"src/server/server.mjs","line":202,"symbol":"server.listen host"},{"path":"bin/es-view.mjs","line":27,"symbol":"host default"}],"status":"resolved"},{"id":"term-asc-marketplace","term":"marketplace","category":"jargon","aka":["Claude Code plugin marketplace",".claude-plugin/marketplace.json"],"definition":"A Claude Code plugin marketplace manifest (`.claude-plugin/marketplace.json`) listing installable plugins. Here the repo is BOTH the marketplace and the single plugin it hosts (source `./`): `claude plugin marketplace add bhastings-t3/event-storming-recovery` then `plugin install event-storming-recovery@event-storming-recovery` wire it up from the same repo.","anchors":[{"path":".claude-plugin/marketplace.json","line":8,"symbol":"plugins","note":"the repo listed as its own plugin, source ./"}],"status":"resolved"},{"id":"term-smb-mcp","term":"MCP (Model Context Protocol)","category":"acronym","aka":["Model Context Protocol","@modelcontextprotocol/sdk"],"definition":"The open protocol Claude uses to read context from external servers. es-view exposes an MCP server so a connected Claude session can pull what the human is looking at (tools) and the curated set they gathered (a resource). The server side uses the @modelcontextprotocol/sdk McpServer as an in-process library; the Claude process that speaks MCP across the boundary is the external client.","relatedNodes":["ext-claude-mcp-client"],"anchors":[{"path":"src/server/mcp.mjs","line":18,"symbol":"buildMcpServer"}],"status":"resolved"},{"id":"term-smb-mcp-resource","term":"MCP resource (event-storming://selected-nodes)","category":"jargon","aka":["selected-nodes","event-storming://selected-nodes"],"definition":"The one MCP resource the server exposes: the curated context bundle rendered as a single text/markdown document at the URI `event-storming://selected-nodes`. Unlike the always-fresh selection tool, it is modeled as a resource because the user @-mentions it to hand Claude the whole gathered set at once. Its content is regenerated from the live bundle each time it is read.","relatedNodes":["rm-context-bundle"],"anchors":[{"path":"src/server/mcp.mjs","line":87,"symbol":"registerResource selected-nodes"}],"status":"resolved"},{"id":"term-smb-mcp-session","term":"MCP session (Mcp-Session-Id)","category":"jargon","aka":["Mcp-Session-Id","sessionId"],"definition":"One MCP conversation between a Claude client and the es-view server, keyed by the Mcp-Session-Id header. It is created on the first `initialize` POST (a randomUUID), stored in a transports Map, and reused for subsequent requests until the transport closes. Note this is a transport-level session and is separate from the process-global selection/bundle state, which is shared across ALL sessions and browser tabs, not per-session.","relatedNodes":["agg-es-view-session"],"anchors":[{"path":"src/server/mcp.mjs","line":125,"symbol":"mcp-session-id header"},{"path":"src/server/mcp.mjs","line":135,"symbol":"onsessioninitialized"}],"status":"resolved"},{"id":"term-smb-mcp-tool-set","term":"MCP tool set","category":"concept","aka":["get_current_selection","get_node","get_flow","list_model","list_data_model"],"definition":"The five read tools the MCP server registers, each returning grounded markdown: get_current_selection (the node the human is looking at now), get_node (any node by id), get_flow (a whole flow with its Mermaid graph), list_model (a compact index of all flow and node ids), and list_data_model (the physical server/database/table/column tree). All are read-only over the live model; 'current selection' is a tool (always fresh) rather than a resource because it needs no subscription.","relatedNodes":["rm-node-context","rm-model-index","rm-current-selection"],"anchors":[{"path":"src/server/mcp.mjs","line":22,"symbol":"registerTool"},{"path":"src/server/mcp.mjs","line":63,"symbol":"list_model"}],"status":"resolved"},{"id":"term-mp-es-merge","term":"Merge (es-merge)","category":"concept","aka":["es-merge","merge-flows.js","MergeTraces","cmd-merge-traces","mergeTraceDocs"],"definition":"Phase 4: fold every per-flow trace into one canonical, validated model. Nodes are unioned by global id (first-seen type/label wins, longest description wins, tactical detail appended as per-flow usages), flows/hotspots/terms are accumulated, derived meta is computed, and all invariants are checked before the model is returned. Callers own IO: the CLI (merge-flows.js) writes flows.json and exits nonzero on errors; the server's --traces path throws on errors so it never serves an invalid model.","relatedNodes":["cmd-merge-traces"],"anchors":[{"path":"src/lib/merge.mjs","line":63,"symbol":"mergeTraceDocs","note":"seed/union nodes, accumulate flows, validate, build model"},{"path":"tools/merge-flows.js","line":24,"symbol":"cli","note":"CLI front end: argv, writeFileSync, exit codes"}],"status":"resolved"},{"id":"term-mp-meta","term":"meta (derived fields)","category":"jargon","aka":["meta","meta.sharedGlossary","meta.deadFlows","meta.counts","byType","generatedFrom"],"definition":"The top-level block the merge computes and stamps onto flows.json, mostly derived rather than authored. Its fields: generatedFrom (the trace file names folded in), counts (flows/nodes/hotspots/terms totals plus byType per node type and unresolvedTerms), deadFlows (every non-live flow with its status/supersededBy), and sharedGlossary (the OUTPUT list of nodes that appear in more than one flow, with each node's flow count). title/repoRoot may also live here as fallbacks for the generator's flags.","anchors":[{"path":"src/lib/merge.mjs","line":217,"symbol":"mergeTraceDocs","note":"meta: generatedFrom, counts, byType, deadFlows, sharedGlossary"},{"path":"docs/flows-schema.md","line":16,"symbol":"meta","note":"derived counts, glossary, dead-flow index"}],"status":"resolved"},{"id":"term-mp-model-source","term":"Model source (resolution provenance)","category":"jargon","aka":["source","resolveModel source","model | traces | discovered | example"],"definition":"How es-view obtained the model it is serving, recorded as meta.source by resolveModel and shown as provenance in the boot banner and /api/model payload. Precedence highest-first: 'model' (an explicit --model flows.json), 'traces' (merge a --traces dir in memory), 'discovered' (auto-found flows.json under cwd), or 'example' (the bundled toy-shop fallback). Distinct from the data-model layer's field-level provenance[] (sql-literal / migration / ...), which is owned by the data-model glossary.","anchors":[{"path":"src/server/resolve-model.mjs","line":65,"symbol":"resolveModel","note":"precedence: --model > --traces > auto-discover > bundled example"},{"path":"src/server/resolve-model.mjs","line":72,"symbol":"resolveModel","note":"source = 'model' | 'traces' | 'discovered' | 'example'"}],"status":"resolved"},{"id":"term-mp-node","term":"Node (sticky-node)","category":"jargon","aka":["node","nodes[]","sticky-node"],"definition":"The data realization of a Sticky: one entry in the model's nodes[] with a globally unique, type-prefixed id (actor- cmd- agg- evt- pol- rm- ext- inv- srv- db- tbl- col-), a type, a label, and tactical anchors. Distinct from the method's Sticky (the wall concept): a Node is the deduped, id-keyed record the merge unions across flows. Node ids are global, so reusing the same id across flows is how flows join into one map.","anchors":[{"path":"docs/flows-schema.md","line":20,"symbol":"Node"},{"path":"src/lib/merge.mjs","line":80,"symbol":"mergeTraceDocs","note":"node union: seed new id / merge re-seen id"}],"status":"resolved"},{"id":"term-asc-npx-bin","term":"npx / bin entry points","category":"jargon","aka":["es-view","es-merge","es-generate","event-storming-recovery","npx event-storming-recovery view"],"definition":"The package's executable entry points declared in package.json `bin`: `event-storming-recovery` and `es-view` (both -> bin/es-view.mjs, the SPA + MCP launcher), `es-merge` (tools/merge-flows.js) and `es-generate` (tools/generate-views.js). Run via `npx event-storming-recovery view` without a global install, or as the bare `es-*` commands once installed. `view` is an optional leading subcommand es-view accepts; a bare path argument is treated as --model.","anchors":[{"path":"package.json","line":7,"symbol":"bin","note":"the four declared executables and their targets"},{"path":"bin/es-view.mjs","line":29,"symbol":"parseArgs","note":"optional leading `view` subcommand shifted off"}],"status":"resolved"},{"id":"term-asc-operator","term":"Operator","category":"role","aka":["actor-operator","developer/orchestrator"],"definition":"The developer or orchestrator who runs the tool from a terminal: the merge/generate CLIs (es-merge, es-generate, npm run demo) and the es-view launcher (npx event-storming-recovery). Distinguished from the Viewer: the Operator boots the app; the Viewer then interacts with it in the browser (often the same person, not necessarily).","relatedNodes":["actor-operator"],"anchors":[{"path":"bin/es-view.mjs","line":75,"symbol":"main","note":"the CLI the operator invokes to boot the explorer"}],"status":"resolved"},{"id":"term-mp-orchestrator","term":"Orchestrator","category":"role","aka":["the orchestrator","driver"],"definition":"The top-level agent that runs the recovery: it never reads the whole codebase itself, but dispatches sub-agents, persists their structured returns to disk, runs the merge/generate CLIs, and makes the judgment calls (triage, consistency). Keeping only conclusions and anchors (never file dumps) is what keeps its context clean across a system with dozens of flows. Not to be conflated with the Operator actor (the human who runs the CLIs / launches es-view).","anchors":[{"path":"prompts/00-orchestrator.md","line":3,"symbol":"orchestrator","note":"dispatches sub-agents, keeps durable artifacts, makes judgment calls"},{"path":"docs/METHOD.md","line":22,"symbol":"Why orchestration","note":"the orchestrator never reads the codebase itself"}],"status":"resolved"},{"id":"term-dm-owned-by","term":"ownedBy","category":"jargon","aka":["ownedBy"],"definition":"An optional pointer on an aggregate (and, in the data layer, on a database/server) saying its state actually lives INSIDE a named external system the tool does not deploy. The data-mapping phase reconciles with the existing ownedBy rather than inventing a parallel physical representation. In this self-model, agg-mcp-registration is ownedBy ext-claude-cli: the registration record lives in the Claude CLI's own config, not in a store this tool owns.","relatedNodes":["agg-mcp-registration"],"anchors":[{"path":"docs/flows-schema.md","line":27,"symbol":"ownedBy (aggregates only)"},{"path":"prompts/05-data-mapping.md","line":68,"symbol":"Reconcile with ownedBy"}],"status":"resolved"},{"id":"term-dm-parent-containment","term":"parent containment","category":"jargon","aka":["parent","PARENT_LEVEL","containment tree"],"definition":"How the physical tier nests: a column points to its table, a table to its database, a database to its server, via a 'parent' pointer rather than a flow edge. The merge enforces the level (column->table->database->server) and rejects cycles; a node parented at the wrong level is warned and dropped from the data-model tree. A node reached only through parent (or through a field source ref) still counts as referenced, so cited columns never orphan-warn.","anchors":[{"path":"src/lib/merge.mjs","line":24,"symbol":"PARENT_LEVEL"},{"path":"src/lib/selectors.mjs","line":54,"symbol":"parentChain (containment breadcrumb)"}],"status":"resolved"},{"id":"term-dm-physical-nodes","term":"Physical node types (server / database / table / column)","category":"concept","aka":["srv-","db-","tbl-","col-","physical layer"],"definition":"The four node types of the physical storage tier the behavioral model actually touches: server, database, table, and column (id prefixes srv- db- tbl- col-). Unlike behavioral stickies they default to inferred:false because the code literally names them, and they require a description but not an anchor. This is the vocabulary the tool RECOVERS FROM an analyzed codebase's SQL/ORM/config; the tool's OWN data layer is file-based/in-memory, so the self-model currently has no physical nodes.","relatedNodes":["rm-data-model"],"anchors":[{"path":"docs/flows-schema.md","line":107,"symbol":"Physical node types"},{"path":"src/lib/merge.mjs","line":13,"symbol":"NODE_TYPES (server/database/table/column)"}],"status":"resolved"},{"id":"term-asc-plugin","term":"plugin","category":"jargon","aka":["Claude Code plugin",".claude-plugin/plugin.json"],"definition":"This repo packaged as a Claude Code plugin, declared by `.claude-plugin/plugin.json`. Installing it bundles both skills, the prompts/tools, and the `event-storming` MCP server declaration (pinned to http://127.0.0.1:5178/mcp) in one step, so an installed user gets the whole workflow plus the context bridge without wiring anything by hand.","anchors":[{"path":".claude-plugin/plugin.json","line":10,"symbol":"mcpServers","note":"declares the event-storming MCP server at the pinned localhost URL"}],"status":"resolved"},{"id":"term-es-policy","term":"Policy","category":"concept","aka":["pol-*","process","reaction","synchronous policy","synchronous: true"],"definition":"Strictly reactive logic: \"whenever \u003cevent> then \u003ccommand>.\" It sits after an event and before the next command, orchestrating cross-aggregate reactions. This repo adds a 'synchronous' flag: a synchronous policy is inline synchronous code reacting to the first event (not a decoupled subscriber), which is how the UI-vs-service split rule models a second write with its own failure window.","anchors":[{"path":"docs/flows-schema.md","line":43,"symbol":"Node rules: Policy = strictly reactive"},{"path":"docs/flows-schema.md","line":28,"symbol":"synchronous field"}],"status":"resolved"},{"id":"term-smb-port-fall-forward","term":"Port fall-forward","category":"jargon","aka":["EADDRINUSE fall-forward","port 5178 -> 5179+"],"definition":"The server's port-selection behavior: it tries the preferred port (default 5178) and, on EADDRINUSE, increments and retries up to 20 times, then binds and prints whatever port it landed on. Convenient for running several explorers at once, but it means the live MCP URL can differ from any hardcoded one (see hotspot hot-port-fall-forward-stale-mcp).","relatedNodes":["agg-es-view-session"],"anchors":[{"path":"src/server/server.mjs","line":197,"symbol":"tryListen"}],"status":"resolved"},{"id":"term-dm-provenance","term":"Provenance","category":"jargon","aka":["provenance","sql-literal","connection-string","orm-mapping","migration","inferred-from-dto","assumed"],"definition":"An append-only list on a field (and on physical nodes) recording HOW each piece of evidence was obtained: sql-literal, connection-string, orm-mapping, migration, inferred-from-dto, or assumed. Provenance appends, never overwrites, so a migration that corroborates a sql-literal finding raises confidence while the original code evidence stays. In this tool's own self-model, storage is recovered from file/in-memory reads rather than SQL, so its fields lean toward inferred-from-dto / assumed rather than sql-literal.","anchors":[{"path":"docs/flows-schema.md","line":89,"symbol":"provenance enum (append-only)"},{"path":"docs/flows-schema.md","line":124,"symbol":"Provenance appends, never overwrites"}],"status":"resolved"},{"id":"term-mp-reachability","term":"Reachability check","category":"concept","aka":["reachability","verify reachability"],"definition":"The first move of a deep-trace: confirm the entry point is actually wired (a caller exists, the route is registered, the button renders, DI is set up) before tracing it. When a caller is missing, chasing git log / git show recovers when and why it was removed, which is often the most valuable finding; the result sets the flow's status (live / dead / superseded). This is how dead and superseded flows get caught rather than modeled as if current.","anchors":[{"path":"prompts/03-trace-briefing.md","line":26,"symbol":"CHECK REACHABILITY","note":"confirm the entry point is wired; git log/show when a caller is missing"},{"path":"docs/METHOD.md","line":108,"symbol":"Phase 3","note":"verifies reachability first"}],"status":"resolved"},{"id":"term-es-read-model","term":"Read Model","category":"concept","aka":["rm-*","view","projection"],"definition":"What an actor reads in order to decide: a grid, view, projection, or downloaded file. It is the query side, distinct from the command/write side, and carries a demand-driven fields[] list describing what data it returns and where that data comes from.","anchors":[{"path":"docs/flows-schema.md","line":55,"symbol":"Node rules: read models"}],"status":"resolved"},{"id":"term-mp-recovery-phases","term":"Recovery phases","category":"concept","aka":["the six phases","phase 1-6","inventory / triage / deep-trace / merge / glossary mining / data mapping / generate"],"definition":"The staged pipeline the orchestrator runs to recover a model from code: (1) Inventory (parallel scouts enumerate every entry point) -> (2) Triage (the one human checkpoint agreeing coverage tiers) -> (3) Deep-trace (a pilot, then waves of trace agents) -> (4) Merge & consistency -> (5) Ubiquitous-language / glossary mining -> (5.5) Data mapping (optional) -> (6) Generate & verify. Each later phase runs against the merged model and re-runs the merge to fold its output back in.","anchors":[{"path":"prompts/00-orchestrator.md","line":47,"symbol":"Phases","note":"Phase 1 Inventory through Phase 6 Generate"},{"path":"docs/METHOD.md","line":3,"symbol":"The method","note":"the reasoning behind the six phases"}],"status":"resolved"},{"id":"term-mp-recursion-protocol","term":"Recursion protocol","category":"concept","aka":["recursive-exploration","recursion is the spine","fan-out"],"definition":"The shared protocol every agent in the tree inherits (prompts/recursive-exploration.md): a sub-agent is not a flat leaf but a recursion root that spawns its own children when it hits a high-signal pathway (a hub, a contradiction, an unfamiliar subsystem, a model-forking branch), and those may recurse further. Depth and fan-out are aggressive; convergence (a child that returns without changing the model) is the brake. The return contract is fixed - artifacts to files, conclusions + anchors back - so a deep subtree still lands in the parent's context as a short summary. Requires spawning agents as a type carrying the Agent tool (general-purpose/claude), on Opus.","anchors":[{"path":"prompts/00-orchestrator.md","line":18,"symbol":"recursion protocol","note":"every sub-agent inherits prompts/recursive-exploration.md"},{"path":"docs/METHOD.md","line":34,"symbol":"Recursion is the spine","note":"dynamic tree; depth follows the signal; return contract fixed"}],"status":"resolved"},{"id":"term-asc-repo-root","term":"REPO_ROOT / repoRoot","category":"jargon","aka":["repoRoot","REPO_ROOT","--repo-root","meta.repoRoot"],"definition":"The absolute path of the ANALYZED checkout that all source anchors resolve against — the target codebase the model describes, NOT this tool's own repo. Set by --repo-root, falling back to model.meta.repoRoot then the example tree or cwd. It is used server-side to read source and to build vscode:// links, and is inlined into the static explorer.html as `const REPO_ROOT`.","relatedNodes":["ext-source-fs"],"anchors":[{"path":"src/server/resolve-model.mjs","line":65,"symbol":"resolveModel","note":"repoRoot precedence: --repo-root > meta.repoRoot > example tree | cwd"},{"path":"src/server/source.mjs","line":15,"symbol":"readSource","note":"path.resolve(repoRoot) is the sandbox root anchors resolve under"}],"status":"resolved"},{"id":"term-asc-sandbox","term":"sandbox / path-escape guard","category":"jargon","aka":["path escapes repo root","repo-root sandbox"],"definition":"The guard that keeps view-source reads inside the repo root. readSource resolves the anchor path against repoRoot and refuses (returning error 'path escapes repo root') any resolved path that is not the root itself or under `root + path separator`, blocking `../` traversal out of the analyzed checkout so a malicious/broken anchor can't read arbitrary files.","relatedNodes":["ext-source-fs"],"anchors":[{"path":"src/server/source.mjs","line":18,"symbol":"readSource","note":"abs must equal root or start with root + path.sep, else refuse"}],"status":"resolved"},{"id":"term-asc-scope","term":"scope","category":"jargon","aka":["--scope","local","project","user"],"definition":"The Claude MCP registration scope passed to `claude mcp add --scope`, one of a whitelisted set: `local` (this project, private to you), `project` (shared via a committed .mcp.json), or `user` (your global Claude settings). Determines WHERE RegisterMcp writes the server entry. es-view whitelists exactly these three (anything else is dropped, no --scope emitted) because the value is interpolated into a shell command.","relatedNodes":["cmd-register-mcp"],"anchors":[{"path":"src/server/mcp-register.mjs","line":11,"symbol":"SCOPES","note":"new Set(['local','project','user']) — the whitelist"},{"path":"src/server/mcp-register.mjs","line":14,"symbol":"claudeMcpAdd","note":"scopeArg only emitted when scope is whitelisted"}],"status":"resolved"},{"id":"term-mp-scout","term":"Scout","category":"role","aka":["inventory scout","the five scouts"],"definition":"A Phase-1 sub-agent that enumerates one lane of entry points so nothing is missing from the map. Five run in parallel: UI, Automations/background, API/auth/protocol, External integrations, and Data layer & implied aggregates. Their combined output is the flow-candidate inventory plus the shared-id glossary. Briefed read-only (inventory, don't mutate) but spawned as a recursion-capable type so they can chase high-signal pathways.","anchors":[{"path":"prompts/00-orchestrator.md","line":49,"symbol":"Phase 1","note":"spawn the five scouts concurrently, each briefed read-only"},{"path":"docs/METHOD.md","line":71,"symbol":"Phase 1","note":"five scouts, five lanes"}],"stat ity","aggregation","join","filter","lookup","constant","transformation"],"definition":"The enum on a field source naming the OPERATION applied to the column on its way into the field: identity, transformation, aggregation, join, filter, lookup, or constant. It is orthogonal to role (role = why the column matters; transform = what is done to it). Nonstandard values merge as warnings.","anchors":[{"path":"src/lib/merge.mjs","line":26,"symbol":"FIELD_TRANSFORMS"},{"path":"docs/flows-schema.md","line":100,"symbol":"transform enum"}],"status":"resolved"},{"id":"term-es-two-plane","term":"Two-plane model","category":"jargon","aka":["two planes","dataflow plane","command/aggregate plane","anti-corruption seam","ACL","translation slice"],"definition":"This repo's key modeling stance: the command/aggregate/event/policy grammar fits TRANSACTIONAL domains (intent that can be rejected), but a dataflow/ETL/pipeline stretch is a different plane that continuously transforms immutable records and cannot reject anything. Model the two planes joined at a named seam (an anti-corruption/translation step): everything on the dataflow side is plumbing kept in a command's tactical detail, and only domain-significant facts crossing the seam are promoted to events. In this self-model the merge and generate steps are ETL kept single-plane for exactly this reason.","anchors":[{"path":"docs/METHOD.md","line":123,"symbol":"The two-plane rule"},{"path":"docs/flows-schema.md","line":204,"symbol":"Conventions: dataflow stages are not aggregates"}],"status":"resolved"},{"id":"term-es-ubiquitous-language","term":"Ubiquitous Language","category":"concept","aka":["UL","domain vocabulary","glossary"],"definition":"The shared domain vocabulary that the code, the model, and the people all use for the same concept. Drift (the same concept under two ids/names) is what the merge's consistency pass hunts. Phase 5 promotes the vocabulary into a first-class curated glossary (the terms this file authors), distin function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const c of children) if (c != null) e.append(c);
  return e;
}

// the set of node ids a flow touches (steps + both ends of every edge)
function flowNodeIds(f) { return new Set([...(f.steps || []), ...(f.edges || []).flatMap(e => [e.from, e.to])]); }

// sidebar grouping. 'tier' keeps the original two buckets; 'actor'/'aggregate' pivot the list so
// each node of that type heads a group listing every flow it appears in (a flow with two actors
// shows under both). Returns [{ title, pred, color }].
function sidebarGroups() {
  if (groupMode === 'tier') {
    return [
      { title: 'Tier 1 — domain flows', pred: f => f.tier !== 2 },
      { title: 'Tier 2 — patterns', pred: f => f.tier === 2 },
    ];
  }
  const p = PALETTE[groupMode] || PALETTE.invariant;
  const flowsByNode = new Map();                       // nodeId -> Set(flowId)
  for (const f of MODEL.flows) for (const nid of flowNodeIds(f)) {
    const nn = nodeById.get(nid);
    if (!nn || nn.type !== groupMode) continue;
    (flowsByNode.get(nid) || flowsByNode.set(nid, new Set()).get(nid)).add(f.id);
  }
  const groups = [...flowsByNode.entries()]
    .map(([nid, fset]) => ({ node: nodeById.get(nid), fset }))
    .sort((a, b) => String(a.node.label).localeCompare(String(b.node.label)))
    .map(({ node, fset }) => ({ title: node.label, pred: f => fset.has(f.id), color: p.fill }));
  const covered = new Set();
  for (const fset of flowsByNode.values()) for (const fid of fset) covered.add(fid);
  if (MODEL.flows.some(f => !covered.has(f.id))) groups.push({ title: 'No ' + p.name.toLowerCase(), pred: f => !covered.has(f.id) });
  return groups;
}

function renderSidebar(filter) {
  const list = document.getElementById('flowlist');
  list.innerHTML = '';
  for (const g of sidebarGroups()) {
    const flows = MODEL.flows.filter(g.pred).filter(f => !filter || (f.name + f.id).toLowerCase().includes(filter));
    if (!flows.length) continue;
    const heading = el('div', { class: 'flow-group' });
    if (g.color) heading.append(el('span', { class: 'fg-dot', style: 'background:' + g.color }));
    heading.append(g.title);
    list.append(heading);
    const kindColor = { read: '#6FC993', policy: '#BF9BE0', write: '#6BA3E8' };
    for (const f of flows) {
      const dead = f.status && f.status !== 'live';
      const hs = (f.hotspots || []).length;
      const item = el('div', {
        class: 'flow-item' + (currentFlow && currentFlow.id === f.id ? ' active' : '') + (dead ? ' dim' : ''),
        style: '--kind:' + (kindColor[f.kind] || kindColor.write),
        title: f.name + (dead ? '  [' + f.status + (f.supersededBy ? ' → ' + f.supersededBy : '') + ']' : '') + '  ·  ' + (f.kind || 'write'),

      }, el('div', { class: 'nm' }, f.name));

      list.append(item);

  const legend = document.getElementById('legend');

    legend.append(el('span', { class: 'lg', style: 'background:' + p.fill + ';color:' + p.text }, p.name));
  }
}

// Render a single flow's board into the given lane element (sizing it), returning its {w,h}. No

function renderFlowInto(f, lane) {

  // Physical storage nodes (server/database/table/column) are a substrate, not steps in the

  const isData = id => { const n = nodeById.get(id); return n && DATA_TYPE_SET.has(n.type); };
  f = { ...f, steps: (f.steps || []).filter(id => !isData(id)), edges: (f.edges || []).filter(e => !isData(e.from) && !isData(e.to)) };
  const flowIds = new Set([...(f.steps || []), ...(f.edges || []).flatMap(e => [e.from, e.to])]);
  const stepIdx = {}; (f.steps || []).forEach((id, i) => (stepIdx[id] = i));

  // chain is a read INPUT, not part of the spine (e.g. a command reading aggregate state). Render
  // it like a read model - above-left of its reader, dotted arrow into the left edge - instead of
  // stacking it in a column beside the reader.
  const edgesByNode = {};

  const readSatIds = new Set();
  for (const n of nodesArr) {
    if (isRM(n) || isInv(n)) continue;
    const es = edgesByNode[n.id] || [];
    if (es.some(e => READ_VERBS.has(e.verb)) && !es.some(e => CAUSAL_VERBS.has(e.verb))) readSatIds.add(n.id);
  }
  const isSat = n => n && (isRM(n) || readSatIds.has(n.id));
  const spine = nodesArr.filter(n => !isSat(n) && !isInv(n));
  const spineIds = new Set(spine.map(n => n.id));

  // --- rank the spine (cycle-broken longest path) ---
  const spineEdges = (f.edges || []).filter(e => spineIds.has(e.from) && spineIds.has(e.to) && CAUSAL_VERBS.has(e.verb));
  const adj = {}; spine.forEach(n => (adj[n.id] = []));
  for (const e of spineEdges) adj[e.from].push(e.to);
  const state = {}, back = new Set();
  const dfs = u => { state[u] = 1; for (const v of adj[u]) { if (state[v] === 1) back.add(u + '|' + v); else if (!state[v]) dfs(v); } state[u] = 2; };
  const indeg = {}; spine.forEach(n => (indeg[n.id] = 0));
  for (const e of spineEdges) indeg[e.to]++;
  spine.filter(n => indeg[n.id] === 0).forEach(n => { if (!state[n.id]) dfs(n.id); });
  spine.forEach(n => { if (!state[n.id]) dfs(n.id); });
  const dagEdges = spineEdges.filter(e => !back.has(e.from + '|' + e.to));
  const rank = {}; spine.forEach(n => (rank[n.id] = 0));
  for (let it = 0; it < spine.length + 2; it++) { let ch = false; for (const e of dagEdges) if (rank[e.to] < rank[e.from] + 1) { rank[e.to] = rank[e.from] + 1; ch = true; } if (!ch) break; }
  const dind = {}; spine.forEach(n => (dind[n.id] = 0)); for (const e of dagEdges) dind[e.to]++;
  for (const n of spine) {
    if (n.type === 'actor' || dind[n.id] > 0) continue;
    const nb = (f.edges || []).filter(e => e.from === n.id || e.to === n.id).map(e => (e.from === n.id ? e.to : e.from)).filter(x => spineIds.has(x) && x !== n.id).map(x => rank[x]);
    if (nb.length) rank[n.id] = Math.max(0, Math.min(...nb));
  }

  // --- build INSTANCES: nodes duplicate so the flow stays strictly left-to-right ---
  let uid = 0;
  const insts = [], primary = {}, instsOf = {}, instByIid = {};
  const mk = (node, r, kind, anchorIid) => { const o = { iid: ++uid, id: node.id, node, rank: r, kind: kind || 'spine', anchorIid }; insts.push(o); (instsOf[node.id] ||= []).push(o); instByIid[o.iid] = o; return o; };
  spine.forEach(n => { primary[n.id] = mk(n, rank[n.id], 'spine'); });
  const drawn = [];
  for (const e of (f.edges || [])) {
    const nf = nodeById.get(e.from), nt = nodeById.get(e.to); if (!nf || !nt) continue;
    if (isSat(nf) || isSat(nt)) {                            // read input (read model, or a node only READ here): one copy per reference, ABOVE-LEFT of its reader
      const satId = isSat(nf) ? e.from : e.to, rdrId = isSat(nf) ? e.to : e.from, anchor = primary[rdrId]; if (!anchor) continue;
      const satInst = mk(nodeById.get(satId), anchor.rank, 'rm', anchor.iid);
      drawn.push({ from: satInst.iid, to: anchor.iid, verb: e.verb, dashed: true, rm: true }); // arrow leaves the read input, enters the reader's left side
    } else if (isInv(nt)) {                                  // invariant below its aggregate
      const anchor = primary[e.from]; if (!anchor) continue;
      const invInst = mk(nodeById.get(e.to), anchor.rank, 'inv', anchor.iid);
      drawn.push({ from: anchor.iid, to: invInst.iid, verb: '', dashed: true });
    } else if (isInv(nf)) { continue; }
    else if (CAUSAL_VERBS.has(e.verb)) {                     // causal: forward, duplicating target if it would go backward
      const u = primary[e.from]; if (!u) continue;
      const v = rank[e.to] > rank[e.from] ? primary[e.to] : mk(nodeById.get(e.to), rank[e.from] + 1, 'spine');
      drawn.push({ from: u.iid, to: v.iid, verb: e.verb, dashed: false });
    } else {                                                 // spine-spine query (e.g. reads): dotted, no dup
      const u = primary[e.from], v = primary[e.to]; if (!u || !v) continue;
      drawn.push({ from: u.iid, to: v.iid, verb: e.verb, dashed: true });
    }
  }

  // --- spine positions: x by rank, y by predecessor barycenter ---
  const COLW = 300, ROWH = 152;
  const spineInsts = insts.filter(o => o.kind === 'spine');
  const byRank = {}; spineInsts.forEach(o => (byRank[o.rank] ||= []).push(o));
  const ranks = Object.keys(byRank).map(Number).sort((a, b) => a - b);
  const preds = {}; spineInsts.forEach(o => (preds[o.iid] = []));
  for (const d of drawn) { const to = instByIid[d.to], from = instByIid[d.from]; if (!d.dashed && to.kind === 'spine' && from.kind === 'spine') preds[to.iid].push(from.iid); }
  const yOf = {};
  for (const r of ranks) {
    const col = byRank[r];
    col.forEach(o => { const ps = preds[o.iid]; o._pref = ps.length ? ps.reduce((s, i) => s + (yOf[i] ?? 0), 0) / ps.length : (stepIdx[o.id] ?? o.iid) * 0.001; });
    col.sort((a, b) => a._pref - b._pref);
    col.forEach((o, i) => { yOf[o.iid] = (i - (col.length - 1) / 2) * ROWH; o.x = r * COLW; o.y = yOf[o.iid]; });
  }

  // duplicated nodes get a unifying corner-dot color
  let dupI = 0; const dupColor = {};
  for (const id in instsOf) if (instsOf[id].length > 1) dupColor[id] = DUP_COLORS[dupI++ % DUP_COLORS.length];

  // place spine cards, measure them
  const cardByIid = {}, box = {};
  const measure = o => { const e = cardByIid[o.iid], b = { x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight }; b.cx = b.x + b.w / 2; b.cy = b.y + b.h / 2; box[o.iid] = b; };
  for (const o of spineInsts) { cardByIid[o.iid] = placeCard(o, lane, o.x, o.y, dupColor[o.id]); measure(o); }
  let spineTop = Infinity, spineBottom = -Infinity;
  spineInsts.forEach(o => { spineTop = Math.min(spineTop, box[o.iid].y); spineBottom = Math.max(spineBottom, box[o.iid].y + box[o.iid].h); });

  // satellites sit in bands strictly ABOVE (read models) / BELOW (invariants) the spine, packed by
  // x-interval so duplicates never overlap each other or a spine card. Dotted connectors reach them.
  const GAP = 26;
  const packBand = (list, above, xOf) => {
    if (!list.length) return;
    for (const o of list) { cardByIid[o.iid] = placeCard(o, lane, 0, 0, dupColor[o.id]); measure(o); }
    list.sort((a, b) => box[a.anchorIid].cx - box[b.anchorIid].cx);
    const rows = [];
    for (const o of list) { const b = box[o.iid], x = xOf(box[o.anchorIid], b.w); let r = 0; while (rows[r] && rows[r].some(iv => x < iv[1] + 18 && x + b.w > iv[0] - 18)) r++; (rows[r] ||= []).push([x, x + b.w]); o._row = r; o._x = x; }
    const rowH = rows.map((_, r) => Math.max(...list.filter(o => o._row === r).map(o => box[o.iid].h)));
    const rowTop = [];
    for (let r = 0; r < rows.length; r++) rowTop[r] = above ? (r === 0 ? spineTop - GAP - rowH[0] : rowTop[r - 1] - GAP - rowH[r]) : (r === 0 ? spineBottom + GAP : rowTop[r - 1] + rowH[r - 1] + GAP);
    for (const o of list) { const e = cardByIid[o.iid], b = box[o.iid]; e.style.left = o._x + 'px'; e.style.top = rowTop[o._row] + 'px'; b.x = o._x; b.y = rowTop[o._row]; b.cx = b.x + b.w / 2; b.cy = b.y + b.h / 2; }
  };
  // read models sit ABOVE and to the LEFT of their consumer (dotted arrow enters the consumer's left
  // side); invariants sit centered BELOW their aggregate.
  packBand(insts.filter(o => o.kind === 'rm'), true, (ab, w) => ab.x - w - 18);
  packBand(insts.filter(o => o.kind === 'inv'), false, (ab, w) => ab.cx - w / 2);

  // shift everything into positive space with padding; size the canvas
  const PAD = 40;
  let minL = Infinity, minT = Infinity;
  insts.forEach(o => { minL = Math.min(minL, box[o.iid].x); minT = Math.min(minT, box[o.iid].y); });
  const sx = PAD - minL, spineCenterY = PAD - minT;
  let maxR = 0, maxB = 0;
  for (const o of insts) { const e = cardByIid[o.iid], b = box[o.iid]; b.x += sx; b.y += spineCenterY; b.cx += sx; b.cy += spineCenterY; e.style.left = b.x + 'px'; e.style.top = b.y + 'px'; maxR = Math.max(maxR, b.x + b.w); maxB = Math.max(maxB, b.y + b.h); }
  lane.style.width = (maxR + PAD) + 'px'; lane.style.height = (maxB + PAD) + 'px';

  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'edges'); svg.setAttribute('width', maxR + PAD); svg.setAttribute('height', maxB + PAD);
  svg.innerHTML = '<defs>' +
    '<marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b7b7c2"/></marker>' +
    '<marker id="ahd" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7f7f8e"/></marker>' +
    '</defs>';
  lane.prepend(svg);

  // curved connectors (the flow is left-to-right thanks to duplication, so short forward hops)
  const edgeEls = [];
  for (const d of drawn) {
    const a = box[d.from], b = box[d.to]; if (!a || !b) continue;
    let p1, p2, dStr;
    if (d.rm) {                                   // read model -> enters the consumer's LEFT edge
      p1 = borderPoint(a, b.cx, b.cy);
      p2 = { x: b.x, y: Math.max(b.y + 12, Math.min(b.y + b.h - 12, a.cy)) };
      dStr = curveInto(p1, p2);
    } else {
      p1 = borderPoint(a, b.cx, b.cy); p2 = borderPoint(b, a.cx, a.cy);
      dStr = curveD(p1, p2);
    }
    const path = makePath(dStr, d.dashed); svg.append(path);
    let labelEl = null;
    if (d.verb && !d.dashed) { labelEl = el('div', { class: 'edge-verb', style: 'left:' + ((p1.x + p2.x) / 2) + 'px;top:' + ((p1.y + p2.y) / 2) + 'px' }, d.verb); lane.append(labelEl); }
    edgeEls.push({ path, labelEl, from: d.from, to: d.to });
  }

  // hover-focus. Light a set of instances + everything they connect to; dim the rest.
  // Hovering a STICKY focuses just that instance's neighborhood; hovering its corner DOT
  // focuses every duplicate of that node (and all their neighbors).
  const focusSet = S => {
    const keep = new Set(S), lit = new Set();
    edgeEls.forEach((ed, i) => { if (S.has(ed.from) || S.has(ed.to)) { lit.add(i); keep.add(ed.from); keep.add(ed.to); } });
    lane.classList.add('focusing');
    for (const o of insts) cardByIid[o.iid].classList.toggle('lo', !keep.has(o.iid));
    edgeEls.forEach((ed, i) => { const off = !lit.has(i); ed.path.classList.toggle('lo', off); if (ed.labelEl) ed.labelEl.classList.toggle('lo', off); });
  };
  const unfocus = () => { lane.classList.remove('focusing'); lane.querySelectorAll('.lo').forEach(e => e.classList.remove('lo')); };
  for (const o of insts) {
    const c = cardByIid[o.iid];
    c.addEventListener('mouseenter', () => focusSet(new Set([o.iid])));
    c.addEventListener('mouseleave', unfocus);
    const dot = c.querySelector('.dupdot');
    if (dot) {
      dot.addEventListener('mouseenter', () => focusSet(new Set(instsOf[o.id].map(x => x.iid))));
      dot.addEventListener('mouseleave', () => focusSet(new Set([o.iid])));  // back onto the sticky
    }
  }

  return { w: maxR + PAD, h: maxB + PAD };
}

// Single-flow board: render into #lane, then attach pan/zoom and fit to view.
function layoutFlow(f, lane) {
  const dim = renderFlowInto(f, lane);
  const wrap = document.getElementById('lane-wrap');
  const pz = setupPanZoom(wrap, lane);
  // double rAF so the board's flex height has settled before we compute the fit scale
  requestAnimationFrame(() => requestAnimationFrame(() => pz.fit(dim.w, dim.h)));
}

// Overview: render EVERY flow into its own bounded-context box and shelf-pack the boxes onto one
// pannable/zoomable canvas. Duplicates across flows are expected — each box is self-contained.
let overviewBuilt = false;
function renderOverview() {
  if (overviewBuilt) return;
  const canvas = document.getElementById('ov-canvas');
  canvas.innerHTML = '';
  const boxes = [];
  for (const f of MODEL.flows) {
    const dead = f.status && f.status !== 'live';
    const boxEl = el('div', { class: 'context-box' + (dead ? ' dead' : '') });
    const title = el('div', { class: 'ctx-title', title: 'Open "' + f.name + '" in the Flows board', onclick: () => selectFlow(f.id) }, f.name);
    if (dead) title.append(el('span', { class: 'badge ' + f.status }, f.status.toUpperCase() + (f.supersededBy ? ' → ' + f.supersededBy : '')));
    else if (f.kind) title.append(el('span', { class: 'ctx-kind' }, f.kind));
    const laneEl = el('div', { class: 'ctx-lane' });
    boxEl.append(title, laneEl);
    canvas.append(boxEl);
    renderFlowInto(f, laneEl);          // sizes laneEl; box grows to fit
    boxes.push({ boxEl });
  }
  // shelf-pack: place boxes left-to-right, wrapping to a new row past the target width
  const GAPX = 64, GAPY = 60, PAD = 48;
  const dims = boxes.map(b => ({ boxEl: b.boxEl, w: b.boxEl.offsetWidth, h: b.boxEl.offsetHeight }));
  const widest = Math.max(0, ...dims.map(d => d.w));
  const rowLimit = Math.max(1700, widest);
  let x = PAD, y = PAD, rowH = 0, canvasW = PAD;
  for (const d of dims) {
    if (x > PAD && x + d.w > rowLimit) { x = PAD; y += rowH + GAPY; rowH = 0; }
    d.boxEl.style.left = x + 'px'; d.boxEl.style.top = y + 'px';
    x += d.w + GAPX; rowH = Math.max(rowH, d.h); canvasW = Math.max(canvasW, x);
  }
  const W = canvasW - GAPX + PAD, H = y + rowH + PAD;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  overviewBuilt = true;
  const wrap = document.getElementById('ov-wrap');
  const pz = setupPanZoom(wrap, canvas, { zin: 'ov-zin', zout: 'ov-zout', zfit: 'ov-zfit' });
  requestAnimationFrame(() => requestAnimationFrame(() => pz.fit(W, H)));
}

// One pan/zoom controller for the board: wheel zooms toward the cursor, left-drag on the
// background pans, buttons zoom/fit. Attached to the persistent #lane-wrap once; later renders
// just swap in the new #lane and re-fit.
function setupPanZoom(wrap, lane, ids) {
  if (wrap.__pz) { wrap.__pz.lane = lane; return wrap.__pz; }
  ids = ids || { zin: 'zin', zout: 'zout', zfit: 'zfit' };
  const st = { wrap, lane, scale: 1, tx: 0, ty: 0, cw: 0, ch: 0 };
  const MIN = 0.12, MAX = 2.6;
  const apply = () => { st.lane.style.transform = 'translate(' + st.tx + 'px,' + st.ty + 'px) scale(' + st.scale + ')'; };
  st.fit = (cw, ch) => {
    st.cw = cw; st.ch = ch;
    const vw = wrap.clientWidth, vh = wrap.clientHeight, m = 48;
    st.scale = Math.max(MIN, Math.min(1, (vw - m) / cw, (vh - m) / ch));
    st.tx = (vw - cw * st.scale) / 2;
    st.ty = (vh - ch * st.scale) / 2;
    apply();
  };
  st.zoomAt = (factor, px, py) => {
    const ns = Math.min(MAX, Math.max(MIN, st.scale * factor)), k = ns / st.scale;
    st.tx = px - (px - st.tx) * k; st.ty = py - (py - st.ty) * k; st.scale = ns; apply();
  };
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    st.zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  let panning = false, sx = 0, sy = 0, ox = 0, oy = 0;
  wrap.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.sticky, .inv, .dupdot, .zoomctl, .ctx-title')) return;
    panning = true; sx = e.clientX; sy = e.clientY; ox = st.tx; oy = st.ty;
    wrap.classList.add('grabbing'); wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', e => { if (panning) { st.tx = ox + (e.clientX - sx); st.ty = oy + (e.clientY - sy); apply(); } });
  const endPan = e => { if (panning) { panning = false; wrap.classList.remove('grabbing'); try { wrap.releasePointerCapture(e.pointerId); } catch (_) { } } };
  wrap.addEventListener('pointerup', endPan);
  wrap.addEventListener('pointercancel', endPan);
  const btn = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  btn(ids.zin, () => st.zoomAt(1.25, wrap.clientWidth / 2, wrap.clientHeight / 2));
  btn(ids.zout, () => st.zoomAt(1 / 1.25, wrap.clientWidth / 2, wrap.clientHeight / 2));
  btn(ids.zfit, () => st.fit(st.cw, st.ch));
  wrap.__pz = st; return st;
}

function placeCard(o, lane, x, y, dupColor) {
  const n = o.node, p = PALETTE[n.type] || PALETTE.invariant;
  let c;
  if (n.type === 'invariant') {
    c = el('div', { class: 'inv', style: 'left:' + x + 'px;top:' + y + 'px;background:' + p.fill + ';border:1px dashed ' + p.edge + ';color:' + p.text, onclick: () => openDetail(n.id) }, '⚖ ' + n.label);
  } else {
    c = el('div', { class: 'sticky' + (selectedId === n.id ? ' selected' : ''), style: 'left:' + x + 'px;top:' + y + 'px;background:' + p.fill + ';border-color:' + p.edge + ';color:' + p.text, onclick: () => openDetail(n.id) },
      el('div', { class: 'ntype' }, p.name), el('div', { class: 'nlabel' }, n.label));
    const flags = [];
    if (n.ownedBy) flags.push('⛓ ' + n.ownedBy.replace(/^ext-/, ''));
    if (n.synchronous) flags.push('inline');
    if (flags.length) c.append(el('div', { class: 'flags' }, flags.join(' · ')));
  }
  if (dupColor) c.append(el('div', { class: 'dupdot', style: 'background:' + dupColor, title: 'this node appears more than once in the flow (same dot color = same node)' }));
  lane.append(c); return c;
}

// point on a box's border in the direction of (tx,ty)
function borderPoint(b, tx, ty) {
  const dx = tx - b.cx, dy = ty - b.cy;
  if (!dx && !dy) return { x: b.cx, y: b.cy };
  const s = Math.min(dx ? (b.w / 2) / Math.abs(dx) : Infinity, dy ? (b.h / 2) / Math.abs(dy) : Infinity);
  return { x: b.cx + dx * s, y: b.cy + dy * s };
}
function makePath(d, dashed) {
  const path = document.createElementNS(svgNS, 'path');
  path.setAttribute('d', d); path.setAttribute('fill', 'none');
  path.setAttribute('stroke', dashed ? '#7f7f8e' : '#b7b7c2'); path.setAttribute('stroke-width', dashed ? '1.5' : '2');
  path.setAttribute('stroke-linejoin', 'miter'); path.setAttribute('stroke-linecap', 'butt');
  if (dashed) path.setAttribute('stroke-dasharray', '4 4');
  path.setAttribute('marker-end', dashed ? 'url(#ahd)' : 'url(#ah)');
  return path;
}
// curved connector between two border points (used for read-model "spaghetti")
function curveD(p1, p2) {
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  if (Math.abs(dx) >= Math.abs(dy)) { const k = Math.max(22, Math.abs(dx) * 0.4), s = Math.sign(dx) || 1; return 'M' + p1.x + ',' + p1.y + ' C' + (p1.x + s * k) + ',' + p1.y + ' ' + (p2.x - s * k) + ',' + p2.y + ' ' + p2.x + ',' + p2.y; }
  const k = Math.max(18, Math.abs(dy) * 0.4), s = Math.sign(dy) || 1; return 'M' + p1.x + ',' + p1.y + ' C' + p1.x + ',' + (p1.y + s * k) + ' ' + p2.x + ',' + (p2.y - s * k) + ' ' + p2.x + ',' + p2.y;
}
// p2 sits on a card's LEFT edge; leave p1 going down, then arrive horizontally into p2 from the left.
function curveInto(p1, p2) {
  const k = Math.max(28, Math.abs(p2.x - p1.x) * 0.45);
  const c1y = p1.y + (p2.y >= p1.y ? 1 : -1) * Math.max(14, Math.min(40, Math.abs(p2.y - p1.y) * 0.5));
  return 'M' + p1.x + ',' + p1.y + ' C' + p1.x + ',' + c1y + ' ' + (p2.x - k) + ',' + p2.y + ' ' + p2.x + ',' + p2.y;
}

function selectFlow(id) {
  setMode('flows');                       // jumping to a flow (e.g. from a gallery card) shows the board
  currentFlow = MODEL.flows.find(f => f.id === id);
  selectedId = null;
  renderSidebar((document.getElementById('search').value || '').toLowerCase());
  renderFlow();
  closeDetail();
}

// ---- Gallery: every sticky in the model, filtered by type chips + text search ----
function nodeFlows(id) {
  return MODEL.flows.filter(f => (f.steps || []).includes(id) || (f.edges || []).some(e => e.from === id || e.to === id));
}
function syncChips() {
  galleryTypes.forEach(t => { const c = document.querySelector('.tchip[data-type="' + t + '"]'); if (c) c.classList.toggle('on', galleryState.active.has(t)); });
  const all = document.getElementById('chip-all');
  if (all) all.classList.toggle('on', galleryTypes.every(t => galleryState.active.has(t)));
}
function buildGallery() {
  const g = document.getElementById('gallery');
  g.innerHTML = '';
  const head = el('div', { class: 'gallery-head' });
  head.append(el('h2', {}, 'All stickies', el('span', { class: 'count', id: 'gcount' }, '')));
  const search = el('input', { class: 'gallery-search', id: 'gsearch', type: 'search', placeholder: 'Search stickies by name or description...' });
  search.addEventListener('input', e => { galleryState.q = e.target.value.toLowerCase(); renderGrid(); });
  head.append(search);
  const chips = el('div', { class: 'type-chips' });
  const allChip = el('div', { class: 'tchip tchip-all on', id: 'chip-all' }, 'All');
  allChip.addEventListener('click', () => { galleryTypes.forEach(t => galleryState.active.add(t)); syncChips(); renderGrid(); });
  chips.append(allChip);
  for (const t of galleryTypes) {
