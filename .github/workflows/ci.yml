name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # zero runtime dependencies — nothing to install
      - name: run tests (merge, generate, validator, manifests)
        run: npm test
      - name: build the example (smoke)
        run: npm run demo
